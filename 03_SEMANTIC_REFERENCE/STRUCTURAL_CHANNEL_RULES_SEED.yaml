# Seed Structural Channel Rules

channels:
  deprivation_channel:
    evidence:
      - lived_poverty
      - food_water_medicine_cash_insecurity
      - household_crisis_shock
      - service_delivery_failure
      - unemployment_or_income_loss
    forbidden_overread: "Do not treat deprivation as culture, passivity, ignorance, or moral failure."

  dignity_channel:
    evidence:
      - democracy_as_rights_or_voice
      - equality_before_law
      - anti_corruption_demand
      - civil_rights_support
      - social_justice_or_basic_needs
      - bodily_autonomy_support
    forbidden_overread: "Do not sentimentalize dignity; it is a structured demand."

  defiance_channel:
    evidence:
      - protest
      - petition
      - boycott
      - rejection_of_military_rule
      - refusal_of_authoritarian_alternatives
      - public_expression_despite_risk
      - anti_corruption_action
    forbidden_overread: "Do not pathologize defiance as instability."

  survival_channel:
    evidence:
      - family_borrowing
      - credit_dependence
      - informal_payment
      - wasta_or_influential_contact
      - charity_reliance
      - migration_intent
      - household_coping_measures
    forbidden_overread: "Do not turn survival strategy into personality."

  resentment_channel:
    evidence:
      - welfare_resentment
      - racial_resentment
      - immigrant_labor_threat
      - anti_tax_signals
      - elite_capture_perception
      - privatization_injustice
    forbidden_overread: "Do not infer hatred where the item only supports policy resentment."

  fear_management_channel:
    evidence:
      - crime_fear
      - gun_ownership_for_security
      - police_military_trust
      - terrorism_security_tradeoff
      - neighborhood_safety_fear
    forbidden_overread: "Do not equate fear management with authoritarian personality."

  faith_meaning_channel:
    evidence:
      - prayer
      - belief
      - religious_attendance
      - religious_identity
      - religious_comfort
      - moral_authority
    forbidden_overread: "Do not reduce faith to conservatism."

  public_voice_channel:
    evidence:
      - free_speech_support
      - public_expression
      - civic_action
      - association_membership
      - contact_government
      - protest_or_petition
    forbidden_overread: "Do not assume voice is safe or equally available."

  historical_wound_channel:
    evidence:
      - transition_memory_1989
      - war_or_occupation_memory
      - atrocity_naming
      - civil_rights_backlash_or_memory
      - AIDS_stigma_memory
      - post_9_11_security_memory
    forbidden_overread: "Do not convert historical wound into nostalgia."
