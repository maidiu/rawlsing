# Rawlsing v5 driver facet registry seed
#
# This file enumerates the facet families the atlas currently knows how to speak.
# Broad drivers stay stable; facets carry the narrower semantic slice.

version: v1_seed
notes:
  - "Facet coverage is still being deepened across survey families."
  - "Rows with blank driver_facet_id are broad rows that have not yet been assigned a specific facet."
  - "Some drivers are currently used as both the stable driver and the provisional facet until deeper subdivision is justified."

