name: C4R2A conservation proof

on:
  push:
    branches:
      - agent/c4r2a-seven-gap-conservation-repair-20260826
  workflow_dispatch:

jobs:
  c4r2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: python -m pip install --upgrade pip pandas pyarrow pyyaml
      - name: Run C4R2A conservation and V552J regression tests
        run: |
          python -m unittest             data.ddm_build_copy.test_c4r2a_v551j_v552j_v553_information_conservation             data.ddm_build_copy.test_w06_v552j_join
