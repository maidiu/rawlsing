name: A02 Z05 native admission

on:
  push:
    branches:
      - agent/verkhovod-a02-z05-native-admission-r1

permissions:
  contents: read

jobs:
  z05-native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Z05 current-line native admission surface
        run: >-
          python -m pytest -q
          rawlsing_next/tests/test_z05_vertical_lineage_native_admission.py
          rawlsing_next/tests/test_pre553_c11_repository_ingest.py
          rawlsing_next/tests/test_pre553_empirical_objects_authority.py
          rawlsing_next/tests/test_pre553_replay_audit.py
