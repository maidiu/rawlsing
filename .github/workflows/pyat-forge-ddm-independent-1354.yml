name: PYAT FORGE DDM independent 1354 review
on:
  push:
    branches: [agent/pyat-forge-ddm-1354-hostile-review-r1]
  workflow_dispatch:
jobs:
  exact_wide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git diff --exit-code f5e9c9a03ccddb5bdfab2114c5f5f551002914f6 -- rawlsing_next; lscpu; free -h; python -m pip freeze
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_economics.CountryNativeEconomics.test_wide_100_distinct_native_batch_and_cold_product -v
        env:
          PYAT_WIDE_ECONOMICS: '1'
  baseline_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git diff --exit-code f5e9c9a03ccddb5bdfab2114c5f5f551002914f6 -- rawlsing_next
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_carrier rawlsing_next.tests.test_pre553_country_numeric_hostile -v
      - run: python -m pytest -q rawlsing_next/tests/test_pre553_empirical_objects_authority.py rawlsing_next/tests/test_pre553_i03_grouping.py rawlsing_next/tests/test_universal_workload.py rawlsing_next/tests/test_universal_workload_custody.py
