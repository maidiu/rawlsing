name: C06 current routing ledger compiler

on:
  push:
    branches:
      - agent/verkhovod-c06-routing-ledger-compiler-r1

permissions:
  contents: read

jobs:
  c06-routing-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run C06 compiler and hostile validation tests
        run: python -m pytest -q rawlsing_next/tests/test_current_routing_ledger.py
