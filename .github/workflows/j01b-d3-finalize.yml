name: J01B D3 Arab Afro Asian finalize
on:
  push:
    branches:
      - agent/rabochii-subv-d-obl009-j01b-arab-afro-asian-succession-r1
    paths:
      - '.j01b_d3_transport/READY'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, validate, and seal D3 return
        shell: bash
        run: |
          set -euo pipefail
          T=.j01b_d3_transport
          OUT=data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/D_CURRENT_ADMISSION_JOINT_AUTHORITY_R1/WORKERS/D3_OBL009_J01B_ARAB_AFRO_ASIAN_SUCCESSION_R1/RETURN
          echo 'c52b8751906b71e0ec6530123b82cbf7f8d09733205101e63ec242598e8758c8  .j01b_d3_transport/chunk_aa' | sha256sum -c -
          echo '68708ad3c2069f178c2606e9fb0eb91e62cff9bf68d0ada90107537c072ab3ed  .j01b_d3_transport/chunk_ab' | sha256sum -c -
          echo 'e828297bb9085ae8489d2c66f09c6aa3a7396fb89989ec1891d9559fb0b2f671  .j01b_d3_transport/chunk_ac' | sha256sum -c -
          echo 'c2e28be25050e0b6ef767ac1987efc67ce895c9aa2479a0a3774b6d94811b2ec  .j01b_d3_transport/chunk_ad' | sha256sum -c -
          echo '02b4ec2dd875e6986ee8aa60bcaad54716f40cc1e8cc631ffd9c4346e1841d58  .j01b_d3_transport/chunk_ae' | sha256sum -c -
          echo 'b40d4a05efbbdc62d3233789810cd048f7aa1d38afda6f90fc4b2323c7286254  .j01b_d3_transport/chunk_af' | sha256sum -c -
          echo '30934cfbb8f530b166f22f2b88659d45dbb6bfd4fb81e49ac89b9bcda1024681  .j01b_d3_transport/chunk_ag' | sha256sum -c -
          echo 'a4d5d7cfa6d1e98e8c72048e0e99620f18b2849923c1426586dff802718f465d  .j01b_d3_transport/chunk_ah' | sha256sum -c -
          cat "$T"/chunk_a{a,b,c,d,e,f,g,h} > /tmp/d3_payload.b64
          test "$(wc -c < /tmp/d3_payload.b64)" -eq 88784
          base64 -d /tmp/d3_payload.b64 > /tmp/d3_payload.tar.xz
          echo 'd564465ec447674afec6b0c25bc72bf8c9bf2129ba6756f977c26a3189f0d42e  /tmp/d3_payload.tar.xz' | sha256sum -c -
          rm -rf "$OUT"
          mkdir -p "$OUT"
          tar -xJf /tmp/d3_payload.tar.xz -C "$OUT"
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" -eq 10
          test -f "$OUT/RESULT.md"
          test -f "$OUT/CURRENT_SUCCESSION_CROSSWALK.csv"
          test -f "$OUT/HISTORICAL_RESIDUAL_DISPOSITION.csv"
          test -f "$OUT/MATCH_EVIDENCE_MANIFEST.csv"
          test -f "$OUT/AMBIGUITIES.csv"
          test -f "$OUT/CURRENT_FREEZE_REVIEW_REQUESTS.csv"
          test -f "$OUT/COUNTS.json"
          test -f "$OUT/VALIDATION.json"
          test -f "$OUT/CHANGED_FILES.txt"
          test -f "$OUT/RETURN_POINTER.json"
          (
            cd "$OUT"
            echo '0c56b99138418f1ab0874a4cf1f2e90f25fc49a663d03502dc7afed8a2e61364  AMBIGUITIES.csv' | sha256sum -c -
            echo '92d19d09f08f6ac45775c34329de6955ec1caa7fabdb0a730f48961f954c7f46  CHANGED_FILES.txt' | sha256sum -c -
            echo 'ab1d7b8a5bb479c69b4f5f52280f3abc7e360551333e42c9417812b376a0163d  COUNTS.json' | sha256sum -c -
            echo 'c82d006885cf788c6deb11bcf3f9ed79202930d36fb0b0f312d2bd6db58d25e6  CURRENT_FREEZE_REVIEW_REQUESTS.csv' | sha256sum -c -
            echo 'd03ec31c57b306f971d0e08568565e666f68d0b9104601d7be886d501b7f8a95  CURRENT_SUCCESSION_CROSSWALK.csv' | sha256sum -c -
            echo '7391ee87caca6960bd7658b5379d05ef5b51a39346570424e07c39804debc24d  HISTORICAL_RESIDUAL_DISPOSITION.csv' | sha256sum -c -
            echo '53537cbba6e6800c32ab03f68a5030ea5eaf57cc766040135ed0c0426d209bb2  MATCH_EVIDENCE_MANIFEST.csv' | sha256sum -c -
            echo '8d70d4fa34e33acf5167757b793964d006584539cd2c4544e3c791777e0c1736  RESULT.md' | sha256sum -c -
            echo 'dbae01b9ac91c45fe680832b460cc0c730e002a375f361082bc49fc99ed552de  RETURN_POINTER.json' | sha256sum -c -
            echo 'b6f2c0f164e9a6d57c1fa0bb17a06380c234ee15d4a2f5069e45f49ff7eb43c3  VALIDATION.json' | sha256sum -c -
          )
          python - <<'PY'
          import csv, json, pathlib
          out = pathlib.Path("data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/D_CURRENT_ADMISSION_JOINT_AUTHORITY_R1/WORKERS/D3_OBL009_J01B_ARAB_AFRO_ASIAN_SUCCESSION_R1/RETURN")
          def rows(name):
              with (out/name).open(newline='', encoding='utf-8') as f:
                  return list(csv.DictReader(f))
          cross = rows("CURRENT_SUCCESSION_CROSSWALK.csv")
          residual = rows("HISTORICAL_RESIDUAL_DISPOSITION.csv")
          edges = rows("MATCH_EVIDENCE_MANIFEST.csv")
          amb = rows("AMBIGUITIES.csv")
          reviews = rows("CURRENT_FREEZE_REVIEW_REQUESTS.csv")
          assert len(cross) == 268
          assert len({r["current_source_structure_id"] for r in cross}) == 268
          assert {r["source_family"] for r in cross} == {"Arab Barometer","Afrobarometer","Asian Barometer"}
          assert len(residual) == 273
          assert len({r["historical_source_structure_id"] for r in residual}) == 273
          assert len(edges) == 217
          assert len(amb) == 43
          assert len(reviews) == 0
          counts = json.loads((out/"COUNTS.json").read_text())
          assert counts["frozen_current_global_rows"] == 1411
          assert counts["frozen_current_jurisdiction_rows"] == 268
          assert counts["historical_jurisdiction_structures"] == 460
          assert counts["historical_structures_referenced_by_current_relations"] == 187
          assert counts["historical_residual_rows"] == 273
          assert 187 + 273 == 460
          validation = json.loads((out/"VALIDATION.json").read_text())
          assert validation["status"] == "PASS"
          assert not validation["failures"]
          assert all(validation["checks"].values())
          pointer = json.loads((out/"RETURN_POINTER.json").read_text())
          assert pointer["status"] == "PASS"
          assert pointer["validation"] == "PASS"
          assert pointer["success_token"] == "PASS__SUBV_D_OBL009_J01B_ARAB_AFRO_ASIAN_SUCCESSION_CURRENT_GRAIN_R1"
          result = (out/"RESULT.md").read_text()
          assert "PASS__SUBV_D_OBL009_J01B_ARAB_AFRO_ASIAN_SUCCESSION_CURRENT_GRAIN_R1" in result
          PY
          rm -rf "$T" .github/workflows/j01b-d3-finalize.yml
          git config user.name 'rawlsing-rabochii-d3'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort
          test "$(git diff --cached --name-only | grep -c "^$OUT/")" -eq 10
          test "$(git diff --cached --name-only | grep -c '^\.j01b_d3_transport/')" -eq 9
          git commit -m 'D3 OBL009 J01B Arab Afro Asian: seal succession PASS'
          git push origin "HEAD:${GITHUB_REF_NAME}"
