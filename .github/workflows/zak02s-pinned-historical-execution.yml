name: ZAK-02S pinned historical synthetic S2 witness
on:
  push:
    branches:
      - agent/zak02s-legacy-execution-20261114
  pull_request:
    branches:
      - integration/pre-main-reconciliation-r1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-six-family:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bounded candidate branch
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout immutable legacy implementation
        uses: actions/checkout@v4
        with:
          ref: 9253064bc9423a0f0ccda4fbdea43c2f54f800c6
          path: legacy
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated sourcefree harness dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.2.6 scipy==1.14.1 pyarrow==18.1.0 duckdb==1.1.3 PyYAML python-dotenv psycopg2-binary
      - name: Execute actual pinned functions (positive / negative / restore)
        run: |
          cd "$GITHUB_WORKSPACE/candidate"
          python -u WORKER_RETURNS/ZAK02S_LEGACY_EXECUTION_20261114/run_historical.py --legacy "$GITHUB_WORKSPACE/legacy" --out "$GITHUB_WORKSPACE/zak02s-results.json"
      - name: Upload exact machine-readable evidence even when a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zak02s-pinned-function-results
          path: zak02s-results.json
          if-no-files-found: warn
