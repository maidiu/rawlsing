name: PYAT FORGE DDM independent mutation oracle
on:
  push:
    branches: [agent/pyat-forge-ddm-1354-hostile-review-r1]
  workflow_dispatch:
concurrency:
  group: pyat-1354-mutants-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin f5e9c9a03ccddb5bdfab2114c5f5f551002914f6; git diff --exit-code f5e9c9a03ccddb5bdfab2114c5f5f551002914f6 HEAD -- rawlsing_next
      - run: python -m unittest tools.pyat_forge_ddm_1354_hostile -v
