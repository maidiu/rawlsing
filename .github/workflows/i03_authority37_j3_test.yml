name: I03 Authority37 J3 bounded tests

on:
  push:
    branches:
      - agent/verkhovod-fracturemap-i03-j3-topology-r1

permissions:
  contents: read

jobs:
  i03-j3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run I03 and bounded regression surfaces
        run: >-
          python -m pytest -q
          rawlsing_next/tests/test_pre553_empirical_query.py
          rawlsing_next/tests/test_pre553_discovery_exact.py
          rawlsing_next/tests/test_pre553_replay_audit.py
          rawlsing_next/tests/test_pre553_empirical_objects_authority.py
          rawlsing_next/tests/test_pre553_query_frontier_hostile.py
