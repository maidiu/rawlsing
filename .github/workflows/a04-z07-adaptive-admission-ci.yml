name: A04 Z07 adaptive admission verification
on:
  push:
    branches:
      - agent/verkhovod-a04-z07-adaptive-admission-r1
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest pandas pyarrow
      - run: >
          python -m pytest -q
          rawlsing_next/tests/test_pre553_discovery_adaptive.py
          rawlsing_next/tests/test_pre553_discovery_adaptive_admission.py
          rawlsing_next/tests/test_pre553_discovery_exact.py
          rawlsing_next/tests/test_pre553_empirical_objects_authority.py
          rawlsing_next/tests/test_pre553_empirical_query.py
