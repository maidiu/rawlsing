name: Sorok C9-R3B vs PRE-MAIN FIABC RED Baseline Comparison (NON-ACCEPTANCE)

on:
  pull_request:
    paths:
      - 'SOROK_PRODUCT_CONTROL_ROOM/V3_COURTS/SYN02/POST_R2_REVIEW/R3/C9_SQL/**'
      - 'SOROK_PRODUCT_CONTROL_ROOM/V3_COURTS/SYN02/POST_R2_REVIEW/R3/C9_READER/**'
      - '.github/workflows/sorok-c9r3b-premain-fiabc-baseline-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout exact PRE-MAIN baseline (never update)
        uses: actions/checkout@v4
        with:
          ref: 299f41e97a43c67be9cc76a79fa49b48f4e12e54
          path: premain_baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install controlled FIABC pytest dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Execute EXACT original FIABC court on both code trees and compare failures
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile, xml.etree.ElementTree as ET
          work = pathlib.Path.cwd()
          tests = json.loads((work/"premain_baseline/.rabochii/court_spec.json").read_text())["tests"]
          assert len(tests) == 8, "BASELINE_SPEC_CHANGED"
          env = dict(os.environ, PYTHONHASHSEED="0", PYTEST_DISABLE_PLUGIN_AUTOLOAD="1")
          def run(tree, xml):
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", "--junitxml", str(xml), *tests],
                  cwd=work/tree, env=env, text=True, capture_output=True, check=False,
                  timeout=300)
              print(tree, result.stdout[-2600:], result.stderr[-300:])
              if not xml.is_file(): raise SystemExit(tree + ":NO_JUNIT")
              root = ET.parse(xml).getroot()
              cases = list(root.iter("testcase"))
              failures = sorted((node.attrib.get("classname"), node.attrib.get("name"))
                                for node in cases if node.find("failure") is not None or node.find("error") is not None)
              skipped = sum(node.find("skipped") is not None for node in cases)
              return {"return_code":result.returncode,"cases":len(cases),"failures":failures,"skipped":skipped}
          with tempfile.TemporaryDirectory() as d:
              baseline = run("premain_baseline", pathlib.Path(d)/"base.xml")
              candidate = run("candidate", pathlib.Path(d)/"candidate.xml")
          receipt = {"schema":"SOROK_FIABC_BASELINE_COMPARATOR_R1","premain":"299f41e97a43c67be9cc76a79fa49b48f4e12e54",
                     "baseline":baseline,"candidate":candidate,
                     "same_failures":baseline["failures"]==candidate["failures"],
                     "state":"BASELINE_DIAGNOSTIC_NOT_FIABC_ACCEPTANCE"}
          print(json.dumps(receipt,indent=2,sort_keys=True))
          if not (baseline["cases"]>=147 and candidate["cases"]==baseline["cases"]
                  and baseline["skipped"]==candidate["skipped"] and
                  baseline["return_code"]==candidate["return_code"] and
                  baseline["failures"]==candidate["failures"]):
              raise SystemExit("FIABC_BASELINE_REGRESSION_OR_COURT_DISCREPANCY__HOLD")
          if baseline["failures"]:
              print("FIABC_BASELINE_PREEXISTING_RED_AT_BOTH_CUTS__NOT_PRODUCT_PASS")
          else:
              print("FIABC_NO_RED_IN_BOTH_CUTS__NOT_SOROK_NATIVE_GRANT")
          PY

# Failure equivalence documents a baseline condition; it does not grant a
# passing full PRE-MAIN governed court or permission to edit FIABC oracles.
