name: RRIF M2 sourcefree receiving

on:
  pull_request:
    paths:
      - "rawlsing_next/pre553_learned_product_lifecycle.py"
      - "rawlsing_next/pre553_learned_product_release.py"
      - "rawlsing_next/tests/test_pre553_learned_product_release.py"
      - "rawlsing_next/tests/test_pre553_s06g_atomic_integrity.py"
      - "rawlsing_next/tests/test_pre553_e5_s06g_independent_hostile.py"
      - "rawlsing_next/tests/test_rrif_e6_independent_replay.py"
      - ".github/workflows/rrif-m2-sourcefree-receiving.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourcefree-m2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install qualified test dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas==2.3.1 pyreadstat==1.3.2
      - name: Verify unchanged historical v1.0 acceptance blob
        run: |
          test "$(git hash-object rawlsing_next/tests/historical/HQ118_M2_ACCEPTED_28_V1_0_0.py.txt)" = "d45b54190815b4c6af506579962a9aac8a7074c2"
      - name: Run active v1.1 B5 M2 S06G E2 E6 and adjacent suites without exclusions
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=.rrif-m2-modern.xml \
            rawlsing_next/tests/test_pre553_learned_product_lifecycle.py \
            rawlsing_next/tests/test_pre553_learned_product_release.py \
            rawlsing_next/tests/test_pre553_s06g_atomic_integrity.py \
            rawlsing_next/tests/test_pre553_e5_s06g_independent_hostile.py \
            rawlsing_next/tests/test_rrif_e6_independent_replay.py \
            rawlsing_next/tests/test_pre553_ee14_selected_current_asof_hq260.py \
            rawlsing_next/tests/test_pre553_learned_world_composition.py
      - name: Upload full modern court JUnit even if red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrif-m2-sourcefree-junit-${{ github.run_id }}
          path: .rrif-m2-modern.xml
          if-no-files-found: warn
