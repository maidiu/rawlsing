name: B20Q transient Route-C qualification

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-route-c-cacc1-cacc2-parity-qualification-r1

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commissioned B20Q tree
        uses: actions/checkout@v4
        with:
          ref: 3cc730b04a4da31b97b80c8d1bf612da4301a9bf
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate pinned qualification environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas pytest

      - name: Execute frozen B20 qualification twice
        shell: bash
        run: |
          set -u
          DRIVER='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1/WORKERS/B20_AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_R1/01_ROUTE_C_IMPLEMENTATION_QUALIFICATION.py'
          OUT="$RUNNER_TEMP/b20q-artifact"
          mkdir -p "$OUT"
          python - <<'PY' > "$OUT/environment.json"
          import json, platform, sys
          import pandas, pyarrow
          print(json.dumps({
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "pyarrow_version": pyarrow.__version__,
              "pandas_version": pandas.__version__,
          }, sort_keys=True, separators=(",", ":")))
          PY
          git rev-parse HEAD > "$OUT/executed_tree_head.txt"
          git hash-object rawlsing_next/pre553_route_c_accelerators.py > "$OUT/implementation_git_blob.txt"
          git hash-object "$DRIVER" > "$OUT/qualification_driver_git_blob.txt"
          sha256sum rawlsing_next/pre553_route_c_accelerators.py | awk '{print $1}' > "$OUT/implementation_sha256.txt"
          sha256sum "$DRIVER" | awk '{print $1}' > "$OUT/qualification_driver_sha256.txt"

          git worktree add --detach "$RUNNER_TEMP/b20q-work-1" 3cc730b04a4da31b97b80c8d1bf612da4301a9bf
          git worktree add --detach "$RUNNER_TEMP/b20q-work-2" 3cc730b04a4da31b97b80c8d1bf612da4301a9bf

          run_one () {
            idx="$1"
            work="$RUNNER_TEMP/b20q-work-$idx"
            out="$OUT/run$idx"
            mkdir -p "$out"
            printf '%s\n' "PYTHONPATH=$work python $work/$DRIVER --output $out/qualification_receipt.json" > "$out/command.txt"
            set +e
            PYTHONPATH="$work" python "$work/$DRIVER" --output "$out/qualification_receipt.json" >"$out/stdout.txt" 2>"$out/stderr.txt"
            code=$?
            printf '%s\n' "$code" > "$out/exit_code.txt"
            sha256sum "$out/stdout.txt" | awk '{print $1}' > "$out/stdout_sha256.txt"
            sha256sum "$out/stderr.txt" | awk '{print $1}' > "$out/stderr_sha256.txt"
            if [ -f "$out/qualification_receipt.json" ]; then
              sha256sum "$out/qualification_receipt.json" | awk '{print $1}' > "$out/qualification_receipt_sha256.txt"
            fi
            return "$code"
          }

          set +e
          run_one 1
          C1=$?
          run_one 2
          C2=$?
          set -e

          python - "$OUT" "$C1" "$C2" <<'PY'
          import hashlib, json, pathlib, sys
          out=pathlib.Path(sys.argv[1]); c1=int(sys.argv[2]); c2=int(sys.argv[3])
          expected_terminal="AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_IMPLEMENTATION_COMPLETE__READY_FOR_COMMON_ABC_HARNESS_INTAKE"
          runs=[]
          for idx, code in ((1,c1),(2,c2)):
              d=out/f"run{idx}"
              receipt=None
              p=d/"qualification_receipt.json"
              if p.exists():
                  receipt=json.loads(p.read_text())
              runs.append({
                  "index":idx,
                  "exit_code":code,
                  "receipt":receipt,
                  "stdout_sha256":(d/"stdout_sha256.txt").read_text().strip(),
                  "stderr_sha256":(d/"stderr_sha256.txt").read_text().strip(),
                  "qualification_receipt_sha256":(d/"qualification_receipt_sha256.txt").read_text().strip() if (d/"qualification_receipt_sha256.txt").exists() else None,
              })
          def good(r):
              x=r["receipt"]
              if r["exit_code"]!=0 or not isinstance(x,dict): return False
              single=x.get("single_process",{})
              fresh=x.get("fresh_process_replay",{})
              return (
                  x.get("status")=="PASS"
                  and x.get("terminal")==expected_terminal
                  and x.get("pinned_pyarrow_version")=="25.0.1"
                  and single.get("accelerator_count")==2
                  and single.get("real_c09_execution_count")==0
                  and single.get("wvs7_execution_count")==0
                  and single.get("architecture_ranking_count")==0
                  and fresh.get("status")=="PASS"
                  and fresh.get("process_count")==2
              )
          same_keys=("cacc1","cacc2","cacheless_release_ref","cacheless_replay_ref","query_fact_refs","discovery_frontier_ref","discovery_receipt_refs")
          outer_same=False
          if all(isinstance(r["receipt"],dict) for r in runs):
              a=runs[0]["receipt"].get("single_process",{})
              b=runs[1]["receipt"].get("single_process",{})
              outer_same=all(a.get(k)==b.get(k) for k in same_keys)
          result={
              "schema":"B20Q_TRANSIENT_EXECUTION_RESULT@1.0.0",
              "commissioned_tree_head":"3cc730b04a4da31b97b80c8d1bf612da4301a9bf",
              "expected_implementation_terminal":expected_terminal,
              "pinned_pyarrow_version":"25.0.1",
              "runs":runs,
              "outer_replay_keys":list(same_keys),
              "outer_replay_exact_identity_match":outer_same,
              "status":"PASS" if all(good(r) for r in runs) and outer_same else "FAIL",
          }
          data=(json.dumps(result,sort_keys=True,separators=(",",":"))+"\n").encode()
          (out/"execution_result.json").write_bytes(data)
          (out/"execution_result_sha256.txt").write_text(hashlib.sha256(data).hexdigest()+"\n")
          print(json.dumps({"status":result["status"],"outer_replay_exact_identity_match":outer_same},sort_keys=True))
          if result["status"]!="PASS":
              raise SystemExit(1)
          PY

      - name: Upload B20Q qualification execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20q-route-c-qualification
          path: ${{ runner.temp }}/b20q-artifact
          if-no-files-found: error
