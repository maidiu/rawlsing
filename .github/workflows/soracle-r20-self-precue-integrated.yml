name: SORACLE R20 historical self and pre-cue sourcefree court

on:
  push:
    branches:
      - agent/soracle-r20-psychic-self-labor-integrated-20261120
      - agent/soracle-co-r27-mulchineering-contingent-event-reentry-20261121-r1
      - agent/soracle-co-mulchineer-recursive-encounter-20261124-r1
      - agent/soracle-co-mulchineer-dissimilar-means-20261124-r1
      - agent/soracle-co-mulchineer-functional-afterlife-20261124-r1
      - agent/soracle-co-mulchineer-elastic-entrance-20261124-r1
      - agent/soracle-co-mulchineer-dependency-new-means-20261124-r1
      - agent/soracle-co-mulchineer-dependency-project-20261124-r1
      - agent/soracle-co-mulchineer-project-reorganization-20261124-r1
      - agent/soracle-co-mulchineer-project-means-history-20261124-r1
      - agent/soracle-co-mulchineer-course-ambivalence-20261124-r1
      - agent/soracle-co-mulchineer-plural-activity-affect-20261124-r1
      - agent/soracle-co-mulchineer-private-rehearsal-20261125-r1
      - agent/soracle-co-mulchineer-structural-periods-20261125-r1
      - agent/soracle-co-mulchineer-focal-reception-20261125-r1
      - agent/soracle-co-mulchineer-acquired-material-facility-20261125-r1
      - agent/soracle-co-mulchineer-expressive-body-20261125-r1
      - agent/soracle-co-mulchineer-fallible-institutional-expectation-20261125-r1
      - agent/soracle-co-mulchineer-staged-genealogy-20261125-r1
      - agent/soracle-co-mulchineer-interactivity-pressure-20261125-r1
      - agent/soracle-co-mulchineer-productive-vocal-genesis-20261125-r1
      - agent/soracle-co-mulchineer-reciprocal-witness-20261126-r1
      - agent/soracle-co-mulchineer-counterhistory-release-20261126-r1
    paths:
      - 'SEAM/ORACLE/UM_SOROK_ORGANISM_R3/**'
      - '.github/workflows/soracle-r20-self-precue-integrated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r20-organism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source identity
        run: |
          git rev-parse HEAD
          git status --porcelain
      - name: Compile every organism module
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m compileall -q um_sorok_organism
      - name: R51 productive vocal genesis actual continuation
        if: github.ref_name == 'agent/soracle-co-mulchineer-productive-vocal-genesis-20261125-r1'
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_productive_vocal_genesis_r51.py' -v
      - name: R52 reciprocal productive witnessing
        if: github.ref_name == 'agent/soracle-co-mulchineer-reciprocal-witness-20261126-r1'
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_productive_witness_r52.py' -v
      - name: R53 counterhistory release
        if: github.ref_name == 'agent/soracle-co-mulchineer-counterhistory-release-20261126-r1'
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_counterhistory_release_r53.py' -v
      - name: R20 historical self and pre-cue focus
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_historical_self_precue_r19.py' -v
      - name: R33 recursive encounter focus
        if: github.ref_name == 'agent/soracle-co-mulchineer-recursive-encounter-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-structural-periods-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-focal-reception-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-acquired-material-facility-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-expressive-body-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-fallible-institutional-expectation-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-staged-genealogy-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-interactivity-pressure-20261125-r1'
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_pre_encounter_history_r21.py' -v
      - name: R34 dissimilar means focus
        if: github.ref_name == 'agent/soracle-co-mulchineer-dissimilar-means-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-functional-afterlife-20261124-r1'
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_r11_soracle_integrated.py' -v
      - name: R36 upstream elasticity focus
        if: github.ref_name == 'agent/soracle-co-mulchineer-elastic-entrance-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-dependency-new-means-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-dependency-project-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-project-reorganization-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-project-means-history-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-course-ambivalence-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-plural-activity-affect-20261124-r1' || github.ref_name == 'agent/soracle-co-mulchineer-private-rehearsal-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-structural-periods-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-focal-reception-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-acquired-material-facility-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-expressive-body-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-fallible-institutional-expectation-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-staged-genealogy-20261125-r1' || github.ref_name == 'agent/soracle-co-mulchineer-interactivity-pressure-20261125-r1'
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -p 'test_r11_soracle_integrated.py' -v
      - name: Full inherited R3-R20 normal
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -v
      - name: Full inherited R3-R20 optimized
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -O -m unittest discover -s tests -v
      - name: Whole-organism sourcefree smoke
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m um_sorok_organism demo --db /tmp/soracle_r20_organism.sqlite3

# Author-level sourcefree execution only, not independent REMONT/G5 or protected receiving.
