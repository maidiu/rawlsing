name: A03 Z06 Maintenance Runtime Admission

on:
  push:
    branches:
      - agent/verkhovod-a03-z06-maintenance-admission-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  z06-runtime-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact A03 branch commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Z06 hostile maintenance admission
        run: python -m pytest -q rawlsing_next/tests/test_pre553_authority_maintenance.py
