name: SOROK MII exact-cut PRE-MAIN integration receiving
on:
  push:
    branches:
      - review/sorok-mii-premain-integration-20261111-r1
  pull_request:
    branches:
      - integration/pre-main-reconciliation-r1
    paths:
      - 'WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/**'
      - 'WORKER_RETURNS/SOROK-MII-COMPLETE-CONSTRUCTION-20261111-R1/**'
      - 'WORKER_REVIEWS/SOROK-MII-5EABD82-CLOSURE-R4/**'
      - '.github/workflows/sorok-mii-premain-joined-20261111.yml'
permissions:
  contents: read
jobs:
  exact-cut-blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact reviewed runtime and evidence; no modified source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/house.py)" = "af556c143e7e4eaa2f60a68fa402954091737dd4"
          # Original accepted MII P6 SHA stays binding for unmodified MII-only trees.
          # A reviewed MI integration may version only P6's historical inspection
          # and cold boundary with the separately reviewed exact MI source closure.
          p6_sha="$(git rev-parse HEAD:WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/run_p6.py)"
          case "$p6_sha" in
            fcc73ca5cdfced764503350368b843cd267f576c)
              : ;;
            044a3e11e9b21849df52b62d7e4e5646c56756e2)
              test "$(git rev-parse HEAD:rawlsing_next/sorok_history/owner.py)" = "4352415bc120e37abab4da989c00193221266af6"
              test "$(git rev-parse HEAD:WORKER_REVIEWS/SOROK-MI-COMPLETION-INDEPENDENT-20261111-R1/01_CLOSURE_R2.md)" = "2cf593d02c56f995904d7d6860610f5faa549790"
              ;;
            *)
              echo "Unreviewed P6 entrypoint blob: $p6_sha" >&2
              exit 1 ;;
          esac
          test "$(git rev-parse HEAD:WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/mii.py)" = "37dcd7029dd0a1fe25ef36bebfcd1f8b349f31dc"
          test "$(git rev-parse HEAD:WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_mii.py)" = "5aca54b0b2a24d2202438c2bbeac5003b05a7187"
          test "$(git rev-parse HEAD:WORKER_REVIEWS/SOROK-MII-5EABD82-CLOSURE-R4/00_RECEIVING.md)" = "b1fedb223a73a7fc2fcf53b5c87997ef413bec1d"
          test "$(git rev-parse HEAD:WORKER_REVIEWS/SOROK-MII-5EABD82-CLOSURE-R4/test_prior_final_reproducer.py)" = "8d75b52b1dd0fd19594e633e3fac9dee7d5478e2"
          test "$(git rev-parse HEAD:WORKER_REVIEWS/SOROK-MII-5EABD82-CLOSURE-R4/test_replay_interrupted.py)" = "33cb831c6192fa6ed356231d64f9d1b9ca8e5e41"
          python -m compileall -q WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1
  sourcefree-mii:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run full integrated 18-case MII court
        run: |
          python -B -m pytest -x -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_mii.py
      - name: Re-run independent final reproducer and interrupted derivative replay
        run: |
          python -B -m pytest -x -q -p no:cacheprovider --tb=short WORKER_REVIEWS/SOROK-MII-5EABD82-CLOSURE-R4/test_prior_final_reproducer.py WORKER_REVIEWS/SOROK-MII-5EABD82-CLOSURE-R4/test_replay_interrupted.py
