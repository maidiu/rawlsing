name: PROGRAMMA canonical tree integrity

on:
  pull_request:
    branches:
      - integration/pre-main-reconciliation-r1
  push:
    branches:
      - integration/pre-main-reconciliation-r1

jobs:
  canonical-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: MCR authoring validator self-test (existing checker)
        run: |
          python3 -m py_compile CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py
          python3 CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py --self-test
      - name: Reject invalid new or revised copy-paste commissions
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          MCR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$MCR_BASE_SHA" HEAD > /tmp/mcr-changed-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          paths = Path("/tmp/mcr-changed-paths.txt").read_text().splitlines()
          checked = 0
          for name in paths:
              path = Path(name)
              if not path.is_file() or path.suffix.lower() not in {".md", ".txt"}:
                  continue
              if not name.startswith("WORKER_COMMISSIONS/"):
                  continue
              body = path.read_text(encoding="utf-8")
              is_launch_path = ("FLIGHT_LAUNCHES/" in name or
                                any(term in path.name.upper()
                                    for term in ("FULL_COPY_PASTE", "LAUNCH", "COMMISSION")))
              is_launch_body = bool(re.search(r"(?m)^LAUNCH\s", body) or
                                    re.search(r"(?m)^```text\nLAUNCH\s", body))
              if not (is_launch_path or is_launch_body):
                  continue
              checked += 1
              cmd = ["python3", "CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py",
                     name, "--source-check"]
              print("MCR AUTHORING SOURCE AND CONTRACT CHECK", name, flush=True)
              subprocess.run(cmd, check=True)
          print("MCR_CHANGED_COMMISSIONS_VALIDATED=" + str(checked))
          PY
      - name: Verify canonical PROGRAMMA guide and historical no-drop
        run: python3 CROSS_HQ_CONTROL_ROOM/PROGRAMMA/verify_canonical_programma_r1.py
      - name: Prevent loss of mandatory product question and 27 local PP26 obligations
        run: |
          python3 CROSS_HQ_CONTROL_ROOM/PROGRAMMA/verify_pyat_product_priority_visibility_r1.py
          python3 CROSS_HQ_CONTROL_ROOM/PROGRAMMA/verify_pyat_product_priority_visibility_r1.py --self-test

      - name: G4 and OATH source-preservation first pass
        run: |
          node PYAT_CONTROL_ROOM/PROGRAMMA_PYAT/05_ROADMAP/verify_g4_once_currentness.mjs --self-test
          node PYAT_CONTROL_ROOM/PROGRAMMA_PYAT/05_ROADMAP/verify_g4_once_currentness.mjs
          python3 - <<'PY'
          from pathlib import Path
          files = ("CROSS_HQ_CONTROL_ROOM/PROGRAMMA/00_PROGRAMMA_RAWLSING.md",
                   "PYAT_CONTROL_ROOM/PROGRAMMA_PYAT/00_PROGRAMMA_PYAT.md",
                   "SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/00_PROGRAMMA_SOROK.md")
          fronts = [Path(f).read_text().split("<!-- HQ_OATH_R2_FIRST_CONTACT_END -->")[0] for f in files]
          assert all(x == fronts[0] for x in fronts), "OATH_FIRST_CONTACT_MISMATCH"
          assert "CLAIM-TO-EVIDENCE DISCIPLINE" in fronts[0], "OATH_CLAIM_EVIDENCE_MISSING"
          print("OATH_THREE_FRONTDOORS_CLAIM_EVIDENCE_PRESENT__SOURCE_CHECK_ONLY")
          PY
      - name: Python syntax check for new S04 and F6 modules
        run: |
          python3 -m py_compile rawlsing_next/pre553_interpretation_qualification.py rawlsing_next/pre553_s04_observed_research.py rawlsing_next/pre553_s04_general_joint_algebra.py rawlsing_next/pre553_s04_dhikr_comparative.py rawlsing_next/pre553_s04_adaptive_support.py rawlsing_next/pre553_s04_exploration_admission.py rawlsing_next/pre553_s04_country_refinement.py rawlsing_next/pre553_s04_determinicity_cycle.py rawlsing_next/pre553_s04_partially_identified_repertoire.py rawlsing_next/pre553_s04_uncertain_repertoire.py rawlsing_next/pre553_source_country_registry_adapter.py
