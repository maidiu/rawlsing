name: PYAT W03-W04 compact and cold C11 first-consumer court

on:
  pull_request:
    paths:
      - 'rawlsing_next/_pre553_w03_cold_compact.py'
      - 'rawlsing_next/_pre553_w04_cache.py'
      - 'rawlsing_next/_pre553_c11_execution_view.py'
      - 'rawlsing_next/_pre553_query_common.py'
      - 'rawlsing_next/_pre553_query_eval.py'
      - 'rawlsing_next/_pre553_query_predicate.py'
      - 'rawlsing_next/pre553_source_backed_c11_facade.py'
      - 'rawlsing_next/pre553_c11_ingest.py'
      - 'rawlsing_next/pre553_c11_repository.py'
      - 'rawlsing_next/pre553_carrier_execution.py'
      - 'rawlsing_next/pre553_empirical_objects.py'
      - 'rawlsing_next/pre553_empirical_query.py'
      - 'rawlsing_next/pre553_parquet_carrier.py'
      - 'rawlsing_next/pre553_physical_decoder.py'
      - 'rawlsing_next/bench_w03_w04_physical.py'
      - 'rawlsing_next/tests/test_pre553_c11_execution_view.py'
      - 'rawlsing_next/tests/test_pre553_c11_cold_reopen_i03.py'
      - 'rawlsing_next/tests/test_pre553_discovery_exact.py'
      - 'rawlsing_next/tests/test_pre553_empirical_query.py'
      - 'rawlsing_next/tests/test_pre553_route_b_production.py'
      - 'rawlsing_next/tests/test_pre553_source_backed_c11_facade.py'
      - 'rawlsing_next/tests/test_pre553_carrier_execution.py'
      - 'rawlsing_next/tests/test_pre553_i03_grouping.py'
      - 'rawlsing_next/tests/test_bench_w03_w04_physical.py'
      - 'rawlsing_next/tests/test_bench_w03_w04_physical.py.proof.json'
      - 'rawlsing_next/tests/test_pre553_w03_w04_cold.py'
      - 'rawlsing_next/tests/test_pre553_w03_w04_completion.py'
      - 'PYAT_W03_W04_MCR_C_Commission.md'
      - 'WORKER_COMMISSIONS/PYAT_W03_W04_MCR_COMPLETION_R1/REQUIRED_OBLIGATIONS.tsv'
      - 'CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py'
      - 'WORKER_COMMISSIONS/PYAT_W03_W04_MCR_COMPLETION_R1/MCR_EXECUTABLE_LAUNCH.md'
      - 'CROSS_HQ_CONTROL_ROOM/test_verify_copy_paste_commission_r1.py'
      - 'WORKER_RETURNS/PYAT_W03_W04_MCR_COMPLETION_R1/reviews/economics/BENCH_LIVE_C44_SNAPSHOT/test_bench_w03_w04_physical.py'
      - 'WORKER_RETURNS/PYAT_W03_W04_MCR_COMPLETION_R1/reviews/economics/BENCH_LIVE_C44_SNAPSHOT/test_bench_w03_w04_physical.py.proof.json'
      - 'CROSS_HQ_CONTROL_ROOM/proof_integrity_gate_r1.py'
      - 'CROSS_HQ_CONTROL_ROOM/test_proof_integrity_gate_r1.py'
      - '.github/workflows/pyat-w03-w04-physical-economy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-cold-sourcefree:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sourcefree physical test dependencies
        run: python -m pip install pytest pyarrow pyreadstat pandas
      - name: Execute exact compact/cache and cold I03/I05 consumer regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -o addopts='' -p no:cacheprovider \
            rawlsing_next/tests/test_pre553_c11_execution_view.py \
            rawlsing_next/tests/test_pre553_c11_cold_reopen_i03.py \
            rawlsing_next/tests/test_pre553_source_backed_c11_facade.py \
            rawlsing_next/tests/test_pre553_carrier_execution.py \
            rawlsing_next/tests/test_pre553_i03_grouping.py \
            rawlsing_next/tests/test_bench_w03_w04_physical.py \
            rawlsing_next/tests/test_pre553_w03_w04_cold.py \
            rawlsing_next/tests/test_pre553_w03_w04_completion.py \
            CROSS_HQ_CONTROL_ROOM/test_verify_copy_paste_commission_r1.py \
            --junitxml=pyat-w03-w04-sourcefree-junit.xml
      - name: Existing proof-integrity changed-range gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          python3 CROSS_HQ_CONTROL_ROOM/proof_integrity_gate_r1.py changed \
            --root . --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Sourcefree physical benchmark 256-row smoke (explicitly not 100k/MCR acceptance)
        env:
          PYTHONPATH: .
        run: |
          python -m rawlsing_next.bench_w03_w04_physical \
            --scenario full-matrix --profiles narrow,wide,repeat \
            --rows 256 --repetitions 1 \
            --root pyat-w03-w04-benchmark-cache \
            --jsonpath pyat-w03-w04-benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyat-w03-w04-sourcefree-junit
          path: pyat-w03-w04-sourcefree-junit.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyat-w03-w04-benchmark-smoke
          path: pyat-w03-w04-benchmark-smoke.json
          if-no-files-found: error
