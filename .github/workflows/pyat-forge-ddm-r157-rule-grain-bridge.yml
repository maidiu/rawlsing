name: PYAT R157 exact rule-grain bridge
on:
  push:
    branches: [agent/pyat-forge-ddm-r157-rule-grain-bridge-r1]
  workflow_dispatch:
jobs:
  indexed-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin 1924499ef52403a0f331b8aff9b7c7eff99bf1e2
      - run: python -m unittest rawlsing_next.tests.test_pre553_r157_rule_grain_bridge -v
