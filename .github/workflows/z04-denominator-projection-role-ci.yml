name: Z04 denominator projection role verification
on:
  push:
    branches:
      - agent/verkhovod-z04-denominator-projection-role-r1
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest pandas pyarrow
      - run: >
          python -m pytest -q
          data/ddm_build_copy/test_z04_denominator_projection_role_closure.py
          data/ddm_build_copy/test_w06_v552j_join.py
          data/ddm_build_copy/tests/test_postg5_v552j_v553_consumer_contract.py
          data/ddm_build_copy/tests/test_postg5_v550_v551_response_semantics_contract.py
          rawlsing_next/tests/test_m4_v557_v558_publication_repository.py
