name: SOROK D03 E01 Agent A ephemeral sourcefree execution
on:
  push:
    branches:
      - agent/sorok-d03-e01-1010-a-performed-sourcefree-r1
permissions:
  contents: read
jobs:
  d03-e01-first-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped test dependency
        run: python -m pip install pytest
      - name: Compile changed adapter and integration tests
        run: |
          python -m py_compile WORKER_RETURNS/SOROK-D03-E01-1010-AGENT-A-R1/d03_e01_performer.py
          python -m py_compile WORKER_RETURNS/SOROK-D03-E01-1010-AGENT-A-R1/test_d03_e01_performer.py
      - name: Frozen inherited J1 and new genuine P2 writer/reader first consumers
        run: |
          python -B -m pytest -q -x -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-E01-J1-995-R1/test_j1_three_head_join.py WORKER_RETURNS/SOROK-D03-E01-1010-AGENT-A-R1/test_d03_e01_performer.py
