name: I02 controller verification
on:
  push:
    branches:
      - agent/verkhovod-fracturemap-i02-controller-composition-r1
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q rawlsing_next/tests/test_pre553_fracture_map_controller.py rawlsing_next/tests/test_pre553_discovery_exact.py rawlsing_next/tests/test_pre553_empirical_query.py
