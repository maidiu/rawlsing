name: B21 transient HB04 implementation court

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-common-deterministic-abc-harness-r1

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact committed B21 implementation
        uses: actions/checkout@v4
        with:
          ref: b0ffd2d030830560d22dd4b9c5970b7e2dd23fde
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate pinned environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas pytest

      - name: Run B21 bounded implementation court
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b21"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/executed_tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$OUT/pre_status.txt"
          python - <<'PY' > "$OUT/environment.json"
          import json,platform,sys,pyarrow,pandas
          print(json.dumps({
            "python":sys.version,
            "implementation":platform.python_implementation(),
            "pyarrow":pyarrow.__version__,
            "pandas":pandas.__version__,
          },sort_keys=True,separators=(",",":")))
          assert pyarrow.__version__=="25.0.1"
          PY

          set +e
          PYTHONPATH="$PWD" python -m pytest -q rawlsing_next/tests/test_as4_hb04_common_harness.py >"$OUT/pytest_stdout.txt" 2>"$OUT/pytest_stderr.txt"
          PEC=$?
          set -e
          echo "$PEC" > "$OUT/pytest_exit_code.txt"
          sha256sum "$OUT/pytest_stdout.txt" | awk '{print $1}' > "$OUT/pytest_stdout_sha256.txt"
          sha256sum "$OUT/pytest_stderr.txt" | awk '{print $1}' > "$OUT/pytest_stderr_sha256.txt"
          if [ "$PEC" -ne 0 ]; then
            exit "$PEC"
          fi

          for C in A B C; do
            mkdir -p "$OUT/direct_$C"
            python -m rawlsing_next.as4.run_candidate               --candidate "$C"               --workdir "$OUT/direct_$C/work"               --output "$OUT/direct_$C/receipt.json"               --bounded-fixture               >"$OUT/direct_$C/stdout.txt" 2>"$OUT/direct_$C/stderr.txt"
            sha256sum "$OUT/direct_$C/receipt.json" | awk '{print $1}' > "$OUT/direct_$C/receipt_sha256.txt"
            sha256sum "$OUT/direct_$C/stderr.txt" | awk '{print $1}' > "$OUT/direct_$C/stderr_sha256.txt"
          done

          python -m rawlsing_next.as4.run_all             --workdir "$OUT/run_all/work"             --output "$OUT/run_all/receipt.json"             --bounded-fixture             >"$OUT/run_all/stdout.txt" 2>"$OUT/run_all/stderr.txt"
          sha256sum "$OUT/run_all/receipt.json" | awk '{print $1}' > "$OUT/run_all/receipt_sha256.txt"
          sha256sum "$OUT/run_all/stderr.txt" | awk '{print $1}' > "$OUT/run_all/stderr_sha256.txt"

          python - "$OUT" <<'PY'
          import json,pathlib,sys
          out=pathlib.Path(sys.argv[1])
          direct={c:json.loads((out/f"direct_{c}/receipt.json").read_text()) for c in "ABC"}
          allr=json.loads((out/"run_all/receipt.json").read_text())
          semantic=[direct[c]["semantic_identity"] for c in "ABC"]
          projection=lambda x:{k:x[k] for k in (
            "i03_fact_refs","i05_evaluated_frontier_ref","i05_receipt_refs",
            "candidate_count","covered_candidate_count")}
          assert projection(semantic[0])==projection(semantic[1])==projection(semantic[2])
          assert allr["order"]==["A","B","C"]
          assert allr["process_count"]==3 and allr["distinct_process_count"]==3
          assert allr["sequential_no_overlap"] and allr["all_sessions_closed"] and allr["all_cleanup_passed"]
          assert allr["ranking_logic_count"]==allr["selection_logic_count"]==0
          assert allr["real_lits1_open_count"]==allr["real_wvs7_open_count"]==allr["c09_execution_count"]==0
          summary={
            "schema":"B21_HB04_BOUNDED_IMPLEMENTATION_COURT@1.0.0",
            "status":"PASS",
            "executed_tree":"b0ffd2d030830560d22dd4b9c5970b7e2dd23fde",
            "direct_candidates":{c:{
              "semantic_identity_sha256":direct[c]["semantic_identity_sha256"],
              "process_id":direct[c]["process_id"],
              "session_closed":direct[c]["session_closed"],
              "cleanup":direct[c]["cleanup"],
              "resource_observation":direct[c]["resource_observation"],
            } for c in "ABC"},
            "direct_semantic_parity":True,
            "run_all":{
              "order":allr["order"],
              "process_count":allr["process_count"],
              "distinct_process_count":allr["distinct_process_count"],
              "sequential_no_overlap":allr["sequential_no_overlap"],
              "child_process_ids":[x["process_id"] for x in allr["children"]],
              "child_receipt_sha256":[x["receipt_sha256"] for x in allr["children"]],
              "all_sessions_closed":allr["all_sessions_closed"],
              "all_cleanup_passed":allr["all_cleanup_passed"],
            },
            "ranking_logic_count":0,
            "selection_logic_count":0,
            "real_lits1_open_count":0,
            "real_wvs7_open_count":0,
            "c09_execution_count":0,
          }
          (out/"court_summary.json").write_text(json.dumps(summary,sort_keys=True,separators=(",",":"))+"\n")
          PY
          sha256sum "$OUT/court_summary.json" | awk '{print $1}' > "$OUT/court_summary_sha256.txt"
          git status --porcelain=v1 --untracked-files=all > "$OUT/post_status.txt"

      - name: Upload B21 court artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b21-hb04-implementation-court
          path: ${{ runner.temp }}/b21
          if-no-files-found: error
