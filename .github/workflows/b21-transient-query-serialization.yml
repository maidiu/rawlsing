name: B21 transient query serialization diagnostic

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-common-deterministic-abc-harness-r1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f587391d5d115e69aa26dca0fe4dd1271b30f71
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b21-query-serialization"
          mkdir -p "$OUT"
          FILE='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1/WORKERS/B7_AS3R3_NODE5B_QUERY_MINT_REPLAY_R1/03_CANONICAL_QUERY_REPRESENTATIONS.json'
          PYTHONPATH="$PWD" python - "$FILE" "$OUT/diagnostic.json" <<'PY'
          import hashlib,json,pathlib,sys
          from rawlsing_next.pre553_empirical_objects import canonical_json
          src=json.loads(pathlib.Path(sys.argv[1]).read_text())
          def h(s):
              if isinstance(s,str): s=s.encode()
              return hashlib.sha256(s).hexdigest()
          rows=[]
          for row in src["representations"]:
              doc=row["canonical_representation"]
              variants={
                "json_compact_insertion":json.dumps(doc,separators=(",",":"),ensure_ascii=False),
                "json_compact_insertion_nl":json.dumps(doc,separators=(",",":"),ensure_ascii=False)+"\n",
                "json_compact_sorted":json.dumps(doc,sort_keys=True,separators=(",",":"),ensure_ascii=False),
                "json_compact_sorted_nl":json.dumps(doc,sort_keys=True,separators=(",",":"),ensure_ascii=False)+"\n",
                "json_default_insertion":json.dumps(doc,ensure_ascii=False),
                "json_default_insertion_nl":json.dumps(doc,ensure_ascii=False)+"\n",
                "json_default_sorted":json.dumps(doc,sort_keys=True,ensure_ascii=False),
                "json_default_sorted_nl":json.dumps(doc,sort_keys=True,ensure_ascii=False)+"\n",
                "json_indent2_insertion":json.dumps(doc,indent=2,ensure_ascii=False),
                "json_indent2_insertion_nl":json.dumps(doc,indent=2,ensure_ascii=False)+"\n",
                "json_indent2_sorted":json.dumps(doc,indent=2,sort_keys=True,ensure_ascii=False),
                "json_indent2_sorted_nl":json.dumps(doc,indent=2,sort_keys=True,ensure_ascii=False)+"\n",
                "canonical_json":canonical_json(doc),
                "canonical_json_nl":canonical_json(doc)+"\n",
              }
              rows.append({
                "query_source_id":row["query_source_id"],
                "expected":row["canonical_representation_sha256"],
                "hashes":{k:h(v) for k,v in variants.items()},
                "matches":[k for k,v in variants.items() if h(v)==row["canonical_representation_sha256"]],
              })
          pathlib.Path(sys.argv[2]).write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rows,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b21-query-serialization-diagnostic
          path: ${{ runner.temp }}/b21-query-serialization
