name: B08 V550J Asian Latin bounded verification
on:
  push:
    branches:
      - agent/verkhovod-b08-v550j-asian-latin-r1
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest pyyaml pandas python-dotenv scikit-learn scipy numpy pyarrow
      - run: >
          python -m pytest -q
          section85/tests/test_bounded_v550j_adapter.py
          section85/tests/test_source_authority_dependencies.py
          data/ddm_build_copy/test_v550j_w03_authority.py
