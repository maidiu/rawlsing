name: D06 governed repair court

on:
  push:
    branches:
      - agent/rabochii-prev3-w2-d06-m3-firewall-implementation-r1

permissions:
  contents: write

jobs:
  d06-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Apply commissioned stale-test dispositions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_in_function(path, func, old, new):
              p = Path(path)
              text = p.read_text()
              marker = f"def {func}("
              start = text.index(marker)
              end = text.find("\ndef ", start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              if block.count(old) != 1:
                  raise SystemExit(f"{path}:{func}: expected exactly one stale fragment")
              text = text[:start] + block.replace(old, new, 1) + text[end:]
              p.write_text(text)

          pre = "rawlsing_next/tests/test_pre553_source_relations.py"
          stale = "with pytest.raises(SourceRelationAuthorizationError):"
          fixed = "with pytest.raises(SourceRelationIntegrityError):"
          replace_in_function(
              pre,
              "test_sample_pooling_requires_semantic_equivalence_nonduplication_and_own_authority",
              stale,
              fixed,
          )
          replace_in_function(
              pre,
              "test_estimand_composition_requires_its_own_exact_relation_even_when_pooling_exists",
              stale,
              fixed,
          )

          p = Path("rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py")
          text = p.read_text()
          marker = "def test_m4_binding_accepts_exact_relation_contract_and_keeps_v554_producer_family():"
          start = text.index(marker)
          end = text.index("\ndef ", start + len(marker))
          replacement = '''def test_m4_binding_rejects_caller_minted_relation_producer_uses():\n    result = _evaluate([_prep("m4")])\n    with pytest.raises(M4IntegrityError, match="caller-selected"):\n        structural_objects_from_accepted_m1(\n            result,\n            producer_allowed_uses=["REVIEW", "CONTEXT"],\n        )\n\n'''
          text = text[:start] + replacement + text[end + 1:]
          p.write_text(text)
          PY
      - name: Targeted D06 regression court
        run: |
          python -m pytest -q \
            rawlsing_next/tests/test_m3_v556_higher_order_structural.py \
            rawlsing_next/tests/test_m2_v555_atomic_route.py \
            rawlsing_next/tests/test_pre553_source_relations.py \
            rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py \
            rawlsing_next/tests/test_gt12_d_to_m4_typed_bridge.py
      - name: Commit stale-test repairs and remove transient court workflow
        shell: bash
        run: |
          rm .github/workflows/d06-transient.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "D06: align stale PRE553/M1 tests with accepted contracts"
          git push origin HEAD:agent/rabochii-prev3-w2-d06-m3-firewall-implementation-r1
