name: B10 GSS V550J authority hardening

on:
  push:
    branches:
      - agent/verkhovod-b10-v550j-gss-harden-r1

permissions:
  contents: read

jobs:
  b10-gss-harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas pyyaml python-dotenv scikit-learn pyarrow
      - name: Run B10 current-authority and joint-chain regression surface
        run: >-
          python -m pytest -q
          data/ddm_build_copy/tests/test_v550j_gss_current_authority.py
          section85/tests/test_bounded_v550j_adapter.py
          data/ddm_build_copy/test_w03_v551j_v550j_surface.py
          data/ddm_build_copy/test_w03_v551j_v550j_typed_stop.py
          data/ddm_build_copy/test_w06_v552j_join.py
          section85/tests/test_section85_g4_exact_producers.py
          section85/tests/test_source_authority_dependencies.py
