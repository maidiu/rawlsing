name: PYAT FORGE DDM analytical A exact-source court
on:
  pull_request:
    paths:
      - 'rawlsing_next/pre553_s04_general_joint_algebra.py'
      - 'rawlsing_next/pre553_s04_dhikr_comparative.py'
      - 'rawlsing_next/pre553_s04_i05_reception.py'
      - 'rawlsing_next/tests/test_pre553_forge_ddm_analytical_a.py'
      - '.github/workflows/pyat-forge-ddm-analytical-a.yml'
permissions:
  contents: read
jobs:
  analytical-a:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact code HEAD
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'exact_source_head=%s\n' "$actual"
          test "$actual" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pandas pyreadstat pyarrow duckdb psutil
      - name: Native sourcefree analytical and inherited consumer courts
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile rawlsing_next/pre553_s04_general_joint_algebra.py rawlsing_next/pre553_s04_dhikr_comparative.py rawlsing_next/pre553_s04_i05_reception.py rawlsing_next/tests/test_pre553_forge_ddm_analytical_a.py
          python -m pytest -q -o addopts='' \
            rawlsing_next/tests/test_pre553_forge_ddm_analytical_a.py \
            rawlsing_next/tests/test_pre553_s04_general_joint_algebra.py \
            rawlsing_next/tests/test_preff_c3_dhikr_comparative.py \
            rawlsing_next/tests/test_pre553_s04_determinicity_cycle.py \
            rawlsing_next/tests/test_pre553_s04_i05_reception.py \
            rawlsing_next/tests/test_pre553_discovery_adaptive.py \
            rawlsing_next/tests/test_pre553_recursive_handoff.py \
            rawlsing_next/tests/test_pyat997_saved_s04_observation_vertical.py \
            --junitxml=forge-ddm-a.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-ddm-a
          path: forge-ddm-a.xml
          if-no-files-found: ignore
