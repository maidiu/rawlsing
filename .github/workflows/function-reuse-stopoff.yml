name: Rawlsing mandatory existing-function consultation stop-off

# Implements the already adopted 2026-10-19 build-or-reuse constitution.
# Install "function-reuse-stopoff / verify-prebuild-reuse" as a REQUIRED
# protected-branch status check. A workflow without that branch protection
# cannot prevent bypass via direct push or unchecked merges.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-prebuild-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing law / provenance / chronological receipt regression court
        run: |
          python3 -B -m unittest discover -s tests -p test_function_reuse_preflight_r1.py -v
      - name: Verify every changed production operation and commission had a prior design consultation
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          # The head SHA can be from a fork; fetch the advertised PR ref.
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head" || true
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          python3 -B tools/check_function_reuse_preflight.py changed \
            --base "$BASE_SHA" --head "$HEAD_SHA" --online
