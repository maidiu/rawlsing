name: ZAK-00 v2 MCR-C exact-source, 94-obligation pre-dispatch court

on:
  pull_request:
    paths:
      - 'WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/FLIGHT_LAUNCHES/**'
      - 'WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/verify_zak00_v2_mcrc_tasks.py'
      - '.github/workflows/zak00-v2-mcr-python-preflight.yml'
  push:
    branches:
      - agent/vmestye-zak00-v2-mcr-execution-20261110-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole-mission-pre-dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact author candidate with all original source commits
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout immutable integrated MCR-C law and official validator
        uses: actions/checkout@v4
        with:
          ref: 4f3413fc5c37b589be3412f826bf8f68ee617d4a
          path: .mcr-policy
          persist-credentials: false
          sparse-checkout: |
            CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Freeze actual candidate and immutable MCR-C validator identity
        run: |
          git rev-parse HEAD
          git rev-parse 9d24323494cc852ada078010f09bfcf9ceb911d9
          git -C .mcr-policy rev-parse HEAD
          python3 -m py_compile .mcr-policy/CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py
          python3 .mcr-policy/CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py --self-test

      - name: Verify all eleven original task sets plus 24 parent obligations and hostile no-drop mutants
        run: |
          python3 WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/verify_zak00_v2_mcrc_tasks.py --all
          python3 WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/verify_zak00_v2_mcrc_tasks.py --self-test

      - name: Execute actual integrated Python MCR-C source-check on each flight
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p zak-mcr-format-receipts
          failed=0
          for number in $(seq -w 1 11); do
            file="WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/FLIGHT_LAUNCHES/ZAK_${number}_FULL_COPY_PASTE_MCR.md"
            echo "::group::ZAK-${number}: exact-source MCR-C pre-dispatch"
            if python3 .mcr-policy/CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py "${file}" --source-check | tee "zak-mcr-format-receipts/ZAK_${number}.json"; then
              echo "ZAK-${number}: actual MCR-C checker passed"
            else
              echo "::error file=${file}::ZAK-${number} official MCR-C source/contract failure"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "ZAK_MCR_C_OFFICIAL_FAILURES=${failed}"
          test "${failed}" -eq 0

      - name: Run official integrated MCR-C source check on 24-obligation ZAK00 parent
        shell: bash
        run: |
          set -euo pipefail
          file="WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/01_FULL_COPY_PASTE_LAUNCH.md"
          mkdir -p zak-mcr-format-receipts
          python3 .mcr-policy/CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py "$file" --source-check | tee zak-mcr-format-receipts/ZAK_00_PARENT.json
          python3 WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/verify_zak00_v2_mcrc_tasks.py --parent
          echo "ZAK-00 PARENT: integrated MCR-C source/contract gate PASS; descendant effects NOT_RUN"

      - name: Hostile parent proof-domain and withheld-outcome tests (10 negatives + authority refusal)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zak-mcr-format-receipts
          python3 WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/verify_zak00_v2_mcrc_tasks.py --claim-mutations | tee zak-mcr-format-receipts/ZAK00_R3_SEMANTIC_MUTANTS.json
          python3 WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/verify_zak00_v2_mcrc_tasks.py --claim-all | tee zak-mcr-format-receipts/ZAK00_R3_CLAIM_BOUNDARY.json

      - name: Verify post-commit parent evidence, with missing qualified receipt deliberately non-PASS at exact SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          prompt_path = Path("WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/01_FULL_COPY_PASTE_LAUNCH.md")
          source = prompt_path.read_text(encoding="utf-8")
          begin, end = "MCR_COMPLETION_CONTRACT_BEGIN", "MCR_COMPLETION_CONTRACT_END"
          contract = source.split(begin, 1)[1].split(end, 1)[0].strip()
          digest = hashlib.sha256(contract.encode("utf-8")).hexdigest()
          obligations = [json.loads(line.split(": ", 1)[1]) for line in contract.splitlines()
                         if line.startswith("MCR_OBLIGATION: ")]
          assert len(obligations) == 24
          candidate = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          def sha(path):
              value = Path(path).read_bytes()
              return hashlib.sha256(value).hexdigest()
          def committed(path):
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              expected = subprocess.check_output(["git", "rev-parse", candidate + ":" + path], text=True).strip()
              assert actual == expected, "not committed at candidate " + path
          lines = ["MCR_COMPLETION_EVIDENCE_BEGIN"]
          for o in obligations:
              committed(o["output"])
              committed(o["evidence"])
              evidence = {
                  "id": o["id"], "candidate_sha": candidate, "contract_sha256": digest,
                  "status": ("INCOMPLETE" if o["id"] == "ZAK00-PARENT-06" else "PASS"),
                  "grade": ("S0" if o["id"] == "ZAK00-PARENT-06" else "S1"),
                  "output_file": o["output"], "output_sha256": sha(o["output"]),
                  "evidence_file": o["evidence"], "evidence_sha256": sha(o["evidence"]),
              }
              lines.append("MCR_EVIDENCE: " + json.dumps(evidence, sort_keys=True))
          coverage = "WORKER_RETURNS/VMESTYE_ZAK00_V2_MCR_AUTHOR_EXECUTION_20261110_R1/MCRC_DELIVERED_182_IDS.txt"
          committed(coverage)
          lines.append("MCR_COVERAGE: " + json.dumps({
              "candidate_sha": candidate, "contract_sha256": digest,
              "delivered_ids_file": coverage, "delivered_ids_sha256": sha(coverage),
          }, sort_keys=True))
          lines.append("MCR_COMPLETION_EVIDENCE_END")
          receipt = Path("zak-mcr-format-receipts/ZAK00_PARENT_SHA_BOUND_EVIDENCE.txt")
          receipt.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("ZAK00_CANDIDATE_SHA=" + candidate)
          print("ZAK00_CONTRACT_SHA256=" + digest)
          print("PARENT_AUTHOR_EVIDENCE_ITEMS=" + str(len(obligations)))
          print("PARENT_AUTHOR_EVIDENCE_MODE=DOCUMENTARY_23_OF_24_WITH_814_817_AUTHORITY_BLOCKED")
          PY
          set +e
          python3 .mcr-policy/CROSS_HQ_CONTROL_ROOM/verify_copy_paste_commission_r1.py \
            WORKER_COMMISSIONS/VMESTYE_ZAKONCHILOS_ZAK00_V2_MCR/01_FULL_COPY_PASTE_LAUNCH.md \
            --verify-return zak-mcr-format-receipts/ZAK00_PARENT_SHA_BOUND_EVIDENCE.txt \
            --candidate-sha "$(git rev-parse HEAD)" \
            --evidence-root . | tee zak-mcr-format-receipts/ZAK00_PARENT_VERIFY_RETURN.json
          verdict_exit=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("zak-mcr-format-receipts/ZAK00_PARENT_VERIFY_RETURN.json").read_text())
          errors = set(result["errors"])
          expected = {"MCR_C_PROOF_NOT_PASS_ZAK00-PARENT-06",
                      "MCR_C_INSUFFICIENT_EVIDENCE_GRADE_ZAK00-PARENT-06"}
          assert result["status"] == "RED_INCOMPLETE", result
          assert errors == expected, ("Unexpected error or missing authority refusal", errors)
          print("PASS_FAIL_CLOSED_MCR_C_PARENT_06_AUTHORITY_UNACKNOWLEDGED")
          print("PARENT_AUTHOR_CLAIM_CEILING=BLOCKED_EXACT_DEPENDENCY_NOT_READY")
          PY
          test "$verdict_exit" -eq 2
          echo "Verified exact SHA-bound 23 source-graded author proofs; PARENT-06 correctly refused."

      - name: Upload exact formal check receipts, not descendant completion
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: zak00-v2-mcr-c-contract-and-source-receipts
          path: zak-mcr-format-receipts/
          if-no-files-found: warn
