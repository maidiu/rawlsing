name: PYAT KUDA076 sourcefree selected-world test
on:
  push:
    branches:
      - agent/pyat-kuda076-e05-selected-world-reader-guard-20261121
permissions:
  contents: read
jobs:
  sourcefree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sourcefree test tools
        run: python -m pip install --disable-pip-version-check pytest numpy pandas pyarrow pyreadstat
      - name: Exact SHA focused tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .kuda076-proof
          python -m pytest -q -o addopts='' --junitxml=.kuda076-proof/junit.xml \
            rawlsing_next/tests/test_kuda076_e05_selected_world_guard.py \
            rawlsing_next/tests/test_world_conditioned_progressive_service.py \
            rawlsing_next/tests/test_l01_reviewed_progressive_world.py
      - name: Preserve JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuda076-e05-court
          path: .kuda076-proof/
          if-no-files-found: error
          include-hidden-files: true
