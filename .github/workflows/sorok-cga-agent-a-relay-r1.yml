name: SOROK CG-A Agent A relay - cue issuer and inherited owners
on:
  push:
    branches:
      - review/sorok-cga-agent-a-relay-20261112-r1
  pull_request:
    paths:
      - 'WORKER_RETURNS/SOROK-CGA-AGENT-A-RELAY-R1/**'
      - 'WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/situated.py'

permissions:
  contents: read

jobs:
  exact-first-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Actual source-real forged cue negative
        run: python -B -m pytest -q -p no:cacheprovider WORKER_RETURNS/SOROK-CGA-AGENT-A-RELAY-R1/test_cue_issuer.py
      - name: Existing Agent A and Agent B bridge suite
        run: python -B -m pytest -q -p no:cacheprovider WORKER_RETURNS/SOROK-CGA-CAUSAL-BRIDGE-R1/test_bridge.py
      - name: Existing P3 cold owner, replay and source restore
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            WORKER_RETURNS/SOROK-P3-COMPRESSED-DEVELOPMENTAL-STATE-R1/tests/test_p3_vertical_slice.py::test_primary_actual_formation_read_later_and_no_mediator_control \
            WORKER_RETURNS/SOROK-P3-COMPRESSED-DEVELOPMENTAL-STATE-R1/tests/test_p3_vertical_slice.py::test_h_cold_reopen_idempotent_replay_and_source_restore
      - name: Inherited P4 source- and event-qualified speech
        run: python -B -m pytest -q -p no:cacheprovider WORKER_RETURNS/SOROK-P4-FIRST-FULL-MPC-R1/test_response.py::test_performed_speech_reads_real_prior_p3_formation
      - name: P6 admitted sensory evidence and situated behavior
        run: |
          python -B -m pytest -q -p no:cacheprovider \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py::test_outward_conduct_supplies_only_qualified_cues \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py::test_silent_interval_reconsiders_and_commits_only_admitted_speech
