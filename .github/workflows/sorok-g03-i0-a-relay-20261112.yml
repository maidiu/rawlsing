name: SOROK G03-I0 Agent A relay type-safety court
on:
  push:
    branches:
      - agent/sorok-g03-i0-a-relay-typed-sqlite-20261112-r1
permissions:
  contents: read
jobs:
  typed-p3-and-real-p6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: New adversarial real-P3 BLOB/TEXT collision court
        working-directory: WORKER_RETURNS/SOROK-G03-I0-P6-MEASUREMENT-R1
        run: python -B -m unittest -v test_agent_a_relay
      - name: Preserve all original A/B receipt falsifiers
        working-directory: WORKER_RETURNS/SOROK-G03-I0-P6-MEASUREMENT-R1
        run: python -B -m unittest -v test_measure test_agent_b
      - name: Original P6 complete sourcefree measurement and independent reader
        shell: bash
        run: |
          set -euo pipefail
          python -B WORKER_RETURNS/SOROK-G03-I0-P6-MEASUREMENT-R1/measure.py --repo "$GITHUB_WORKSPACE" --out /tmp/g03-a-relay-evidence
          INDEX_SHA=$(sha256sum /tmp/g03-a-relay-evidence/index.json)
          INDEX_SHA="${INDEX_SHA%% *}"
          python -B WORKER_RETURNS/SOROK-G03-I0-P6-MEASUREMENT-R1/read_receipts.py /tmp/g03-a-relay-evidence --index-sha256 "$INDEX_SHA" --repo "$GITHUB_WORKSPACE" --require-expected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sorok-g03-i0-a-relay-raw-receipts
          path: /tmp/g03-a-relay-evidence/
          retention-days: 30
