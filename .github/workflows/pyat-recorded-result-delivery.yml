name: PYAT private recorded result delivery compatibility
on:
  pull_request:
    paths:
      - 'rawlsing_next/pre553_recorded_result_delivery.py'
      - 'rawlsing_next/tests/test_pre553_recorded_result_delivery.py'
      - '.github/workflows/pyat-recorded-result-delivery.yml'
permissions:
  contents: read
jobs:
  private-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "exact_source_head=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q -o addopts='' rawlsing_next/tests/test_pre553_recorded_result_delivery.py
