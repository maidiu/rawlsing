name: PYAT C-2 source-qualified semantic range (sourcefree)
on:
  push:
    branches:
      - review/pyat-c2-sourcequalified-range-r3-20261112
  pull_request:
    paths:
      - WORKER_RETURNS/PYAT_C2_COUNTERCONSTRUCTION_R2/tests/test_verified_range.py
      - .github/workflows/pyat-c2-sourcequalified-range-r3-sourcefree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourcefree-court:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run exact sourcefree indexed-range court
        run: python3 -B -Werror::ResourceWarning -m unittest -v WORKER_RETURNS/PYAT_C2_COUNTERCONSTRUCTION_R2/tests/test_verified_range.py
      - name: Exact test blob
        run: git hash-object WORKER_RETURNS/PYAT_C2_COUNTERCONSTRUCTION_R2/tests/test_verified_range.py
