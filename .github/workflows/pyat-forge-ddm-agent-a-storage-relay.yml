name: PYAT storage relay matched courts
on:
  push:
    branches: [agent/pyat-forge-ddm-agent-a-storage-relay-r2, agent/pyat-forge-ddm-agent-b-storage-relay-r3, agent/pyat-forge-ddm-agent-a-storage-relay-r4, agent/pyat-forge-ddm-agent-b-storage-relay-r5, agent/pyat-forge-ddm-country-continuity-r6, agent/pyat-forge-ddm-agent-a-storage-relay-r7, agent/pyat-forge-ddm-agent-b-storage-relay-r8, agent/pyat-forge-ddm-agent-a-storage-relay-r9, agent/pyat-forge-ddm-agent-b-storage-relay-r10, agent/pyat-forge-ddm-agent-a-storage-relay-r11, agent/pyat-forge-ddm-agent-b-storage-relay-r12, agent/pyat-forge-ddm-agent-a-storage-relay-r13, agent/pyat-forge-ddm-agent-b-storage-relay-r14]
  workflow_dispatch:
concurrency:
  group: pyat-storage-relay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin 9e8572463f731fb1c3c9da1501bec48c80ad6143 d8ae9a9324c4f923c2efe79e08ce8530bbf32cdc 5a8f05f134e950277798e8eb8580453f32ca8fab 4b49f092a9ea6938df944ec9ebb8641aba8e39ee; git diff --stat 9e8572463f731fb1c3c9da1501bec48c80ad6143 HEAD
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_carrier rawlsing_next.tests.test_pre553_country_numeric_hostile tools.pyat_forge_ddm_1354_hostile -v
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_economics -v
        env:
          PYAT_R8_MATCHED_PUBLICATION: '1'
          PYAT_R8_PROCESS_LOSS: '1'
          PYAT_R11_MATCHED_PROOF: '1'
          PYAT_R12_MATCHED_CENSUS: '1'
  wide:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; lscpu; free -h
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_economics.CountryNativeEconomics.test_wide_100_distinct_native_batch_and_cold_product -v
        env:
          PYAT_WIDE_ECONOMICS: '1'
  matched_physical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin f5e9c9a03ccddb5bdfab2114c5f5f551002914f6 9e8572463f731fb1c3c9da1501bec48c80ad6143 d988a39f7741a839e89ac37bf13f5acfe1c2936a 45315663f3e0f20c39b8075acbd1e6e77bf8296f 2df75b925542088b14cbf54acc37b632d84b79c4; lscpu; free -h
      - run: python -m tools.pyat_country_storage_relay_benchmark
  matched_selector:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; lscpu; free -h
      - run: git fetch --no-tags --depth=1 origin 2df75b925542088b14cbf54acc37b632d84b79c4
      - run: python -m tools.pyat_country_selector_resident_court
        env:
          PYAT_WIDE_ECONOMICS: '1'
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0 psutil==7.0.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; lscpu; free -h
      - run: python -m tools.pyat_country_campaign_court --rows 128,192,256 --compare-replay-risk
  fresh_process_preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - rows: 128
            width: 300
            governed: 80
          - rows: 512
            width: 613
            governed: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0 psutil==7.0.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; lscpu; free -h
      - run: python -m tools.pyat_country_preparation_court --rows ${{ matrix.rows }} --width ${{ matrix.width }} --governed ${{ matrix.governed }}
