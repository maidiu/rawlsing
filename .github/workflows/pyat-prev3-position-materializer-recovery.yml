name: PYAT PRE-V3 objective-position recovered import and exact replay
on:
  pull_request:
    paths:
      - 'rawlsing_next/prev3_objective_position_materializer.py'
      - 'rawlsing_next/tests/test_prev3_objective_position_materializer.py'
      - 'rawlsing_next/tests/test_prev3_objective_position_v557_v558_publication.py'
      - '.github/workflows/pyat-prev3-position-materializer-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-sourcefree:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify exact D03 contract and protected V557/V558 consumer import
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -o addopts='' -p no:cacheprovider rawlsing_next/tests/test_prev3_objective_position_materializer.py rawlsing_next/tests/test_prev3_objective_position_v557_v558_publication.py
          python -c 'import rawlsing_next.prev3_objective_position_v557_v558_publication as p; assert p.POSITION_MATERIALIZER_CONTRACT_ID == "PREV3_OBJECTIVE_POSITION_MATERIALIZER_CONTRACT@1.0.0"'
          python -m compileall -q rawlsing_next/prev3_objective_position_materializer.py rawlsing_next/prev3_objective_position_v557_v558_publication.py
