name: B21Q transient HB04 qualification court

on:
  push:
    branches:
      - agent/rabochii-subv-b-hb04-common-deterministic-abc-harness-qualification-r1

permissions:
  contents: read

jobs:
  qualification:
    name: HB04Q outer ${{ matrix.outer }}
    strategy:
      fail-fast: false
      matrix:
        outer: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact commissioned HB04Q tree
        uses: actions/checkout@v4
        with:
          ref: 0b96b8de9aac774566f872cf0630ebd4ddeb70e6
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate exact qualification environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas==3.0.5 pytest

      - name: Execute complete frozen HB04Q outer court
        shell: bash
        env:
          OUTER_ID: ${{ matrix.outer }}
        run: |
          set -euo pipefail
          EXPECTED_HEAD="0b96b8de9aac774566f872cf0630ebd4ddeb70e6"
          ROOT="$RUNNER_TEMP/b21q_outer_$OUTER_ID"
          OUT="$ROOT/evidence"
          export TMPDIR="$ROOT/tmp"
          export PYTHONPYCACHEPREFIX="$ROOT/pycache"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          mkdir -p "$OUT" "$TMPDIR" "$PYTHONPYCACHEPREFIX"

          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          git status --porcelain=v1 --untracked-files=all > "$OUT/pre_status.txt"
          test ! -s "$OUT/pre_status.txt"

          python - "$OUT" "$EXPECTED_HEAD" "$OUTER_ID" <<'PY'
          import hashlib, json, pathlib, platform, subprocess, sys
          import pandas, pyarrow
          from rawlsing_next.as4 import loader

          out = pathlib.Path(sys.argv[1])
          expected_head = sys.argv[2]
          outer_id = int(sys.argv[3])

          base = pathlib.Path(
              "data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/"
              "R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/"
              "RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/"
              "SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1"
          )
          freeze_paths = {
              "hb04_implementation": base / "51A_HB04_COMMON_HARNESS_IMPLEMENTATION_FREEZE_R1.json",
              "abc_intake": base / "49A_HB04_QUALIFIED_ABC_INTAKE_FREEZE_R1.json",
          }
          expected_freezes = {
              "hb04_implementation": "138482116b566482075e191800229f81357541d674646552e8c269e7640a755e",
              "abc_intake": "906973f78cd82678f678a9a803bb3c3c7f9e13b30e39a5f8dc3ea093d4390e88",
          }
          def canonical_sha(path):
              value = json.loads(path.read_text(encoding="utf-8"))
              payload = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
              return hashlib.sha256(payload).hexdigest()

          freeze_receipts = {}
          for key, path in freeze_paths.items():
              actual = canonical_sha(path)
              assert actual == expected_freezes[key], (key, actual)
              freeze_receipts[key] = {
                  "path": str(path),
                  "canonical_sha256": actual,
                  "raw_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }

          expected_files = {
              "rawlsing_next/as4/__init__.py": ("0a31d52e144e55e0bb0a0f1a637022c2f1536918", "a8becc598142002a3f7c5e3c2fb0cfc80a0249537f84602a1c3237af686cb046"),
              "rawlsing_next/as4/loader.py": ("f608f72f711610ef6d07fd7c96f450a6ba2cac2a", "de31b14fcace34df3f1293e027f14f2c3c75bd942c9b7b27b3eef5b91d8a55c5"),
              "rawlsing_next/as4/bounded_fixture.py": ("caa81812f31347826b9fc0279c0543b8b52c7b99", "d4f5f8c1a3a51d773d5f6ac0b2f06ad8b99a402e1a4e3872d49e17e96d88fd01"),
              "rawlsing_next/as4/protocol.py": ("590da3a2cc54666bd9786130409170b73310a700", "f32bc76346565345042e742f05f195bf8c4ca36b98fd4e7996119e45883a595d"),
              "rawlsing_next/as4/run_candidate.py": ("0acb4cd17906b1c316c5ae381d3214ea98ac5baa", "027cda2dafc0785dbbe52ce83c7aab7c9c1d4b99ca432f632f734c1e30714bfb"),
              "rawlsing_next/as4/run_all.py": ("b7b4c3e8782ac2dc85010e8b3a5afd8e40212edf", "967ae15e54757190c72d2d0aca7b148ae7d1167df221e2719041f3683563ea3f"),
              "rawlsing_next/as4/pins/discovery_frontier_authority_snapshot.json": ("2f2cbce9c9abaa61048424f2191b81b19847ccdd", "bf4c1c3898d1405c1aa28f339fd14da051fc8b386db30f99b2a310aea0e89a24"),
              "rawlsing_next/tests/test_as4_hb04_common_harness.py": ("0333f0133977fcb14d86d41c5d7386836a53aa99", "ca11d17295d3436db08296dc8a9db4cf31c23c127170d2e967fea92d65e72521"),
          }
          file_receipts = []
          for path_s, (expected_blob, expected_sha) in expected_files.items():
              path = pathlib.Path(path_s)
              blob = subprocess.check_output(["git", "hash-object", path_s], text=True).strip()
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              assert blob == expected_blob, (path_s, blob)
              assert sha == expected_sha, (path_s, sha)
              file_receipts.append({"path": path_s, "git_blob_sha1": blob, "sha256": sha})

          assert platform.python_implementation() == "CPython"
          assert sys.version_info[:2] == (3, 13)
          assert pyarrow.__version__ == "25.0.1"
          assert pandas.__version__ == "3.0.5"

          manifest = loader.load_hb04_manifest()
          assert manifest.intake_sha256 == expected_freezes["abc_intake"]
          successor_payload = json.dumps(manifest.successor_identity_receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          loader_receipt = {
              "intake_sha256": manifest.intake_sha256,
              "successor_package": manifest.successor_identity_receipt,
              "successor_package_sha256": hashlib.sha256(successor_payload).hexdigest(),
              "candidate_order": list(manifest.candidate_order),
              "role_predicate_count": len(manifest.role_predicates),
              "distinct_predicate_count": len(manifest.distinct_predicates),
              "query_count": len(manifest.query_templates),
              "zero_remints": manifest.zero_remints,
          }
          assert loader_receipt["candidate_order"] == ["A", "B", "C"]
          assert loader_receipt["role_predicate_count"] == 19
          assert loader_receipt["distinct_predicate_count"] == 18
          assert loader_receipt["query_count"] == 3
          assert loader_receipt["zero_remints"] is True

          identity = {
              "schema": "B21Q_FROZEN_IDENTITY_GATE@1.0.0",
              "status": "PASS",
              "outer_id": outer_id,
              "executed_head": expected_head,
              "environment": {
                  "python": sys.version,
                  "implementation": platform.python_implementation(),
                  "pyarrow": pyarrow.__version__,
                  "pandas": pandas.__version__,
              },
              "freezes": freeze_receipts,
              "files": file_receipts,
              "loader": loader_receipt,
          }
          (out / "identity_gate.json").write_text(json.dumps(identity, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

          set +e
          python -m pytest -q rawlsing_next/tests/test_as4_hb04_common_harness.py >"$OUT/pytest_stdout.txt" 2>"$OUT/pytest_stderr.txt"
          PYTEST_EC=$?
          set -e
          echo "$PYTEST_EC" > "$OUT/pytest_exit_code.txt"
          test "$PYTEST_EC" -eq 0
          grep -Eq '(^|[^0-9])29 passed([^0-9]|$)' "$OUT/pytest_stdout.txt"
          ! grep -Eqi '(^|[^a-z])(failed|error|errors|skipped|xfailed|xpassed)([^a-z]|$)' "$OUT/pytest_stdout.txt"
          sha256sum "$OUT/pytest_stdout.txt" | awk '{print $1}' > "$OUT/pytest_stdout_sha256.txt"
          sha256sum "$OUT/pytest_stderr.txt" | awk '{print $1}' > "$OUT/pytest_stderr_sha256.txt"

          for C in A B C; do
            mkdir -p "$OUT/direct_$C"
            python -m rawlsing_next.as4.run_candidate \
              --candidate "$C" \
              --workdir "$OUT/direct_$C/work" \
              --output "$OUT/direct_$C/receipt.json" \
              --bounded-fixture \
              >"$OUT/direct_$C/stdout.txt" 2>"$OUT/direct_$C/stderr.txt"
            sha256sum "$OUT/direct_$C/receipt.json" | awk '{print $1}' > "$OUT/direct_$C/receipt_sha256.txt"
            sha256sum "$OUT/direct_$C/stdout.txt" | awk '{print $1}' > "$OUT/direct_$C/stdout_sha256.txt"
            sha256sum "$OUT/direct_$C/stderr.txt" | awk '{print $1}' > "$OUT/direct_$C/stderr_sha256.txt"
          done

          mkdir -p "$OUT/run_all"
          python -m rawlsing_next.as4.run_all \
            --workdir "$OUT/run_all/work" \
            --output "$OUT/run_all/receipt.json" \
            --bounded-fixture \
            >"$OUT/run_all/stdout.txt" 2>"$OUT/run_all/stderr.txt"
          sha256sum "$OUT/run_all/receipt.json" | awk '{print $1}' > "$OUT/run_all/receipt_sha256.txt"
          sha256sum "$OUT/run_all/stdout.txt" | awk '{print $1}' > "$OUT/run_all/stdout_sha256.txt"
          sha256sum "$OUT/run_all/stderr.txt" | awk '{print $1}' > "$OUT/run_all/stderr_sha256.txt"

          git status --porcelain=v1 --untracked-files=all > "$OUT/post_status.txt"
          test ! -s "$OUT/post_status.txt"

          cat \
            "$OUT/pytest_stdout.txt" "$OUT/pytest_stderr.txt" \
            "$OUT/direct_A/stdout.txt" "$OUT/direct_A/stderr.txt" \
            "$OUT/direct_B/stdout.txt" "$OUT/direct_B/stderr.txt" \
            "$OUT/direct_C/stdout.txt" "$OUT/direct_C/stderr.txt" \
            "$OUT/run_all/stdout.txt" "$OUT/run_all/stderr.txt" \
            > "$OUT/raw_transcript.bin"
          sha256sum "$OUT/raw_transcript.bin" | awk '{print $1}' > "$OUT/raw_transcript_sha256.txt"

          python - "$OUT" "$OUTER_ID" <<'PY'
          import hashlib, json, pathlib, re, sys
          out = pathlib.Path(sys.argv[1])
          outer_id = int(sys.argv[2])
          identity = json.loads((out / "identity_gate.json").read_text())
          direct = {c: json.loads((out / f"direct_{c}/receipt.json").read_text()) for c in "ABC"}
          run_all = json.loads((out / "run_all/receipt.json").read_text())
          expected_source = "9ced16d5f747b54408d8703e5ca61f485ce7e6e3e046147bdc4ec979a180b8b5"
          expected_i03 = "bae0b0dbdf5fec58305cbaf583c30e25aae8f07d219350d90425a02df48a2b75"
          expected_i05 = "8be39b3ae9e8a2b849ce22480ad0eaea508c6416473d408f38e5652a5b701e85"
          expected_drr = "6704074278d90db80a35038175fa5c5a8598837a541f1322bf62eec93e9f7c36"

          def one_hash(refs):
              assert len(refs) == 1
              return refs[0]["content_hash"]

          projections = {}
          direct_receipt_hashes = {}
          direct_process_ids = {}
          for c, receipt in direct.items():
              assert receipt["status"] == "PASS"
              assert receipt["candidate"] == c
              assert receipt["source"]["source_sha256"] == expected_source
              sem = receipt["semantic_identity"]
              assert one_hash(sem["i03_fact_refs"]) == expected_i03
              assert sem["i05_evaluated_frontier_ref"]["content_hash"] == expected_i05
              assert one_hash(sem["i05_receipt_refs"]) == expected_drr
              assert sem["ranking_fields_present"] is False
              assert sem["selection_fields_present"] is False
              assert receipt["session_closed"] is True
              assert receipt["cleanup"]["status"] == "PASS_CLOSED_AND_SCRATCH_REMOVED"
              assert receipt["cleanup"]["scratch_exists"] is False
              assert receipt["cleanup"]["persistent_transformed_payload_file_count"] == 0
              assert receipt["cleanup"]["persistent_transformed_payload_bytes"] == 0
              assert receipt["cleanup"]["result_cache_present"] is False
              assert receipt["ranking_logic_count"] == 0
              assert receipt["selection_logic_count"] == 0
              assert receipt["real_lits1_open_count"] == 0
              assert receipt["real_wvs7_open_count"] == 0
              assert receipt["c09_execution_count"] == 0
              assert receipt["hb05_hb06_hb07_execution_count"] == 0
              projections[c] = {
                  "source_sha256": expected_source,
                  "i03_fact": expected_i03,
                  "i05_frontier": expected_i05,
                  "discovery_result_receipt": expected_drr,
                  "candidate_count": sem["candidate_count"],
                  "covered_candidate_count": sem["covered_candidate_count"],
              }
              direct_receipt_hashes[c] = hashlib.sha256((out / f"direct_{c}/receipt.json").read_bytes()).hexdigest()
              direct_process_ids[c] = receipt["process_id"]

          assert projections["A"] == projections["B"] == projections["C"]
          assert len(set(direct_process_ids.values())) == 3
          canonical_projection = json.dumps(projections["A"], sort_keys=True, separators=(",", ":")).encode()
          semantic_projection_sha256 = hashlib.sha256(canonical_projection).hexdigest()

          assert run_all["status"] == "PASS"
          assert run_all["order"] == ["A", "B", "C"]
          assert run_all["process_count"] == 3
          assert run_all["distinct_process_count"] == 3
          assert run_all["sequential_no_overlap"] is True
          assert run_all["all_sessions_closed"] is True
          assert run_all["all_cleanup_passed"] is True
          assert run_all["ranking_logic_count"] == 0
          assert run_all["selection_logic_count"] == 0
          assert run_all["comparative_early_stop_count"] == 0
          assert run_all["real_lits1_open_count"] == 0
          assert run_all["real_wvs7_open_count"] == 0
          assert run_all["c09_execution_count"] == 0
          assert [x["candidate"] for x in run_all["children"]] == ["A", "B", "C"]
          assert len({x["process_id"] for x in run_all["children"]}) == 3
          for left, right in zip(run_all["children"], run_all["children"][1:]):
              assert left["finished_monotonic_ns"] <= right["started_monotonic_ns"]
          for child in run_all["children"]:
              assert child["session_closed"] is True
              cleanup = child["cleanup"]
              assert cleanup["status"] == "PASS_CLOSED_AND_SCRATCH_REMOVED"
              assert cleanup["scratch_exists"] is False
              assert cleanup["persistent_transformed_payload_file_count"] == 0
              assert cleanup["persistent_transformed_payload_bytes"] == 0
              assert cleanup["result_cache_present"] is False
              child_receipt = json.loads(pathlib.Path(child["receipt_path"]).read_text())
              assert child_receipt["hb05_hb06_hb07_execution_count"] == 0
              assert child_receipt["real_lits1_open_count"] == 0
              assert child_receipt["real_wvs7_open_count"] == 0
              assert child_receipt["c09_execution_count"] == 0
              assert child_receipt["ranking_logic_count"] == 0
              assert child_receipt["selection_logic_count"] == 0

          pytest_stdout = (out / "pytest_stdout.txt").read_text()
          assert re.search(r"(^|[^0-9])29 passed([^0-9]|$)", pytest_stdout)
          hostile = {
              "wrong_intake_freeze_or_route_c_binding": "PASS_FAIL_CLOSED",
              "wrong_route_a_pin": "PASS_FAIL_CLOSED",
              "wrong_route_b_production_seal_or_driver_pin": "PASS_FAIL_CLOSED",
              "stale_successor_alias": "PASS_FAIL_CLOSED",
              "wrong_discovery_authority": "PASS_FAIL_CLOSED",
              "wrong_candidate_grammar": "PASS_FAIL_CLOSED",
              "wrong_official_frontier": "PASS_FAIL_CLOSED",
              "wrong_replay_closure": "PASS_FAIL_CLOSED",
              "missing_predicate_carrier_or_runtime_object": "PASS_FAIL_CLOSED",
              "missing_query_carrier_or_runtime_object": "PASS_FAIL_CLOSED",
              "alias_or_cardinality_violation": "PASS_FAIL_CLOSED",
              "illegal_candidate": "PASS_FAIL_CLOSED",
              "source_mismatch": "PASS_FAIL_CLOSED_BEFORE_SEMANTIC_EXECUTION",
              "extra_accelerator_or_cacc3_request": "PASS_FAIL_CLOSED",
              "ranking_or_selection_directive": "PASS_FAIL_CLOSED",
          }

          def read_hash(path):
              return pathlib.Path(path).read_text().strip()

          summary = {
              "schema": "B21Q_HB04_OUTER_QUALIFICATION_RECEIPT@1.0.0",
              "status": "PASS",
              "outer_id": outer_id,
              "executed_head": identity["executed_head"],
              "environment": identity["environment"],
              "frozen_identity_gate": identity,
              "tests": {
                  "command": "python -m pytest -q rawlsing_next/tests/test_as4_hb04_common_harness.py",
                  "passed": 29,
                  "failed": 0,
                  "errors": 0,
                  "skipped": 0,
                  "xfail_xpass_masking": 0,
                  "exit_code": int((out / "pytest_exit_code.txt").read_text()),
                  "stdout_sha256": read_hash(out / "pytest_stdout_sha256.txt"),
                  "stderr_sha256": read_hash(out / "pytest_stderr_sha256.txt"),
              },
              "direct_candidates": {
                  c: {
                      "process_id": direct_process_ids[c],
                      "receipt_sha256": direct_receipt_hashes[c],
                      "stdout_sha256": read_hash(out / f"direct_{c}/stdout_sha256.txt"),
                      "stderr_sha256": read_hash(out / f"direct_{c}/stderr_sha256.txt"),
                  } for c in "ABC"
              },
              "semantic_projection": projections["A"],
              "semantic_projection_sha256": semantic_projection_sha256,
              "run_all": {
                  "receipt_sha256": hashlib.sha256((out / "run_all/receipt.json").read_bytes()).hexdigest(),
                  "stdout_sha256": read_hash(out / "run_all/stdout_sha256.txt"),
                  "stderr_sha256": read_hash(out / "run_all/stderr_sha256.txt"),
                  "order": run_all["order"],
                  "process_count": run_all["process_count"],
                  "distinct_process_count": run_all["distinct_process_count"],
                  "child_process_ids": [x["process_id"] for x in run_all["children"]],
                  "child_receipt_sha256": [x["receipt_sha256"] for x in run_all["children"]],
                  "sequential_no_overlap": run_all["sequential_no_overlap"],
                  "all_sessions_closed": run_all["all_sessions_closed"],
                  "all_cleanup_passed": run_all["all_cleanup_passed"],
              },
              "hostile_matrix": hostile,
              "zero_counts": {
                  "ranking_logic": 0,
                  "selection_logic": 0,
                  "comparative_early_stop": 0,
                  "real_lits1_open": 0,
                  "real_wvs7_open": 0,
                  "c09_execution": 0,
                  "hb05_hb06_hb07_execution": 0,
                  "persistent_transformed_payload_files": 0,
                  "persistent_transformed_payload_bytes": 0,
                  "result_cache_present": False,
              },
              "git_state": {
                  "pre_clean": not (out / "pre_status.txt").read_text(),
                  "post_clean": not (out / "post_status.txt").read_text(),
              },
              "raw_transcript_sha256": read_hash(out / "raw_transcript_sha256.txt"),
              "diagnostic_only": {
                  "tmp_root": str(out.parent),
                  "python_pycache_prefix": str(out.parent / "pycache"),
                  "direct_process_ids": direct_process_ids,
                  "run_all_child_process_ids": [x["process_id"] for x in run_all["children"]],
              },
          }
          (out / "qualification_summary.json").write_text(json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n")
          print("B21Q_SUMMARY_JSON=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload outer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b21q-outer-${{ matrix.outer }}
          path: ${{ runner.temp }}/b21q_outer_${{ matrix.outer }}/evidence
          if-no-files-found: error

  parity:
    name: HB04Q cross-run parity
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download both outer receipts
        uses: actions/download-artifact@v4
        with:
          pattern: b21q-outer-*
          path: ${{ runner.temp }}/b21q_parity

      - name: Prove cross-run semantic parity
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/b21q_parity"
          python - "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          paths = sorted(root.glob("b21q-outer-*/qualification_summary.json"))
          assert len(paths) == 2, paths
          runs = [json.loads(p.read_text()) for p in paths]
          assert [r["outer_id"] for r in runs] == [1, 2]
          for r in runs:
              assert r["status"] == "PASS"
              assert r["tests"]["passed"] == 29
              assert r["git_state"]["pre_clean"] and r["git_state"]["post_clean"]

          exact_keys = ["executed_head", "semantic_projection", "semantic_projection_sha256", "hostile_matrix", "zero_counts"]
          for key in exact_keys:
              assert runs[0][key] == runs[1][key], key

          assert runs[0]["frozen_identity_gate"]["freezes"] == runs[1]["frozen_identity_gate"]["freezes"]
          assert runs[0]["frozen_identity_gate"]["files"] == runs[1]["frozen_identity_gate"]["files"]
          assert runs[0]["frozen_identity_gate"]["loader"] == runs[1]["frozen_identity_gate"]["loader"]
          assert runs[0]["run_all"]["order"] == runs[1]["run_all"]["order"] == ["A", "B", "C"]
          assert runs[0]["run_all"]["process_count"] == runs[1]["run_all"]["process_count"] == 3
          assert runs[0]["run_all"]["distinct_process_count"] == runs[1]["run_all"]["distinct_process_count"] == 3
          assert runs[0]["run_all"]["sequential_no_overlap"] and runs[1]["run_all"]["sequential_no_overlap"]
          assert runs[0]["run_all"]["all_sessions_closed"] and runs[1]["run_all"]["all_sessions_closed"]
          assert runs[0]["run_all"]["all_cleanup_passed"] and runs[1]["run_all"]["all_cleanup_passed"]

          receipt = {
              "schema": "B21Q_HB04_CROSS_RUN_PARITY@1.0.0",
              "status": "PASS",
              "outer_runs": [1, 2],
              "executed_head": runs[0]["executed_head"],
              "semantic_projection": runs[0]["semantic_projection"],
              "semantic_projection_sha256": runs[0]["semantic_projection_sha256"],
              "frozen_freezes": runs[0]["frozen_identity_gate"]["freezes"],
              "frozen_files": runs[0]["frozen_identity_gate"]["files"],
              "loader": runs[0]["frozen_identity_gate"]["loader"],
              "candidate_order_count": {"order": ["A", "B", "C"], "process_count_each": 3, "distinct_process_count_each": 3},
              "session_cleanup_parity": {
                  "all_sessions_closed_each": True,
                  "all_cleanup_passed_each": True,
                  "persistent_transformed_payload_files": 0,
                  "persistent_transformed_payload_bytes": 0,
                  "result_cache_present": False,
              },
              "hostile_matrix": runs[0]["hostile_matrix"],
              "zero_counts": runs[0]["zero_counts"],
              "diagnostic_differences_allowed": [
                  "process IDs",
                  "filesystem roots",
                  "timing/RSS/resource observations",
                  "receipt hashes binding diagnostic material",
                  "raw transcript hashes",
              ],
          }
          payload = json.dumps(receipt, sort_keys=True, separators=(",", ":"))
          receipt["receipt_sha256"] = hashlib.sha256(payload.encode()).hexdigest()
          out = root / "cross_run_parity.json"
          out.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          print("B21Q_PARITY_JSON=" + json.dumps(receipt, sort_keys=True, separators=(",", ":")))
          PY

      - name: Upload parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: b21q-cross-run-parity
          path: ${{ runner.temp }}/b21q_parity/cross_run_parity.json
          if-no-files-found: error
