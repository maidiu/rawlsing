name: B20IR transient routing-ref repair smoke

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-route-c-routing-membership-exact-ref-repair-r1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repaired B20IR commit
        uses: actions/checkout@v4
        with:
          ref: 9a98bc8b52f5fb5088afbe86f7917351091ee216
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate pinned smoke environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas pytest

      - name: Smoke repaired routing membership through first CACC1 build
        shell: bash
        run: |
          set -u
          OUT="$RUNNER_TEMP/b20ir-smoke"
          mkdir -p "$OUT"
          DRIVER='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1/WORKERS/B20_AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_R1/01_ROUTE_C_IMPLEMENTATION_QUALIFICATION.py'
          python - <<'PY' > "$OUT/environment.json"
          import json, platform, sys, pandas, pyarrow
          print(json.dumps({
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "pyarrow_version": pyarrow.__version__,
              "pandas_version": pandas.__version__,
          }, sort_keys=True, separators=(",", ":")))
          PY
          git rev-parse HEAD > "$OUT/executed_tree_head.txt"
          git hash-object rawlsing_next/pre553_route_c_accelerators.py > "$OUT/repaired_implementation_git_blob.txt"
          git hash-object "$DRIVER" > "$OUT/repaired_driver_git_blob.txt"
          sha256sum rawlsing_next/pre553_route_c_accelerators.py | awk '{print $1}' > "$OUT/repaired_implementation_sha256.txt"
          sha256sum "$DRIVER" | awk '{print $1}' > "$OUT/repaired_driver_sha256.txt"

          set +e
          PYTHONPATH="$PWD" python - "$PWD/$DRIVER" "$OUT" <<'PY' >"$OUT/stdout.txt" 2>"$OUT/stderr.txt"
          import importlib.util, json, pathlib, sys, tempfile
          driver=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          spec=importlib.util.spec_from_file_location("_b20ir_repaired_driver", driver)
          if spec is None or spec.loader is None:
              raise RuntimeError("cannot load repaired B20 driver")
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          fx, incidence, stream, projection, determinants = m._route_c_fixture("b20ir-smoke")
          from rawlsing_next.pre553_route_c_accelerators import Cacc1Paths, build_cacc1
          with tempfile.TemporaryDirectory(prefix="b20ir-cacc1-") as td:
              root=pathlib.Path(td)
              bundle=build_cacc1(
                  stream=stream,
                  projection=projection,
                  determinants=determinants,
                  paths=Cacc1Paths(root/"cacc1.arrow", root/"cacc1.manifest.json"),
              )
              result={
                  "schema":"B20IR_ROUTING_MEMBERSHIP_EXACT_REF_SMOKE@1.0.0",
                  "status":"PASS",
                  "repaired_driver_fixture_completed":True,
                  "routing_membership_completed":True,
                  "first_cacc1_build_entered":True,
                  "first_cacc1_build_completed":True,
                  "cacc1_row_count":len(bundle.rows),
                  "cacc1_logical_content_hash":bundle.manifest["logical_content_hash"],
                  "cacc1_physical_byte_sha256":bundle.manifest["physical_byte_sha256"],
                  "scope_ceiling":"IMPLEMENTATION_REPAIR_SMOKE_ONLY__NOT_B20Q2_QUALIFICATION_AUTHORITY"
              }
              data=json.dumps(result,sort_keys=True,separators=(",",":"))+"\n"
              (out/"smoke_result.json").write_text(data,encoding="utf-8")
              print(data,end="")
          PY
          code=$?
          set -e
          printf '%s\n' "$code" > "$OUT/exit_code.txt"
          sha256sum "$OUT/stdout.txt" | awk '{print $1}' > "$OUT/stdout_sha256.txt"
          sha256sum "$OUT/stderr.txt" | awk '{print $1}' > "$OUT/stderr_sha256.txt"
          if [ -f "$OUT/smoke_result.json" ]; then
            sha256sum "$OUT/smoke_result.json" | awk '{print $1}' > "$OUT/smoke_result_sha256.txt"
          fi
          exit "$code"

      - name: Upload B20IR smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20ir-routing-membership-exact-ref-smoke
          path: ${{ runner.temp }}/b20ir-smoke
          if-no-files-found: error
