name: FIABC LM2 R1J SAV Representation Authority Court
on:
  push:
    branches:
      - agent/rabochii-premain-fiabc-lm2-r1j-sav-decoder-representation-authority-r1
  workflow_dispatch:

jobs:
  representation-authority-court:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-free court dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas
      - name: Run exact representation hostile court
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            rawlsing_next/tests/test_fiabc_lm2_r1j_sav_representation_authority.py \
            rawlsing_next/tests/test_pre553_empirical_objects_authority.py \
            rawlsing_next/tests/test_pre553_source_backed_c11_facade.py
      - name: Emit reissued deterministic identities
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          from rawlsing_next.fiabc_lm2_r1j_wvs7_representation_authority import (
              representation_authority_snapshot,
          )
          path = Path("WORKER_RETURNS/EE-P2R6S/05_WVS7_PROJECTION_MATERIALIZER.py")
          spec = importlib.util.spec_from_file_location("r6s_r1j", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          receipt = module.authority_identity_receipt()
          receipt["lock2"] = module.LOCK2
          receipt["response_binding_ref"] = module.RESPONSE_BINDING_REF.as_dict()
          receipt["representation_snapshot_ref"] = representation_authority_snapshot().ref.as_dict()
          print("FIABC_LM2_R1J_IDENTITIES="+json.dumps(receipt, sort_keys=True, separators=(",",":")))
          PY
