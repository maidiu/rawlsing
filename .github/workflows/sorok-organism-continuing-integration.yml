name: SOROK sourcefree organism continuing integration

on:
  push:
    branches:
      - integration/sorok-organism-continuing-r1
  pull_request:
    branches:
      - integration/pre-main-reconciliation-r1
    paths:
      - 'SEAM/ORACLE/UM_SOROK_ORGANISM_R3/**'
      - '.github/workflows/sorok-organism-continuing-integration.yml'

jobs:
  package-no-drop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected-base file conservation and exact R17 + organism custody
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          base = "fbc2080403607d85cd67a025b8a9a4ebd41e70c1"
          package = "SEAM/ORACLE/UM_SOROK_ORGANISM_R3"
          donor = "30e464796270ca349e471aaae388911dd500c6b5"
          expected = {
              package + "/um_sorok_organism/storage.py":
                  "75087ed57c3a39d82b9ded5ebf8123f949e54c21",
              package + "/tests/test_r17_source_preflight.py":
                  "b25f93b2fd81fa814bfeee9be843d7279cf0b31b",
          }
          def git(*args):
              return subprocess.check_output(("git",) + args, text=True).strip()
          assert git("rev-parse", "HEAD:" + package) == donor, "DONOR_PACKAGE_BYTES_MOVED"
          for path, blob in expected.items():
              assert git("rev-parse", "HEAD:" + path) == blob, "R17_ACCEPTED_BLOB_LOST:" + path
          changes = git("diff", "--name-status", base, "HEAD").splitlines()
          assert changes, "EXPECTED_SOROK_PACKAGE_NOT_PRESENT"
          for row in changes:
              status, path = row.split("\t", 1)
              assert status == "A", "PROTECTED_EXISTING_FILE_MODIFIED_OR_REMOVED:" + row
              assert (path.startswith(package + "/") or
                      path == ".github/workflows/sorok-organism-continuing-integration.yml"), (
                         "UNRELATED_PATH_ADDED:" + path)
          print("NO_DROP=PASS; EXACT_DONOR_TREE=PASS; R17_P018_ACCEPTED_SOURCE=PASS")
          print("ADDITIONS_COUNT=" + str(len(changes)))
          PY

  organism-sourcefree:
    needs: package-no-drop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    defaults:
      run:
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile organism owner modules
        run: python -m compileall -q um_sorok_organism
      - name: R21 offscreen-life seven positive/negative first-consumer cases
        run: python -m unittest -q tests.test_pre_encounter_history_r21
      - name: R21 optimized seven first-consumer cases
        run: python -O -m unittest -q tests.test_pre_encounter_history_r21
      - name: Full inherited unittest court
        run: python -m unittest discover -s tests -q
      - name: Optimized inherited unittest court
        run: python -O -m unittest discover -s tests -q
      - name: Full inherited pytest court
        run: python -m pytest -q
      - name: Nadia two-history 14-day independent-beat first consumer and cold SQLite
        shell: bash
        run: |
          set -euo pipefail
          export NADIA_SQLITE_DIR="$RUNNER_TEMP/sorok-nadia-$RANDOM"
          python -m um_sorok_organism.joined_longitudinal_demo \
            --directory "$NADIA_SQLITE_DIR" --days 14 --beats 12 > "$RUNNER_TEMP/sorok-nadia.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from um_sorok_organism.storage import ResearchLedger
          outcome = json.loads(Path(os.environ["RUNNER_TEMP"], "sorok-nadia.json").read_text())
          assert outcome["early_historical_cultural_divergence_observed"] is True
          assert outcome["nadia_action_not_externally_requested"] is True
          for label, db in [("spoken", "speaking.sqlite3"), ("unspoken", "silent.sqlite3")]:
              case = outcome["contrast"][label]
              assert case["cold_integrity"]["valid"] is True
              assert case["later_nadia"] == case["cold_nadia"]
              assert case["independent_beats_reported"] == 12
              persisted = ResearchLedger(str(Path(os.environ["NADIA_SQLITE_DIR"], db)))
              try:
                  assert persisted.verify_chain()["valid"] is True
              finally:
                  persisted.close()
          print("NADIA_TWO_HISTORIES_AND_COLD_SQLITE=PASS")
          PY
