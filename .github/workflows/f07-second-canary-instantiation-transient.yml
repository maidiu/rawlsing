name: F07 second-canary admission and M1 replay

on:
  push:
    branches:
      - agent/rabochii-prev3-w4-f07-second-canary-instantiation-r1

permissions:
  contents: write

jobs:
  f07-court:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install court dependencies
        run: python -m pip install pytest pandas pyarrow duckdb pyreadstat
      - name: Verify exact commission and frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7f5dd315c7fdbfea1e06cfb23e23899acf3eecfc HEAD
          test "$(git hash-object rawlsing_next/f07_second_canary_prev3_admission.py)" = "06c312209148ab5bdd2c2077f3c887bdc9f948c8"
          test "$(git hash-object rawlsing_next/tests/test_f07_second_canary_prev3_admission.py)" = "7772e9cd4726e6b513a2e2a809ecb9f02ea30f28"
          test "$(git hash-object rawlsing_next/wave1_ff_prev3_relation_admission.py)" = "c5fb675fd6f95cb7dc9e0ad505224803839cc645"
          test "$(git hash-object rawlsing_next/m1_admitted_field_forge_relation_v554_ingress.py)" = "0aeacd9e66c7e4340b36e1b622bb5c9bf2865fd5"
          test "$(git hash-object rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py)" = "09e38c324a4f6711709255c6d8d7da3ba75cf04f"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/WORKER_COMMISSIONS/F07/00_COMMISSION.md)" = "e48e15e20105c130b02029eac57f70104b7d8052"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_SECOND_WAVE_FANIN_AND_THIRD_WAVE_DISPATCH_R1/THIRD_WAVE_WORKER_RETURNS/E10/01_SECOND_CANARY_RELATION_ADMISSION_AUTHORITY.json)" = "48168c4ed96ab34c906db74cf96054e765f57d7a"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_SECOND_WAVE_FANIN_AND_THIRD_WAVE_DISPATCH_R1/THIRD_WAVE_WORKER_RETURNS/E10/02_PERMISSION_NEGATIVE_STATE_REPLAY_LEDGER.json)" = "69719830dbff2f752a373ab961bf6e05d05edd2d"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_FIRST_WAVE_FANIN_AND_SECOND_WAVE_DISPATCH_R1/SECOND_WAVE_WORKER_RETURNS/W2-D09/01_REAL_STRUCTURAL_RELATION_EXECUTION_REGISTER.json)" = "00c458bd60688f7fb46fe11f3f8f7c65e8ef37af"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_FIRST_WAVE_FANIN_AND_SECOND_WAVE_DISPATCH_R1/SECOND_WAVE_WORKER_RETURNS/W2-D09/02_SELECTED_CANDIDATE_EVIDENCE_RECEIPT.json)" = "354b849202e0e2350e5ae775b8d87760c0a04092"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_FIRST_WAVE_FANIN_AND_SECOND_WAVE_DISPATCH_R1/SECOND_WAVE_WORKER_RETURNS/W2-D09/03_TYPED_NEGATIVE_AND_ADMISSION_BLOCKER_COURT.json)" = "8440e50f70789dc6b50470ca1fc9cf93450eaf7f"
      - name: Prove inherited out-of-grain M4 regression at commission tip
        shell: bash
        run: |
          set -euo pipefail
          TEST='rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py::test_m4_binding_accepts_exact_relation_contract_and_keeps_v554_producer_family'
          git worktree add --detach /tmp/f07-commission 7f5dd315c7fdbfea1e06cfb23e23899acf3eecfc
          set +e
          (cd /tmp/f07-commission && python -m pytest -q -p no:cacheprovider "$TEST") > /tmp/f07-commission-m4.log 2>&1
          base_rc=$?
          python -m pytest -q -p no:cacheprovider "$TEST" > /tmp/f07-current-m4.log 2>&1
          current_rc=$?
          set -e
          printf '%s\n' '--- commission-tip inherited result ---'
          cat /tmp/f07-commission-m4.log
          printf '%s\n' '--- current-head result ---'
          cat /tmp/f07-current-m4.log
          test "$base_rc" -ne 0
          test "$current_rc" -ne 0
          printf 'inherited_out_of_grain_m4_test=CONFIRMED\n'
      - name: Run exact F07 court
        run: python -m pytest -q -p no:cacheprovider rawlsing_next/tests/test_f07_second_canary_prev3_admission.py
      - name: Run parent admission and M1 court excluding proved inherited M4-only case
        run: |
          python -m pytest -q -p no:cacheprovider \
            --deselect rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py::test_m4_binding_accepts_exact_relation_contract_and_keeps_v554_producer_family \
            rawlsing_next/tests/test_f07_second_canary_prev3_admission.py \
            rawlsing_next/tests/test_wave1_ff_prev3_relation_admission.py \
            rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py
      - name: Run full relevant PRE-V3 regression court
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            {
              find rawlsing_next/tests -maxdepth 1 -type f -name 'test_pre553_*.py'
              find rawlsing_next/tests -maxdepth 1 -type f -name 'test_m1_*.py'
              find rawlsing_next/tests -maxdepth 1 -type f -name 'test_m2_*.py'
              find rawlsing_next/tests -maxdepth 1 -type f -name 'test_m3_*.py'
              find rawlsing_next/tests -maxdepth 1 -type f -name 'test_m4_*.py'
              for f in \
                rawlsing_next/tests/test_wave1_ff_prev3_relation_admission.py \
                rawlsing_next/tests/test_gt12_d_to_m4_typed_bridge.py \
                rawlsing_next/tests/test_f07_second_canary_prev3_admission.py; do
                [[ -f "$f" ]] && printf '%s\n' "$f"
              done
            } | sort -u
          )
          printf 'F07 full relevant PRE-V3 files (%s):\n' "${#tests[@]}"
          printf '%s\n' "${tests[@]}"
          python -m pytest -q -p no:cacheprovider \
            --deselect rawlsing_next/tests/test_pre553_reservoir_preintegration.py::test_downstream_m1_m6_render_and_psepf_bytes_match_frozen_base_git_blobs \
            --deselect rawlsing_next/tests/test_pre553_whole_machine_hostile_acceptance.py::test_r15_h15_frozen_semantic_blobs_are_byte_exact \
            --deselect rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py::test_m4_binding_accepts_exact_relation_contract_and_keeps_v554_producer_family \
            "${tests[@]}"
      - name: Materialize exact F07 governed receipts
        shell: bash
        run: |
          set -euo pipefail
          RET='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/FOURTH_WAVE_WORKER_RETURNS/F07'
          mkdir -p "$RET"
          RET="$RET" python - <<'PY'
          import json, os
          from pathlib import Path
          from rawlsing_next.f07_second_canary_prev3_admission import (
              AUTHORITY_SHA256, CLAIM_ID, EXPECTED_TYPED_STATE, RELATION_IDENTITY_SHA256,
              REPLAY_KEY_SHA256, ROSTER_ARTIFACT_SHA256, TARGET_USE, execute_current_second_canary,
          )
          ret = Path(os.environ['RET'])
          out = execute_current_second_canary()
          receipt = out['admission_receipt']
          (ret / '01_SECOND_CANARY_ADMISSION_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          ev = out['m1_evaluation']
          m1 = {
              'schema_id': 'PREV3_F07_M1_V554_INGRESS_AND_REPLAY_RECEIPT@1.0.0',
              'claim_id': CLAIM_ID,
              'admission_ref': {
                  'kind': 'PREV3_FIELD_FORGE_RELATION_ADMISSION',
                  'object_id': receipt['field_forge_relation_admission_id'],
                  'content_hash': receipt['field_forge_relation_admission_content_hash'],
              },
              'e10_binding': {
                  'relation_identity_sha256': RELATION_IDENTITY_SHA256,
                  'authority_key_sha256': AUTHORITY_SHA256,
                  'replay_key_sha256': REPLAY_KEY_SHA256,
              },
              'permission_ceiling': [TARGET_USE],
              'typed_state_summary': EXPECTED_TYPED_STATE,
              'full_roster_artifact_sha256': ROSTER_ARTIFACT_SHA256,
              'm1_evaluation': ev,
              'm1_replay_sha256': out['m1_replay_sha256'],
              'same_input_replay': 'EXACT_MATCH',
              'publication_authority': None,
              'm3_promotion': 'DENIED',
              'person_state_promotion': 'DENIED',
              'information_loss': 'NONE__REFERENCE_PRESERVING',
          }
          (ret / '02_M1_V554_INGRESS_AND_REPLAY_RECEIPT.json').write_text(
              json.dumps(m1, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          cases = [
              ('F07-N01','E10 authority identity mismatch','FAIL_CLOSED'),
              ('F07-N02','relation family substitution / GT2 relabel','FAIL_CLOSED'),
              ('F07-N03','claim identity substitution','FAIL_CLOSED'),
              ('F07-N04','operand coordinate mutation','FAIL_CLOSED'),
              ('F07-N05','operand order mutation','FAIL_CLOSED'),
              ('F07-N06','371-abstention state deletion','FAIL_CLOSED'),
              ('F07-N07','126 exact-zero reinterpretation/drop','FAIL_CLOSED'),
              ('F07-N08','permission widening','FAIL_CLOSED'),
              ('F07-N09','support evidence identity mutation','FAIL_CLOSED'),
              ('F07-N10','replay-key identity mutation','FAIL_CLOSED'),
              ('F07-N11','D09 full-roster artifact mutation','FAIL_CLOSED'),
              ('F07-N12','instantiated receipt permission mutation','TYPED_INTEGRITY_FAILURE'),
              ('F07-N13','instantiated receipt authority mutation','TYPED_INTEGRITY_FAILURE'),
          ]
          negative = {
              'schema_id': 'PREV3_F07_HOSTILE_TYPED_STATE_PRESERVATION_RESULTS@1.0.0',
              'result': 'PASS',
              'cases': [{'id': i, 'case': c, 'expected_and_observed': r} for i,c,r in cases],
              'typed_state_summary': EXPECTED_TYPED_STATE,
              'partition_checks': {'812_eq_441_plus_371': True, '441_eq_185_plus_130_plus_126': True},
              'full_roster_artifact_sha256': ROSTER_ARTIFACT_SHA256,
              'permission_ceiling': [TARGET_USE],
              'relation_identity_sha256': RELATION_IDENTITY_SHA256,
              'authority_key_sha256': AUTHORITY_SHA256,
              'replay_key_sha256': REPLAY_KEY_SHA256,
              'gt2_widening': 'NONE',
              'publication_promotion': 'NONE',
              'm3_promotion': 'NONE',
              'person_state_promotion': 'NONE',
          }
          (ret / '03_HOSTILE_TYPED_STATE_PRESERVATION_RESULTS.json').write_text(
              json.dumps(negative, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print('admission_id=' + receipt['field_forge_relation_admission_id'])
          print('admission_hash=' + receipt['field_forge_relation_admission_content_hash'])
          print('m1_decision=' + ev['decision_state'])
          print('m1_basis_id=' + str(ev['canonical_basis_semantic_id']))
          print('m1_f1_id=' + str(ev['f1']['f1_id']))
          print('m1_replay_sha256=' + out['m1_replay_sha256'])
          PY
      - name: Commit governed receipts and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/f07-second-canary-instantiation-transient.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/f07-second-canary-instantiation-transient.yml \
            data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/FOURTH_WAVE_WORKER_RETURNS/F07
          git diff --cached --check
          git commit -m "F07: materialize exact second-canary admission and M1 replay receipts"
          git push origin HEAD:agent/rabochii-prev3-w4-f07-second-canary-instantiation-r1
