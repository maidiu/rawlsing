name: Rawlsing Worker Return Beacon

on:
  push:
    branches:
      - 'agent/return-beacon-fallback-proof-r1'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  fallback-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout installed beacon from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise installed fallback discovery and dedupe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python rawlsing_next/rabochii_return_beacon_sweep.py
          --issue 304
