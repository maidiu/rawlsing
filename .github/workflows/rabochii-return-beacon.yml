name: Rawlsing Worker Return Beacon

on:
  workflow_run:
    workflows:
      - Rabochii Governed Bounded Court
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rabochii-return-beacon.yml
      - rawlsing_next/rabochii_return_beacon.py
      - rawlsing_next/tests/test_rabochii_return_beacon.py
      - .rabochii/RETURN_BEACON_CONTRACT.md
      - .rabochii/return_manifest.template.json

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: >-
    rawlsing-return-beacon-${{
      github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id
    }}
  cancel-in-progress: true

jobs:
  self-test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Return-beacon contract tests
        run: python -m pytest -q rawlsing_next/tests/test_rabochii_return_beacon.py

  watch-governed-return:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch != '' &&
          startsWith(github.event.workflow_run.head_branch, 'agent/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout beacon implementation from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Watch worker branch for certified durable return
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python rawlsing_next/rabochii_return_beacon.py
          --issue 304
          watch
          --branch '${{ github.event.workflow_run.head_branch }}'
          --timeout-seconds 1500
          --interval-seconds 15

  scheduled-sweep:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout beacon implementation from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sweep recent agent returns
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python rawlsing_next/rabochii_return_beacon.py
          --issue 304
          sweep
