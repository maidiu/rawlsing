name: Rawlsing Worker Return Beacon

# Automatic return-beacon triggers are intentionally disabled.
# This workflow previously ran every 5 minutes and on agent-branch / governed-court
# events, consuming GitHub-hosted Actions minutes. Keep manual dispatch only so the
# notifier remains available for explicit diagnostics without background spend.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  fallback-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout beacon implementation from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sweep recent agent returns
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python rawlsing_next/rabochii_return_beacon_actionable.py
          --issue 304
          sweep
