name: B20Q2 transient full Route-C qualification

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-route-c-cacc1-cacc2-parity-qualification-q2-r1

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Q2 control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate exact qualification environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas pytest

      - name: Execute full repaired Route-C court twice from clean outer roots
        shell: bash
        run: |
          set -u
          EVIDENCE_SHA='41c14af0523ffb2050774fcce14e8944cba17436'
          DRIVER='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1/WORKERS/B20_AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_R1/01_ROUTE_C_IMPLEMENTATION_QUALIFICATION.py'
          OUT="$RUNNER_TEMP/b20q2-artifact"
          mkdir -p "$OUT"

          python - <<'PY' > "$OUT/environment.json"
          import json, platform, sys, pandas, pyarrow
          print(json.dumps({
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "pyarrow_version": pyarrow.__version__,
              "pandas_version": pandas.__version__,
          }, sort_keys=True, separators=(",", ":")))
          PY

          git worktree add --detach "$RUNNER_TEMP/b20q2-outer-1" "$EVIDENCE_SHA"
          git worktree add --detach "$RUNNER_TEMP/b20q2-outer-2" "$EVIDENCE_SHA"

          run_one () {
            idx="$1"
            work="$RUNNER_TEMP/b20q2-outer-$idx"
            out="$OUT/run$idx"
            mkdir -p "$out"
            git -C "$work" rev-parse HEAD > "$out/executed_tree_head.txt"
            git -C "$work" status --porcelain=v1 > "$out/pre_status.txt"
            git -C "$work" hash-object rawlsing_next/pre553_route_c_accelerators.py > "$out/implementation_git_blob.txt"
            git -C "$work" hash-object "$DRIVER" > "$out/driver_git_blob.txt"
            sha256sum "$work/rawlsing_next/pre553_route_c_accelerators.py" | awk '{print $1}' > "$out/implementation_sha256.txt"
            sha256sum "$work/$DRIVER" | awk '{print $1}' > "$out/driver_sha256.txt"
            printf '%s\n' "PYTHONPATH=$work python $work/$DRIVER --output $out/qualification_receipt.json" > "$out/command.txt"

            set +e
            PYTHONPATH="$work" python "$work/$DRIVER" --output "$out/qualification_receipt.json" >"$out/stdout.txt" 2>"$out/stderr.txt"
            code=$?
            printf '%s\n' "$code" > "$out/exit_code.txt"
            git -C "$work" status --porcelain=v1 > "$out/post_status.txt"
            sha256sum "$out/stdout.txt" | awk '{print $1}' > "$out/stdout_sha256.txt"
            sha256sum "$out/stderr.txt" | awk '{print $1}' > "$out/stderr_sha256.txt"
            if [ -f "$out/qualification_receipt.json" ]; then
              sha256sum "$out/qualification_receipt.json" | awk '{print $1}' > "$out/qualification_receipt_sha256.txt"
            fi
            return "$code"
          }

          set +e
          run_one 1
          C1=$?
          run_one 2
          C2=$?
          set -e

          python - "$OUT" "$C1" "$C2" <<'PY'
          import hashlib, json, pathlib, sys

          out=pathlib.Path(sys.argv[1])
          codes=[int(sys.argv[2]),int(sys.argv[3])]
          expected_terminal="AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_IMPLEMENTATION_COMPLETE__READY_FOR_COMMON_ABC_HARNESS_INTAKE"
          expected_blob_impl="abfdc91a71ef5e18c4a8a6bf62fa65750d8d9889"
          expected_blob_driver="5377c70b5b3b9110cfd719b62ae1c3e2ceb07843"
          expected_tree="41c14af0523ffb2050774fcce14e8944cba17436"

          runs=[]
          for idx,code in enumerate(codes,1):
              d=out/f"run{idx}"
              receipt=None
              rp=d/"qualification_receipt.json"
              if rp.exists():
                  receipt=json.loads(rp.read_text())
              runs.append({
                  "index":idx,
                  "exit_code":code,
                  "executed_tree_head":(d/"executed_tree_head.txt").read_text().strip(),
                  "pre_status":(d/"pre_status.txt").read_text(),
                  "post_status":(d/"post_status.txt").read_text(),
                  "implementation_git_blob":(d/"implementation_git_blob.txt").read_text().strip(),
                  "driver_git_blob":(d/"driver_git_blob.txt").read_text().strip(),
                  "implementation_sha256":(d/"implementation_sha256.txt").read_text().strip(),
                  "driver_sha256":(d/"driver_sha256.txt").read_text().strip(),
                  "command":(d/"command.txt").read_text().strip(),
                  "stdout_sha256":(d/"stdout_sha256.txt").read_text().strip(),
                  "stderr_sha256":(d/"stderr_sha256.txt").read_text().strip(),
                  "qualification_receipt_sha256":(d/"qualification_receipt_sha256.txt").read_text().strip() if (d/"qualification_receipt_sha256.txt").exists() else None,
                  "receipt":receipt,
              })

          def full_pass(r):
              x=r["receipt"]
              if r["exit_code"] != 0 or not isinstance(x,dict):
                  return False
              if r["executed_tree_head"] != expected_tree:
                  return False
              if r["pre_status"]:
                  return False
              if r["implementation_git_blob"] != expected_blob_impl or r["driver_git_blob"] != expected_blob_driver:
                  return False
              if x.get("schema")!="B20_ROUTE_C_IMPLEMENTATION_QUALIFICATION@1.0.0":
                  return False
              if x.get("status")!="PASS" or x.get("terminal")!=expected_terminal:
                  return False
              if x.get("pinned_pyarrow_version")!="25.0.1":
                  return False
              s=x.get("single_process",{})
              f=x.get("fresh_process_replay",{})
              if s.get("status")!="PASS" or s.get("terminal")!=expected_terminal:
                  return False
              if s.get("accelerator_count")!=2 or s.get("candidate_execution_count")!=1:
                  return False
              if s.get("pinned_pyarrow_version")!="25.0.1":
                  return False
              if s.get("real_c09_execution_count")!=0 or s.get("wvs7_execution_count")!=0 or s.get("architecture_ranking_count")!=0:
                  return False
              hostile=s.get("hostile",{})
              expected_hostiles={
                  "stale_cacc1":"PASS_FAIL_CLOSED",
                  "corrupt_cacc1":"PASS_FAIL_CLOSED",
                  "stale_cacc2":"PASS_FAIL_CLOSED",
                  "corrupt_cacc2":"PASS_FAIL_CLOSED",
                  "unauthorized_extra_cache_material":"PASS_FAIL_CLOSED",
              }
              if hostile != expected_hostiles:
                  return False
              if s.get("delete_rebuild")!="PASS_EXACT_IDENTITIES_PRESERVED":
                  return False
              if f.get("status")!="PASS" or f.get("process_count")!=2:
                  return False
              if len(f.get("independent_roots",[]))!=2 or len(set(f.get("independent_roots",[])))!=2:
                  return False
              required=set(("cacc1","cacc2","cacheless_release_ref","cacheless_replay_ref","query_fact_refs","discovery_frontier_ref","discovery_receipt_refs"))
              if set(f.get("reproduced_keys",[])) != required:
                  return False
              return True

          semantic_keys=(
              "cacc1","cacc2","cacheless_release_ref","cacheless_replay_ref",
              "query_fact_refs","discovery_frontier_ref","discovery_receipt_refs",
              "hostile","delete_rebuild","accelerator_count","pinned_pyarrow_version",
              "candidate_execution_count","real_c09_execution_count",
              "wvs7_execution_count","architecture_ranking_count"
          )
          outer_semantic_match=False
          internal_replay_match=False
          if all(isinstance(r["receipt"],dict) for r in runs):
              a=runs[0]["receipt"]["single_process"]
              b=runs[1]["receipt"]["single_process"]
              outer_semantic_match=all(a.get(k)==b.get(k) for k in semantic_keys)
              fa=runs[0]["receipt"]["fresh_process_replay"]
              fb=runs[1]["receipt"]["fresh_process_replay"]
              fresh_keys=(
                  "status","process_count","reproduced_keys",
                  "cacc1_logical_content_hash","cacc1_physical_byte_sha256",
                  "cacc2_logical_content_hash","discovery_frontier_ref",
                  "query_fact_refs","discovery_receipt_refs"
              )
              internal_replay_match=all(fa.get(k)==fb.get(k) for k in fresh_keys)

          result={
              "schema":"B20Q2_OUTER_QUALIFICATION_EXECUTION@1.0.0",
              "evidence_tree":expected_tree,
              "frozen_implementation_blob":expected_blob_impl,
              "frozen_driver_blob":expected_blob_driver,
              "pyarrow_pin":"25.0.1",
              "runs":runs,
              "outer_semantic_keys":list(semantic_keys),
              "outer_semantic_identity_match":outer_semantic_match,
              "internal_replay_summary_match":internal_replay_match,
              "status":"PASS" if all(full_pass(r) for r in runs) and outer_semantic_match and internal_replay_match else "FAIL",
          }
          data=(json.dumps(result,sort_keys=True,separators=(",",":"))+"\n").encode()
          (out/"execution_result.json").write_bytes(data)
          (out/"execution_result_sha256.txt").write_text(hashlib.sha256(data).hexdigest()+"\n")
          print(json.dumps({
              "status":result["status"],
              "outer_semantic_identity_match":outer_semantic_match,
              "internal_replay_summary_match":internal_replay_match
          },sort_keys=True))
          if result["status"]!="PASS":
              raise SystemExit(1)
          PY

      - name: Upload B20Q2 full qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20q2-full-route-c-qualification
          path: ${{ runner.temp }}/b20q2-artifact
          if-no-files-found: error
