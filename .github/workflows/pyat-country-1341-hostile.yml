name: PYAT 1341 independent country hostile object-access court
on:
  push:
    branches: [agent/pyat-country-1341-hostile-review-r1, agent/pyat-country-numeric-economics-20261124-r2]
  workflow_dispatch:
jobs:
  hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pyreadstat pyarrow pytest
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_carrier rawlsing_next.tests.test_pre553_country_numeric_hostile -v
      - run: python -m pytest -q rawlsing_next/tests/test_pre553_empirical_objects_authority.py rawlsing_next/tests/test_pre553_i03_grouping.py rawlsing_next/tests/test_universal_workload.py rawlsing_next/tests/test_universal_workload_custody.py
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_economics -v
