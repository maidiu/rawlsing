name: PYAT country lifetime economics
on:
  push:
    branches: [agent/pyat-forge-ddm-lifetime-economics-r1, agent/pyat-forge-ddm-lifetime-economics-r2, agent/pyat-forge-ddm-lifetime-economics-r3, agent/pyat-forge-ddm-lifetime-economics-r4, agent/pyat-forge-ddm-lifetime-economics-r5, agent/pyat-forge-ddm-lifetime-economics-r6, agent/pyat-forge-ddm-lifetime-economics-r7, agent/pyat-forge-ddm-lifetime-economics-r8, agent/pyat-forge-ddm-lifetime-economics-r9]
  workflow_dispatch:
concurrency:
  group: pyat-lifetime-economics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python -m pytest -q rawlsing_next/tests/test_pre553_country_numeric_carrier.py rawlsing_next/tests/test_pre553_country_numeric_hostile.py rawlsing_next/tests/test_pre553_empirical_query.py rawlsing_next/tests/test_pre553_source_backed_c11_facade.py tools/pyat_forge_ddm_1354_hostile.py
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_economics -v
  lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rows: [128, 1024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0 psutil==7.0.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin bb1f792a71f7057510f8d303bf22a27ae6ad269e; lscpu; free -h
      - run: python -m tools.pyat_country_lifetime_court --rows ${{ matrix.rows }}
  novel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rows: [128, 1024]
    env:
      PYAT_LIFETIME_NOVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0 psutil==7.0.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin bb1f792a71f7057510f8d303bf22a27ae6ad269e; lscpu; free -h
      - run: python -m tools.pyat_country_lifetime_court --rows ${{ matrix.rows }}

  constituent-breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYAT_LIFETIME_NOVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0 psutil==7.0.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin bb1f792a71f7057510f8d303bf22a27ae6ad269e; lscpu; free -h
      - run: python -m tools.pyat_country_lifetime_court --rows 1024
