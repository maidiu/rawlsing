name: PYAT country lifetime economics
on:
  push:
    branches: [agent/pyat-forge-ddm-lifetime-economics-r1]
  workflow_dispatch:
concurrency:
  group: pyat-lifetime-economics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_carrier rawlsing_next.tests.test_pre553_country_numeric_hostile rawlsing_next.tests.test_pre553_empirical_query rawlsing_next.tests.test_pre553_source_backed_c11_facade tools.pyat_forge_ddm_1354_hostile -v
      - run: python -m unittest rawlsing_next.tests.test_pre553_country_numeric_economics -v
  lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rows: [128, 1024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas==3.1.1 numpy==2.4.6 pyreadstat==1.3.8 pyarrow==26.0.1 pytest==9.2.0 psutil==7.0.0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"; git fetch --no-tags --depth=1 origin 6328195236f337d54ce996fcef1a36db5d2b8db3; lscpu; free -h
      - run: python -m tools.pyat_country_lifetime_court --rows ${{ matrix.rows }}
