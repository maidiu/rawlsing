name: Independent Mechanism III frozen-cut test court
on:
  push:
    branches:
      - review/sorok-mechanism-iii-independent-20261109-r1

permissions:
  contents: read

jobs:
  miii-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated reviewer revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify review descends from immutable author handoff
        run: |
          git merge-base --is-ancestor 2439f36d54344a55ce5556fd0a5dca9207f8c1bd HEAD
          git diff --name-only 2439f36d54344a55ce5556fd0a5dca9207f8c1bd HEAD
          test "$(git diff --name-only 2439f36d54344a55ce5556fd0a5dca9207f8c1bd HEAD | grep -v '^WORKER_REVIEWS/SOROK-MECHANISM-III-INDEPENDENT-20261109-R1/' | grep -v '^.github/workflows/review-sorok-miii-20261109.yml$' | wc -l)" -eq 0
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: Independently execute author suite at unchanged implementation cut
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short \
            WORKER_RETURNS/SOROK-P4-FIRST-FULL-MPC-R1/test_response.py \
            WORKER_RETURNS/SOROK-P4-FIRST-FULL-MPC-R1/test_speech.py \
            WORKER_RETURNS/SOROK-P5-CONTINUOUS-EXPERIENCE-R1/test_experience.py \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py \
            rawlsing_next/tests/test_render_bounded_expression.py
      - name: Execute independent adversarial probes
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short \
            WORKER_REVIEWS/SOROK-MECHANISM-III-INDEPENDENT-20261109-R1/test_independent_miii.py
