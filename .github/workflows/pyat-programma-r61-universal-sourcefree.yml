name: Pyat Programma R61 finite sourcefree workload
on:
  pull_request:
    paths:
      - 'rawlsing_next/pre553_universal_workload.py'
      - 'rawlsing_next/pre553_issued_workload.py'
      - 'rawlsing_next/pre553_native_workload_binding.py'
      - 'rawlsing_next/pre553_source_native_preimage_adapter.py'
      - 'rawlsing_next/universal_grammar/**'
      - 'rawlsing_next/tests/test_universal_*.py'
      - '.github/workflows/pyat-programma-r61-universal-sourcefree.yml'
permissions:
  contents: read
jobs:
  universal-sourcefree:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pandas pyreadstat pyarrow duckdb
      - name: Recovered R61 automatic frontier/issuer/native binding and fault tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest rawlsing_next/tests/test_universal_grammar.py rawlsing_next/tests/test_universal_workload.py rawlsing_next/tests/test_universal_source_projection.py rawlsing_next/tests/test_universal_source_byte_custody.py -q -o addopts='' --junitxml=pyat-r61-sourcefree-junit.xml
      - name: Regression — existing physical decoder and C11 metadata contracts
        env:
          PYTHONPATH: .
        run: |
          python -m pytest rawlsing_next/tests/test_r35_i01_physical_metadata.py rawlsing_next/tests/test_pre553_sr06_decoder_carrier.py rawlsing_next/tests/test_fiabc_r35_i03_physical_equivalence.py -q -o addopts='' --junitxml=pyat-r61-existing-decoder-junit.xml
      - name: Real severance — R61 inventory, operation and original byte identity
        env:
          PYTHONPATH: .
        run: |
          python CROSS_HQ_CONTROL_ROOM/proof_integrity_gate_r1.py witness rawlsing_next/tests/test_universal_grammar.py.proof.json --root .
          python CROSS_HQ_CONTROL_ROOM/proof_integrity_gate_r1.py witness rawlsing_next/tests/test_universal_workload.py.proof.json --root .
          python CROSS_HQ_CONTROL_ROOM/proof_integrity_gate_r1.py witness rawlsing_next/tests/test_universal_source_projection.py.proof.json --root .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyat-r61-sourcefree-tests
          path: |
            pyat-r61-sourcefree-junit.xml
            pyat-r61-existing-decoder-junit.xml
          if-no-files-found: ignore
