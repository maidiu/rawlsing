name: Z02 fracture-map integration tests

on:
  push:
    branches:
      - agent/verkhovod-z02-fracturemap-integration-r1

permissions:
  contents: read

jobs:
  z02-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Authority-40 mandated Z02 regression surface
        run: >-
          python -m pytest -q
          rawlsing_next/tests/test_pre553_empirical_objects_authority.py
          rawlsing_next/tests/test_pre553_empirical_query.py
          rawlsing_next/tests/test_pre553_discovery_exact.py
          rawlsing_next/tests/test_pre553_recursive_handoff.py
          rawlsing_next/tests/test_pre553_fracture_map_contract.py
          rawlsing_next/tests/test_pre553_fracture_map_controller.py
          rawlsing_next/tests/test_pre553_cosignature_composition.py
          rawlsing_next/tests/test_pre553_replay_audit.py
          rawlsing_next/tests/test_pre553_query_frontier_hostile.py
          rawlsing_next/tests/test_pre553_fracture_map_integration.py
