name: PYAT-SPASITYEL joined FF01 GT12-D R112 sourcefree first-consumer court
on:
  push:
    branches:
      - agent/pyat-spasityel-joined-first-consumer-proof-20261121-r1
permissions:
  contents: read
jobs:
  combined-current-owners:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped sourcefree test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy pandas pyarrow pyreadstat
      - name: Fetch only pinned S3-A differential historical source heads
        run: |
          git fetch --no-tags --depth=1 origin \
            265526a69c3a7a52365cf908709a4ef85ef9092e \
            bcb3d5d913ac345d5adf7a9e45ca6d2eac9fb981 \
            40529f300a3f655210f03d82532cb1e8b9b7c76c \
            59f1f69f894c1cac982e7385587b097d83235d37 \
            16a347ce308345b7d0c18b8f81b9af15b754d2b6
      - name: Execute same SHA joined selected first-consumer and existing negatives
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .spasityel-joined-proof
          python -m pytest -q -o addopts='' \
            --junitxml=.spasityel-joined-proof/junit.xml \
            rawlsing_next/tests/test_spasityel_joined_s3a_first_consumer.py \
            rawlsing_next/tests/test_field_forge_conditional_support.py \
            rawlsing_next/tests/test_gt12_closure_b_c_to_d_bridge.py \
            rawlsing_next/tests/test_gt12_e2b_actual_object_consumer_harness.py \
            rawlsing_next/tests/test_hqr_s3a_exact_query_fact_closure.py \
            rawlsing_next/tests/test_s3a_followupper_query_authority_closure.py \
            rawlsing_next/tests/test_s3a_r4_partial_resolution_and_measure_closure.py \
            rawlsing_next/tests/test_s3a_r5_denominator_membership_closure.py \
            rawlsing_next/tests/test_s3a_round3_positive_zero_support.py \
            rawlsing_next/tests/test_kuda076_e05_selected_world_guard.py \
            rawlsing_next/tests/test_world_conditioned_progressive_service.py
      - name: Retain exact-head JUnit even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spasityel-joined-sourcefree-junit
          path: .spasityel-joined-proof/
          include-hidden-files: true
          if-no-files-found: warn
