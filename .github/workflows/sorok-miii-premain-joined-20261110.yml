name: SOROK MIII PRE-MAIN joined sourcefree receiving court
on:
  push:
    branches:
      - review/sorok-miii-premain-receiving-20261110-r1
      - integration/pre-main-reconciliation-r1
    paths:
      - 'WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/**'
      - 'WORKER_RETURNS/SOROK-P5-CONTINUOUS-EXPERIENCE-R1/pacing.py'
      - 'WORKER_RETURNS/SOROK-20261105-S45-S47-PRODUCT-IMPORT-CLOSURE-R1/product/vendor/WORKER_RETURNS/SOROK-20261022-SAME-PERSON-JOIN-R1/vendor/j/candidate/vendor/bp4/bp4/world.py'
      - '.github/workflows/sorok-miii-premain-joined-20261110.yml'
  pull_request:
    branches:
      - integration/pre-main-reconciliation-r1
    paths:
      - 'WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/**'
      - 'WORKER_RETURNS/SOROK-P5-CONTINUOUS-EXPERIENCE-R1/pacing.py'
      - '.github/workflows/sorok-miii-premain-joined-20261110.yml'
permissions:
  contents: read
jobs:
  miii-joined:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Execute P6 scene, initiative, hostile and inherited courts
        run: |
          python -B -m pytest -x -q -p no:cacheprovider --tb=short \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_actor_scene_context.py \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_actor_initiative.py \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_actor_initiative_hostile.py \
            WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py
