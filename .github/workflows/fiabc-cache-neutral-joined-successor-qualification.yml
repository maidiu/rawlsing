name: FIABC Cache-Neutral Joined Successor Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-darwin-x86-cache-neutral:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      FIABC_REQUIRE_EXACT_DARWIN_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.3"
          architecture: x64

      - name: Install exact protected runtime
        run: |
          python -m pip install --disable-pip-version-check \
            pytest \
            pyreadstat==1.3.6 \
            pyarrow==25.0.1 \
            pandas==2.3.1 \
            numpy==2.3.2

      - name: Record exact runtime identity
        run: |
          python - <<'PY' | tee qualification-runtime.txt
          import importlib.metadata, json, platform, sys
          doc = {
              "implementation": platform.python_implementation(),
              "python": platform.python_version(),
              "system": platform.system(),
              "machine": platform.machine(),
              "pyreadstat": importlib.metadata.version("pyreadstat"),
              "pyarrow": importlib.metadata.version("pyarrow"),
              "pandas": importlib.metadata.version("pandas"),
              "numpy": importlib.metadata.version("numpy"),
              "raw_source_open_attempts": 0,
              "raw_source_hash_attempts": 0,
              "decoder_calls": 0,
              "candidate_process_launch_attempts": 0,
              "candidate_outputs_read": 0,
              "measured_p2x_executions": 0,
          }
          print(json.dumps(doc, sort_keys=True, indent=2))
          PY

      - name: Launcher syntax
        run: bash -n HQ_HANDOFF/launchers/RUN_DISPOSITIVE_FIABC_SIX_CELL.sh

      - name: Exact source-free successor and regression court
        run: |
          set -o pipefail
          python -m pytest -q \
            rawlsing_next/tests/test_fiabc_cache_neutral_joined_successor.py \
            rawlsing_next/tests/test_fiabc_t5_joined_failure_semantics_repair.py \
            rawlsing_next/tests/test_fiabc_t5_live_terminal_control.py \
            rawlsing_next/tests/test_fiabc_t4_live_accounting.py \
            rawlsing_next/tests/test_fiabc_t3_oracle_process_envelope.py \
            rawlsing_next/tests/test_ee_p2x_local_court_driver_integration.py \
            rawlsing_next/tests/test_fiabc_succession_preflight.py \
            rawlsing_next/tests/test_fiabc_p2_terminal_verifier.py \
            rawlsing_next/tests/test_fiabc_t2_six_cell_execution_binding.py \
            2>&1 | tee qualification-tests.txt

      - name: Emit evidence digests
        run: |
          shasum -a 256 qualification-runtime.txt qualification-tests.txt | tee qualification-digests.txt

      - name: Upload source-free qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiabc-cache-neutral-joined-successor-${{ github.run_id }}
          path: |
            qualification-runtime.txt
            qualification-tests.txt
            qualification-digests.txt
          if-no-files-found: error
