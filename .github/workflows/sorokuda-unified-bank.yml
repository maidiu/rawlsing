name: SOROKUDA normalized ideas and code bank
on:
  push:
    paths:
      - 'SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_CODE_INDEX.jsonl'
      - 'SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_BANK/**'
      - '.github/workflows/sorokuda-unified-bank.yml'
  workflow_dispatch:
jobs:
  exact-source-bank:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify immutable source pins and reproducible normalized bank
        run: node SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_BANK/bank_cli.mjs check
      - name: Run hostile source no-drop, date and semantic-boundary tests
        run: node --test SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_BANK/test_bank.mjs
      - name: Exercise reciprocal NEIGHBOR and SORACLE source-before-build gate
        shell: bash
        run: |
          node SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_BANK/bank_cli.mjs gate-new "mistaken Other" > /tmp/sorokuda-r30-reuse.json
          grep -q 'NO_BUILD_RIGHT_ISSUED' /tmp/sorokuda-r30-reuse.json
          grep -q 'SOROKUDA-R11-R30-OWNER' /tmp/sorokuda-r30-reuse.json
          node SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_BANK/bank_cli.mjs gate-new "Same SES" > /tmp/sorokuda-r9-reuse.json
          grep -q 'NEIGHBOR-R9-01' /tmp/sorokuda-r9-reuse.json
          node SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/SOROKUDA_BANK/bank_cli.mjs check
