name: Independent SOROK MIII Grade A exact-head court
on:
  push:
    branches:
      - review/sorok-miii-grade-a-independent-20261110-r1
  pull_request:
    branches:
      - agent/sorok-miii-situated-encounter-20261109-r1

permissions:
  contents: read

jobs:
  grade-a-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout review descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Prove frozen author base and reviewer-only changes
        run: |
          git merge-base --is-ancestor a292fa82957f8d6ad3b88dec611fcc1975658921 HEAD
          git diff --name-only a292fa82957f8d6ad3b88dec611fcc1975658921 HEAD
          unexpected="$(git diff --name-only a292fa82957f8d6ad3b88dec611fcc1975658921 HEAD | grep -Ev '^WORKER_REVIEWS/SOROK-MIII-GRADE-A-INDEPENDENT-20261110-R1/|^[.]github/workflows/review-sorok-miii-grade-a-20261110[.]yml || true)"
          test -z "$unexpected" || { echo "Reviewer changed implementation: $unexpected"; exit 1; }
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run original candidate P6 regression
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py
      - name: Independently probe sensory source, identity, and non-registration
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_REVIEWS/SOROK-MIII-GRADE-A-INDEPENDENT-20261110-R1/test_independent_grade_a.py
 || true)"
          test -z "$unexpected" || { echo "Reviewer changed implementation: $unexpected"; exit 1; }
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run original candidate P6 regression
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py
      - name: Independently probe sensory source, identity, and non-registration
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_REVIEWS/SOROK-MIII-GRADE-A-INDEPENDENT-20261110-R1/test_independent_grade_a.py
