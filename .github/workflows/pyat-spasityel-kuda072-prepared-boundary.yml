name: PYAT SPASITYEL KUDA072 prepared exact estate receipt boundary court
on:
  push:
    branches:
      - agent/pyat-spasityel-kuda072-prepared-boundary-repair-20261121-r1
permissions:
  contents: read
jobs:
  prepared:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install sourcefree native saved C11 requirements
        run: python -m pip install --disable-pip-version-check pytest numpy pandas pyarrow pyreadstat
      - name: Exact original owner and new A/B hostile counterexample
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .kuda072-sourcefree-proof
          python -m pytest -q -o addopts='' \
            --junitxml=.kuda072-sourcefree-proof/junit.xml \
            rawlsing_next/tests/test_kuda072_prepared_estate_pin.py \
            rawlsing_next/tests/test_pre553_prepared_saved_i03.py \
            rawlsing_next/tests/test_pre553_distinct_cold_i03_batch.py \
            rawlsing_next/tests/test_pyat997_r03_governed_query_issuer_v2.py
      - name: Preserve first-reader JUnit, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuda072-prepared-ab-junit
          path: .kuda072-sourcefree-proof/
          include-hidden-files: true
          if-no-files-found: warn
