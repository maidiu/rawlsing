name: PYAT C3-03 Physical Repair Source-Free Qualification

on:
  push:
    branches:
      - agent/rabochii-pyat-hq126-c3-03-physical-repair-correction-r1

permissions:
  contents: read

jobs:
  source-free-court:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provision pinned court dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 pandas==2.3.3

      - name: Record execution environment identity
        shell: bash
        run: |
          mkdir -p .rabochii
          python -m pip freeze --all | LC_ALL=C sort > .rabochii/c3_03_pip_freeze.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          import pandas
          import pytest

          freeze_path = Path(".rabochii/c3_03_pip_freeze.txt")
          freeze_bytes = freeze_path.read_bytes()
          evidence = {
              "schema_id": "PYAT_C3_03_EXECUTION_ENVIRONMENT@1.0.0",
              "execution_sha": os.environ["GITHUB_SHA"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "runner_arch": os.environ.get("RUNNER_ARCH"),
              "python": platform.python_version(),
              "implementation": platform.python_implementation(),
              "pytest": pytest.__version__,
              "pandas": pandas.__version__,
              "pip": subprocess.check_output(
                  [sys.executable, "-m", "pip", "--version"], text=True
              ).strip(),
              "direct_dependency_pins": {
                  "pytest": "9.1.1",
                  "pandas": "2.3.3",
              },
              "pip_freeze_sha256": hashlib.sha256(freeze_bytes).hexdigest(),
              "pip_freeze_path": str(freeze_path),
          }
          Path(".rabochii/c3_03_environment_identity.json").write_text(
              json.dumps(evidence, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, sort_keys=True, indent=2))
          PY

      - name: Protocol self-test
        run: >-
          python -m pytest -q
          rawlsing_next/tests/test_rabochii_execution_protocol.py
          rawlsing_next/tests/test_rabochii_bounded_court.py

      - name: Validate bounded court spec
        run: python -m rawlsing_next.rabochii_execution_protocol court .rabochii/court_spec.json

      - name: Execute exact six-file bounded court
        env:
          RABOCHII_EVIDENCE_EXECUTION_SHA: ${{ github.sha }}
          RABOCHII_PR_SYNTHETIC_SHA: ""
        run: >-
          python -m rawlsing_next.rabochii_bounded_court
          .rabochii/court_spec.json
          --receipt .rabochii/court_receipt.json

      - name: Upload governed court receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pyat-c3-03-court-receipt-${{ github.run_id }}
          path: .rabochii/court_receipt.json
          if-no-files-found: warn

      - name: Upload environment identity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pyat-c3-03-environment-${{ github.run_id }}
          path: |
            .rabochii/c3_03_environment_identity.json
            .rabochii/c3_03_pip_freeze.txt
          if-no-files-found: error
