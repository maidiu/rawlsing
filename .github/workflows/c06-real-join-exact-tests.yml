name: C06 real join exact compiler tests

on:
  push:
    branches:
      - agent/rabochii-c06-real-routing-join-r1

permissions:
  contents: read

jobs:
  c06-exact-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run exact admitted C06 tests
        run: python -m pytest -q rawlsing_next/tests/test_current_routing_ledger.py
      - name: Reconstruct exact frozen C03 carrier and execute C06 schema admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          from rawlsing_next.current_routing_ledger import read_family_ledger, RoutingLedgerError

          commit = "cbaa97ac11c4e8d517b49663f2037f8ea0e04267"
          root = "data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/CURRENT_ROUTING_AND_V550J_CARRIER_WAVE_R1/C03_ROUTING_WVS_EVS"
          def show(path: str) -> bytes:
              return subprocess.check_output(["git", "show", f"{commit}:{root}/{path}"])
          def sha(payload: bytes) -> str:
              return hashlib.sha256(payload).hexdigest()

          manifest = json.loads(show("02_LEDGER_MANIFEST.json").decode("utf-8"))
          parts = []
          hash_basis = set()
          for spec in manifest["ordered_chunks"]:
              raw = show(spec["path"])
              payload = raw[:-1] if raw.endswith(b"\n") else raw
              if len(payload) != spec["chars_without_terminal_lf"]:
                  raise SystemExit(f"chunk length mismatch {spec['path']}: {len(payload)} != {spec['chars_without_terminal_lf']}")
              if sha(raw) == spec["sha256"]:
                  hash_basis.add("RAW_FILE_BYTES")
              elif sha(payload) == spec["sha256"]:
                  hash_basis.add("BYTES_WITHOUT_TERMINAL_LF")
              else:
                  raise SystemExit(f"chunk hash mismatch {spec['path']}: raw={sha(raw)} payload={sha(payload)} expected={spec['sha256']}")
              parts.append(payload)
          encoded = b"".join(parts)
          if len(encoded) != manifest["base64_chars"]:
              raise SystemExit(f"base64 char count mismatch {len(encoded)} != {manifest['base64_chars']}")
          compressed = base64.b64decode(encoded)
          if len(compressed) != manifest["xz_bytes"] or sha(compressed) != manifest["xz_sha256"]:
              raise SystemExit("XZ transport identity mismatch")
          canonical = lzma.decompress(compressed)
          if len(canonical) != manifest["canonical_bytes"] or sha(canonical) != manifest["canonical_sha256"]:
              raise SystemExit("canonical C03 identity mismatch")
          out = Path("/tmp/C03_CURRENT_ROUTING_APPLICABILITY_LEDGER.csv")
          out.write_bytes(canonical)
          header = canonical.splitlines()[0].decode("utf-8-sig")
          print("C03_CHUNK_HASH_BASIS", ",".join(sorted(hash_basis)))
          print("C03_RECONSTRUCTION_PASS", manifest["canonical_rows"], manifest["canonical_bytes"], manifest["canonical_sha256"])
          print("C03_HEADER", header)
          try:
              read_family_ledger(out)
          except RoutingLedgerError as exc:
              print("C03_C06_SCHEMA_ADMISSION_BLOCKED_AS_EXECUTED", str(exc))
          else:
              raise SystemExit("unexpected: C03 carrier admitted directly to C06 schema")
          PY
