name: B20Q3 transient full Route-C qualification

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-route-c-cacc1-cacc2-parity-qualification-q3-r1

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution vehicle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact B20Q3 tree run 1
        uses: actions/checkout@v4
        with:
          ref: e7007ff50d1e8577f522d8691486f55c3679dbcb
          path: run1
          fetch-depth: 0

      - name: Checkout exact B20Q3 tree run 2
        uses: actions/checkout@v4
        with:
          ref: e7007ff50d1e8577f522d8691486f55c3679dbcb
          path: run2
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate exact qualification environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas pytest

      - name: Execute complete Route-C court twice
        shell: bash
        run: |
          set -u -o pipefail
          OUT="$RUNNER_TEMP/b20q3"
          mkdir -p "$OUT"
          DRIVER='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1/WORKERS/B20_AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_R1/01_ROUTE_C_IMPLEMENTATION_QUALIFICATION.py'
          IMPL='rawlsing_next/pre553_route_c_accelerators.py'
          EXPECT_DRIVER_BLOB='9ed1a68300453bfcd4af4877bab397ed00b0e0e6'
          EXPECT_DRIVER_SHA='497a9cb64fa4a1a57a3bf2ec6882aaf5fd996ea6408e7c7bbaf272fe534321ee'
          EXPECT_IMPL_BLOB='abfdc91a71ef5e18c4a8a6bf62fa65750d8d9889'
          EXPECT_IMPL_SHA='a07e73c514c6216c350ac7a69cb099256cf71680a49fe0796aac6729483b417d'

          python - <<'PY' > "$OUT/environment.json"
          import json, platform, sys, pandas, pyarrow
          print(json.dumps({
            "python_version":sys.version,
            "python_implementation":platform.python_implementation(),
            "pyarrow_version":pyarrow.__version__,
            "pandas_version":pandas.__version__,
          },sort_keys=True,separators=(",",":")))
          if pyarrow.__version__ != "25.0.1":
              raise SystemExit("wrong pyarrow")
          PY

          run_one() {
            idx="$1"
            ROOT="$GITHUB_WORKSPACE/run$idx"
            R="$OUT/run$idx"
            mkdir -p "$R"
            cd "$ROOT"

            git rev-parse HEAD > "$R/head.txt"
            git status --porcelain=v1 > "$R/pre_git_status.txt"
            git status --porcelain=v1 --untracked-files=all > "$R/pre_git_status_all.txt"

            git hash-object "$DRIVER" > "$R/driver_blob.txt"
            git hash-object "$IMPL" > "$R/implementation_blob.txt"
            sha256sum "$DRIVER" | awk '{print $1}' > "$R/driver_sha256.txt"
            sha256sum "$IMPL" | awk '{print $1}' > "$R/implementation_sha256.txt"

            test "$(cat "$R/head.txt")" = "e7007ff50d1e8577f522d8691486f55c3679dbcb" || return 91
            test "$(cat "$R/driver_blob.txt")" = "$EXPECT_DRIVER_BLOB" || return 92
            test "$(cat "$R/implementation_blob.txt")" = "$EXPECT_IMPL_BLOB" || return 93
            test "$(cat "$R/driver_sha256.txt")" = "$EXPECT_DRIVER_SHA" || return 94
            test "$(cat "$R/implementation_sha256.txt")" = "$EXPECT_IMPL_SHA" || return 95
            test ! -s "$R/pre_git_status_all.txt" || return 96

            mkdir -p "$R/tmp" "$R/pycache"
            export TMPDIR="$R/tmp"
            export PYTHONPYCACHEPREFIX="$R/pycache"
            export PYTHONHASHSEED=0

            PYTHONPATH="$ROOT" python "$DRIVER" --output "$R/qualification_receipt.json" >"$R/stdout.txt" 2>"$R/stderr.txt"
            ec=$?
            printf '%s\n' "$ec" > "$R/exit_code.txt"
            sha256sum "$R/stdout.txt" | awk '{print $1}' > "$R/stdout_sha256.txt"
            sha256sum "$R/stderr.txt" | awk '{print $1}' > "$R/stderr_sha256.txt"
            if [ -f "$R/qualification_receipt.json" ]; then
              sha256sum "$R/qualification_receipt.json" | awk '{print $1}' > "$R/qualification_receipt_sha256.txt"
            else
              printf 'NOT_EMITTED\n' > "$R/qualification_receipt_sha256.txt"
            fi
            git status --porcelain=v1 --untracked-files=all > "$R/post_git_status_all.txt"
            return "$ec"
          }

          set +e
          run_one 1
          EC1=$?
          run_one 2
          EC2=$?
          set -e
          printf '%s\n' "$EC1" > "$OUT/run1_exit_code.txt"
          printf '%s\n' "$EC2" > "$OUT/run2_exit_code.txt"

          python - "$OUT" <<'PY'
          import hashlib, json, pathlib, sys
          out=pathlib.Path(sys.argv[1])
          def read(p):
              return (out/p).read_text(encoding="utf-8").strip()
          summary={
            "schema":"B20Q3_OUTER_EXECUTION_SUMMARY@1.0.0",
            "run1_exit":int(read("run1_exit_code.txt")),
            "run2_exit":int(read("run2_exit_code.txt")),
            "run1_receipt_sha256":read("run1/qualification_receipt_sha256.txt"),
            "run2_receipt_sha256":read("run2/qualification_receipt_sha256.txt"),
            "run1_stdout_sha256":read("run1/stdout_sha256.txt"),
            "run2_stdout_sha256":read("run2/stdout_sha256.txt"),
            "run1_stderr_sha256":read("run1/stderr_sha256.txt"),
            "run2_stderr_sha256":read("run2/stderr_sha256.txt"),
          }
          if (out/"run1/qualification_receipt.json").exists():
              summary["run1_receipt"]=json.loads((out/"run1/qualification_receipt.json").read_text())
          if (out/"run2/qualification_receipt.json").exists():
              summary["run2_receipt"]=json.loads((out/"run2/qualification_receipt.json").read_text())
          (out/"outer_summary.json").write_text(json.dumps(summary,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          sha256sum "$OUT/outer_summary.json" | awk '{print $1}' > "$OUT/outer_summary_sha256.txt"

          if [ "$EC1" -ne 0 ] || [ "$EC2" -ne 0 ]; then
            exit 1
          fi

      - name: Upload B20Q3 qualification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20q3-full-route-c-qualification
          path: ${{ runner.temp }}/b20q3
          if-no-files-found: error
