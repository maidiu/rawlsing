name: SOROK MIII actor initiative / continuity bounded court
on:
  push:
    branches:
      - agent/sorok-miii-actor-initiative-continuity-20261110-r1

permissions:
  contents: read

jobs:
  actor-initiative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact successor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Verify immutable MIII R1 base and narrow changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 339c872612aff9aa34f7133a2170108bcde385f6 HEAD
          git diff --name-only 339c872612aff9aa34f7133a2170108bcde385f6 HEAD
          unexpected="$(git diff --name-only 339c872612aff9aa34f7133a2170108bcde385f6 HEAD | grep -Ev '^WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/(actor_initiative[.]py|situated[.]py|outward[.]py|run_p6[.]py|test_actor_initiative[.]py|test_actor_initiative_hostile[.]py|actor_scene_context[.]py|situated_provider[.]py|test_actor_scene_context[.]py|test_house[.]py)$|^WORKER_RETURNS/SOROK-P5-CONTINUOUS-EXPERIENCE-R1/pacing[.]py$|^[.]github/workflows/sorok-miii-(actor-initiative|actor-context)-20261110[.]yml$' || true)"
          test -z "$unexpected" || { echo "Unexpected modified path: $unexpected"; exit 1; }
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Execute hostile writer, perception, silence and crash courts
        run: |
          python -B -m pytest -x -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_actor_initiative_hostile.py
      - name: Exercise cumulative-time and actor initiative first consumer
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_actor_initiative.py
      - name: Regression for existing sourcefree situated input / action
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py::test_silent_interval_reconsiders_and_commits_only_admitted_speech WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py::test_perception_claim_requires_exact_cue_and_channel

  house-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repaired MIII candidate
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run complete inherited P6 situated and world regression
        run: |
          python -B -m pytest -q -p no:cacheprovider --tb=short WORKER_RETURNS/SOROK-P6-ONE-LIVING-HOUSE-R1/test_house.py
