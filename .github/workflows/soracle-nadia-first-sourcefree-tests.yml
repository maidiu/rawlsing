name: SORACLE — Nadia-first constitutive-genesis sourcefree court
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SEAM/ORACLE/UM_SOROK_ORGANISM_R3/**'
      - 'SEAM/ORACLE/00_NADIA_FIRST_CONSTRUCTION_PRIORITY_20261120.md'
      - 'REMONT/SOROK/INBOX/20261120_SORACLE_NADIA_FIRST_P004_P011_P014_P015_P023_INTAKE.md'
      - '.github/workflows/soracle-nadia-first-sourcefree-tests.yml'
permissions:
  contents: read
jobs:
  nadia-developmental-first-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all organism modules
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m compileall -q um_sorok_organism
      - name: New developmental-genesis first consumers
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_nadia_psychic_genesis_p004_p011_p023
          python -O -m unittest -v tests.test_nadia_psychic_genesis_p004_p011_p023
      - name: New conditional joint practice and Other independence
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_conditional_joint_practice_p015
          python -O -m unittest -v tests.test_conditional_joint_practice_p015
      - name: R2 parent psyche, end-genesis and bound caregiver court
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_nadia_backlog_mulch_r2
          python -O -m unittest -v tests.test_nadia_backlog_mulch_r2
      - name: R2 costly parent commitment, real first consumer
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_care_commitment_genesis_r2
          python -O -m unittest -v tests.test_care_commitment_genesis_r2
      - name: R2 actual divergent continuing Nadias
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_nadia_longitudinal_backlog_r2
          python -O -m unittest -v tests.test_nadia_longitudinal_backlog_r2
      - name: R3 actual public material-object cultural mediation
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_cultural_mediation_r3
          python -O -m unittest -v tests.test_cultural_mediation_r3
      - name: R3 social vocal coordination and bodily maturation
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: |
          python -m unittest -v tests.test_social_vocal_development_r3
          python -O -m unittest -v tests.test_social_vocal_development_r3
      - name: Original inherited organism suite
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -m unittest discover -s tests -v
      - name: Original inherited optimized suite
        working-directory: SEAM/ORACLE/UM_SOROK_ORGANISM_R3
        run: python -O -m unittest discover -s tests -v
