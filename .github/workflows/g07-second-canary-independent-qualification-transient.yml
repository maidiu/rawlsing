name: G07 second-canary independent qualification

on:
  push:
    branches:
      - agent/rabochii-prev3-w5-g07-second-canary-independent-qual-r1

permissions:
  contents: write

jobs:
  g07-independent-court:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RET: data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_FOURTH_WAVE_FANIN_AND_FIFTH_WAVE_DISPATCH_R1/FIFTH_WAVE_WORKER_RETURNS/G07
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install court dependencies
        run: python -m pip install pytest pandas pyarrow duckdb pyreadstat
      - name: Verify exact commission, F07 candidate, and frozen authority identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0266f148cf4ace3f68065f7eb57f1524281fa3d2 HEAD
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_FOURTH_WAVE_FANIN_AND_FIFTH_WAVE_DISPATCH_R1/WORKER_COMMISSIONS/G07/00_COMMISSION.md)" = "74451c7b38e6f9865171d447e0e4a79dfc6dc907"
          test "$(git hash-object rawlsing_next/f07_second_canary_prev3_admission.py)" = "06c312209148ab5bdd2c2077f3c887bdc9f948c8"
          test "$(git hash-object rawlsing_next/tests/test_f07_second_canary_prev3_admission.py)" = "7772e9cd4726e6b513a2e2a809ecb9f02ea30f28"
          test "$(git hash-object rawlsing_next/wave1_ff_prev3_relation_admission.py)" = "c5fb675fd6f95cb7dc9e0ad505224803839cc645"
          test "$(git hash-object rawlsing_next/m1_admitted_field_forge_relation_v554_ingress.py)" = "0aeacd9e66c7e4340b36e1b622bb5c9bf2865fd5"
          test "$(git hash-object rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py)" = "09e38c324a4f6711709255c6d8d7da3ba75cf04f"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/FOURTH_WAVE_WORKER_RETURNS/F07/00_RETURN.md)" = "c07c88ac182646ec5f9633e0ccd5562a8ceb7293"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/FOURTH_WAVE_WORKER_RETURNS/F07/01_SECOND_CANARY_ADMISSION_RECEIPT.json)" = "fe3f776dd0c07dae67f2e41373368961fa55bb0c"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/FOURTH_WAVE_WORKER_RETURNS/F07/02_M1_V554_INGRESS_AND_REPLAY_RECEIPT.json)" = "a975dd774a22e9d1a2f9e1378c10fa6533280df3"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_THIRD_WAVE_FANIN_AND_FOURTH_WAVE_DISPATCH_R1/FOURTH_WAVE_WORKER_RETURNS/F07/03_HOSTILE_TYPED_STATE_PRESERVATION_RESULTS.json)" = "d62897b7d1436bc65b7ca7810c764a0f0581153e"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_SECOND_WAVE_FANIN_AND_THIRD_WAVE_DISPATCH_R1/THIRD_WAVE_WORKER_RETURNS/E10/01_SECOND_CANARY_RELATION_ADMISSION_AUTHORITY.json)" = "48168c4ed96ab34c906db74cf96054e765f57d7a"
          test "$(git hash-object data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/ASTRA_PREV3_COMPLETION_AUDIT_R1/HQ_SECOND_WAVE_FANIN_AND_THIRD_WAVE_DISPATCH_R1/THIRD_WAVE_WORKER_RETURNS/E10/02_PERMISSION_NEGATIVE_STATE_REPLAY_LEDGER.json)" = "69719830dbff2f752a373ab961bf6e05d05edd2d"
          test "$(git hash-object "$RET/01_INDEPENDENT_QUALIFICATION_PROBE.py")" = "4346cc53e5876cac7c4c7cd4ec98d364faedc013"
      - name: Run fresh independent G07 qualification probe
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. G07_RESULTS_PATH="$RET/02_INDEPENDENT_QUALIFICATION_RESULTS.json" python "$RET/01_INDEPENDENT_QUALIFICATION_PROBE.py"
      - name: Run frozen F07 candidate court
        run: python -m pytest -q -p no:cacheprovider rawlsing_next/tests/test_f07_second_canary_prev3_admission.py
      - name: Run exact parent admission and M1 regression court
        run: |
          python -m pytest -q -p no:cacheprovider \
            --deselect rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py::test_m4_binding_accepts_exact_relation_contract_and_keeps_v554_producer_family \
            rawlsing_next/tests/test_f07_second_canary_prev3_admission.py \
            rawlsing_next/tests/test_wave1_ff_prev3_relation_admission.py \
            rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py
      - name: Prove inherited out-of-grain M4 regression remains separate
        shell: bash
        run: |
          set -euo pipefail
          TEST='rawlsing_next/tests/test_m1_admitted_field_forge_relation_v554_ingress.py::test_m4_binding_accepts_exact_relation_contract_and_keeps_v554_producer_family'
          git worktree add --detach /tmp/g07-commission 0266f148cf4ace3f68065f7eb57f1524281fa3d2
          set +e
          (cd /tmp/g07-commission && python -m pytest -q -p no:cacheprovider "$TEST") > /tmp/g07-commission-m4.log 2>&1
          base_rc=$?
          python -m pytest -q -p no:cacheprovider "$TEST" > /tmp/g07-current-m4.log 2>&1
          current_rc=$?
          set -e
          printf '%s\n' '--- G07 commission-tip inherited result ---'
          cat /tmp/g07-commission-m4.log
          printf '%s\n' '--- current-head inherited result ---'
          cat /tmp/g07-current-m4.log
          test "$base_rc" -ne 0
          test "$current_rc" -ne 0
          printf 'inherited_out_of_grain_m4_test=CONFIRMED_SEPARATE\n'
      - name: Commit independent results and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/g07-second-canary-independent-qualification-transient.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/g07-second-canary-independent-qualification-transient.yml "$RET/02_INDEPENDENT_QUALIFICATION_RESULTS.json"
          git diff --cached --check
          git commit -m "G07: record independent second-canary qualification results"
          git push origin HEAD:agent/rabochii-prev3-w5-g07-second-canary-independent-qual-r1
