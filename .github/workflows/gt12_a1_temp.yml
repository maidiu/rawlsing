name: GT12 A1 temporary regression
on:
  push:
    branches:
      - agent/rabochii-gt12-closure-a1-real-c11-scale-r1
jobs:
  c11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q rawlsing_next
      - run: pytest -q rawlsing_next/tests/test_wave1_r5_q86_c11_projection.py rawlsing_next/tests/test_pre553_source_backed_c11_facade.py
