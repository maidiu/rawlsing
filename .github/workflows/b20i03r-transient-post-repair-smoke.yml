name: B20I03R transient post-repair smoke

on:
  push:
    branches:
      - agent/rabochii-subv-b-as4i-route-c-i03-qualification-fixture-repair-r1

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact committed B20I03R repair
        uses: actions/checkout@v4
        with:
          ref: 2f087524283ce40ead3ddc24af5b11411fde748e
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instantiate exact smoke environment
        run: python -m pip install --disable-pip-version-check pyarrow==25.0.1 pandas pytest

      - name: Smoke lawful I03 and exact cacheless/accelerated I05 parity
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b20i03r-smoke"
          mkdir -p "$OUT"
          DRIVER='data/ddm_build_copy/recovery_integration/semantic_relation_R1_through_Job3/R1_20260825/PRE_MAIN_RECONCILIATION_R1/WHOLE_SPINE_BUILD_CONSTITUTION_R1/RAWLSING_BUILD_WAR_PLAN_R1/CENTRAL_SYNTHESIS_R1/SUB_VOZHD_CAMPAIGN_INTEGRATION_R1/B_ARCHITECTURE_COMPILER_DVA_CHETIRI_R1/WORKERS/B20_AS4I_ROUTE_C_CACC1_CACC2_PARITY_ADAPTER_R1/01_ROUTE_C_IMPLEMENTATION_QUALIFICATION.py'

          python - <<'PY' > "$OUT/environment.json"
          import json, platform, sys, pandas, pyarrow
          print(json.dumps({
              "python_version": sys.version,
              "python_implementation": platform.python_implementation(),
              "pyarrow_version": pyarrow.__version__,
              "pandas_version": pandas.__version__,
          },sort_keys=True,separators=(",",":")))
          PY
          git rev-parse HEAD > "$OUT/executed_tree_head.txt"
          git hash-object rawlsing_next/pre553_route_c_accelerators.py > "$OUT/implementation_git_blob.txt"
          git hash-object "$DRIVER" > "$OUT/driver_git_blob.txt"
          sha256sum rawlsing_next/pre553_route_c_accelerators.py | awk '{print $1}' > "$OUT/implementation_sha256.txt"
          sha256sum "$DRIVER" | awk '{print $1}' > "$OUT/driver_sha256.txt"

          PYTHONPATH="$PWD" python - "$PWD/$DRIVER" "$OUT" <<'PY' >"$OUT/stdout.txt" 2>"$OUT/stderr.txt"
          import importlib.util, json, pathlib, sys, tempfile

          driver=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          spec=importlib.util.spec_from_file_location("_b20i03r_repaired_driver",driver)
          if spec is None or spec.loader is None:
              raise RuntimeError("cannot load repaired driver")
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)

          import rawlsing_next.pre553_discovery_exact as d

          fx, incidence, stream, projection, determinants = m._route_c_fixture("deterministic")
          cacheless_release = m.build_validated_source_backed_c11_release(incidence, projection)
          source = m._runtime_source(fx, cacheless_release)
          qauth = m._query_authority("b20-route-c-query")
          all_p = m._branch_predicate(source, qauth, tag="b20-all")
          x1 = m._predicate(
              source, qauth,
              m._route_c_response_leaf(source, qauth, "X", 1),
              tag="b20-x1",
          )
          query = m._route_c_query(source, qauth, all_p, ("M",), tag="b20-query")
          registry = m._registry(source, qauth)
          ordinary = m.execute_empirical_query(
              repository=source["repo"], query=query, predicate=all_p,
              authority_registry=registry, release_refs=(cacheless_release.release_ref,),
          )
          if any(f.typed_state=="INTEGRITY_FAILURE" for f in ordinary.facts):
              raise AssertionError("ordinary repaired cacheless query still returns INTEGRITY_FAILURE")
          if not ordinary.facts:
              raise AssertionError("ordinary repaired cacheless query returned no fact")

          dauth = m._d_auth("b20-route-c-discovery")
          operation = "I03-OP-b20-route-c-discovery"
          dquery = m._route_c_query(source, qauth, all_p, ("M",), tag="b20-discovery-template")
          grammar = m._grammar(
              operation=operation,
              atoms=[m._atom("ALL",all_p,"BRANCH"),m._atom("X1",x1,"RESPONSE")],
              templates=[m._qt("M",dquery)],
              rules=[m._rule(
                  "minority","MINORITY_OR_NONMODAL_DEPARTURE","SINGLE_ATOM",
                  atom_ids=("X1",),baseline_atom_id="ALL",query_template_id="M",
                  validation={"kind":"DISTRIBUTION_DIFFERS_FROM_BASELINE"},
              )],
          )
          da = m._discovery_authority(source,grammar,dauth,tag="b20-da")
          dregistry = m._registry(source,qauth,dauth)

          observed_facts=[]
          original=d.execute_empirical_query
          def traced(**kwargs):
              result=original(**kwargs)
              observed_facts.extend(result.facts)
              return result
          d.execute_empirical_query=traced
          cacheless_discovery=d.execute_exact_bounded_discovery(
              repository=source["repo"], discovery_authority=da,
              authority_registry=dregistry, release_refs=(cacheless_release.release_ref,),
              predicate_catalog=(all_p,x1), query_template_catalog=(dquery,),
          )
          if len(cacheless_discovery.receipts)!=1:
              raise AssertionError("expected exactly one cacheless DiscoveryResultReceipt")
          if any(f.typed_state=="INTEGRITY_FAILURE" for f in observed_facts):
              raise AssertionError("cacheless I05 emitted an INTEGRITY_FAILURE I03 fact")

          with tempfile.TemporaryDirectory(prefix="b20i03r-accel-") as td:
              root=pathlib.Path(td)
              paths=m.Cacc1Paths(root/"cacc1.arrow",root/"cacc1.manifest.json")
              c1=m.build_cacc1(stream=stream,projection=projection,determinants=determinants,paths=paths)
              c1read=m.read_cacc1(paths=paths,expected_determinants=determinants)
              c2dir=root/"cacc2"
              c2det=m.Cacc2Determinants(
                  cacc1_determinant_hash=determinants.content_hash,
                  discovery_authority_ref=m.ExactRef(
                      "DiscoveryAuthority@1.0.0",
                      f"urn:test:b20:da:{m._h('b20-da')}",
                      m._h("b20-da"),
                  ),
                  predicate_catalog_hash=m._h("b20-predicate-catalog"),
                  risk_partition_hash=m._h("b20-risk-partition"),
                  production_operation_identity="B20_BOUNDED_GOVERNED_FIXTURE_OPERATION",
                  candidate_frontier_ref=m.ExactRef(
                      "PRE553_I05_EVALUATED_FRONTIER",
                      f"urn:test:b20:frontier:{m._h('b20-frontier')}",
                      m._h("b20-frontier"),
                  ),
              )
              c2=m.build_cacc2(
                  directory=c2dir,cacc1=c1read,determinants=c2det,
                  atom_bindings=m._atom_bindings(all_p,x1),
              )
              c2read=m.read_cacc2(directory=c2dir,expected_determinants=c2det)
              before=len(observed_facts)
              accelerated=m.execute_route_c_exact_bounded_discovery(
                  cacc1=c1read, projection=projection,
                  discovery_authority=da, authority_registry=dregistry,
                  predicate_catalog=(all_p,x1), query_template_catalog=(dquery,),
                  cacc2_directory=c2dir, cacc2_manifest=c2read,
              )
              accelerated_facts=observed_facts[before:]
              if any(f.typed_state=="INTEGRITY_FAILURE" for f in accelerated_facts):
                  raise AssertionError("accelerated I05 emitted an INTEGRITY_FAILURE I03 fact")
              m.assert_exact_discovery_identity_parity(cacheless_discovery,accelerated)

          result={
              "schema":"B20I03R_POST_REPAIR_SMOKE@1.0.0",
              "status":"PASS",
              "executed_tree":"2f087524283ce40ead3ddc24af5b11411fde748e",
              "same_source_backed_fixture_built":True,
              "ordinary_cacheless_query_states":[f.typed_state for f in ordinary.facts],
              "ordinary_cacheless_query_fact_refs":[f.ref.as_dict() for f in ordinary.facts],
              "cacheless_i05_candidate_count":cacheless_discovery.candidate_count,
              "cacheless_i05_receipt_refs":[r.ref.as_dict() for r in cacheless_discovery.receipts],
              "cacheless_i05_receipt_states":[r.typed_state for r in cacheless_discovery.receipts],
              "cacheless_i05_fact_states":[f.typed_state for f in observed_facts[:2]],
              "cacheless_i05_integrity_failure_count":sum(f.typed_state=="INTEGRITY_FAILURE" for f in observed_facts[:2]),
              "accelerated_i05_receipt_refs":[r.ref.as_dict() for r in accelerated.receipts],
              "accelerated_i05_exact_receipt_parity":True,
              "all_observed_i03_integrity_failure_count":sum(f.typed_state=="INTEGRITY_FAILURE" for f in observed_facts),
              "frozen_route_c_implementation_blob":"abfdc91a71ef5e18c4a8a6bf62fa65750d8d9889",
              "scope_ceiling":"B20I03R_SMOKE_ONLY__NOT_B20Q3_QUALIFICATION",
          }
          data=json.dumps(result,sort_keys=True,separators=(",",":"))+"\n"
          (out/"smoke_result.json").write_text(data,encoding="utf-8")
          print(data,end="")
          PY

          sha256sum "$OUT/smoke_result.json" | awk '{print $1}' > "$OUT/smoke_result_sha256.txt"
          sha256sum "$OUT/stdout.txt" | awk '{print $1}' > "$OUT/stdout_sha256.txt"
          sha256sum "$OUT/stderr.txt" | awk '{print $1}' > "$OUT/stderr_sha256.txt"

      - name: Upload B20I03R post-repair smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b20i03r-post-repair-smoke
          path: ${{ runner.temp }}/b20i03r-smoke
          if-no-files-found: error
