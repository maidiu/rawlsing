name: Pyat GF1 candidate sourcefree native-object consumer
on:
  pull_request:
    branches:
      - integration/pre-main-reconciliation-r1
    paths:
      - 'rawlsing_next/_gf1_candidate/**'
      - 'rawlsing_next/tests/test_gf1_pair_candidate_sourcefree.py'
      - 'rawlsing_next/tests/test_gf1_pair_candidate_sourcefree.py.proof.json'
      - '.github/workflows/pyat-gf1-candidate-sourcefree.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sourcefree-native-object-first-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated sourcefree test runner
        run: python -m pip install --disable-pip-version-check pytest pandas==2.3.1 pyreadstat==1.3.2
      - name: Execute non-Q86 native EmpiricalFact to GF1 producer to actual computed consumer
        run: python -m pytest -q rawlsing_next/tests/test_gf1_pair_candidate_sourcefree.py
