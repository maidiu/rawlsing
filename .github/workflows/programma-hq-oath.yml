name: PROGRAMMA HQ OATH first-contact guard

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'PYAT_CONTROL_ROOM/PROGRAMMA_PYAT/00_PROGRAMMA_PYAT.md'
      - 'SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/00_PROGRAMMA_SOROK.md'
      - 'tools/check_hq_oath.py'
      - '.github/workflows/programma-hq-oath.yml'
  push:
    paths:
      - 'AGENTS.md'
      - 'PYAT_CONTROL_ROOM/PROGRAMMA_PYAT/00_PROGRAMMA_PYAT.md'
      - 'SOROK_PRODUCT_CONTROL_ROOM/PROGRAMMA_SOROK/00_PROGRAMMA_SOROK.md'
      - 'tools/check_hq_oath.py'
      - '.github/workflows/programma-hq-oath.yml'

permissions:
  contents: read

jobs:
  verify-first-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/check_hq_oath.py --self-test
