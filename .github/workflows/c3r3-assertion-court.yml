name: C3R3 exact-byte assertion court

on:
  push:
    branches:
      - c3r3-20260826
    paths:
      - ".github/workflows/c3r3-assertion-court.yml"
      - "data/ddm_build_copy/vozhd_trii/20260820_pre553_empirical_compiler_activation/SUBSTRATE_RECONSTRUCTION/C3R3/c3r3_close.py"

permissions:
  contents: write

jobs:
  close-c3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated C3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Recover exact commanded Git objects
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_SHA="aece04ac3fa2e488c6993c6b9c88eda296b2e6b8"
          git fetch --depth=1 origin "$RECOVERY_SHA"
          REF="$RECOVERY_SHA"
          mkdir -p /tmp/c3inputs
          git show "$REF:data/ddm_build_copy/recovery_integration/portable_evidence/G1A_CLOSURE_R1_20260826/03_C3_REGISTER_LINEAGE/REGISTER_A/question_structure_register.csv" > /tmp/c3inputs/register_a.csv
          git show "$REF:data/ddm_build_copy/recovery_integration/portable_evidence/G1A_CLOSURE_R1_20260826/03_C3_REGISTER_LINEAGE/REGISTER_B/question_structure_register.csv" > /tmp/c3inputs/register_b.csv
          git show "$REF:data/ddm_build_copy/recovery_integration/portable_evidence/G1A_CLOSURE_R1_20260826/03_C3_V525B_D62/raw/d62/questions_master_drivers.csv" > /tmp/c3inputs/d62.csv
          git show "$REF:data/ddm_build_copy/recovery_integration/portable_evidence/G1A_CLOSURE_R1_20260826/03_C3_V525B_D62/raw/v525b/questions_master_drivers.csv" > /tmp/c3inputs/v525b.csv

      - name: Install court dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Execute exact-byte C3 court
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/ddm_build_copy/vozhd_trii/20260820_pre553_empirical_compiler_activation/SUBSTRATE_RECONSTRUCTION/C3R3"
          python "$OUT/c3r3_close.py" \
            --a /tmp/c3inputs/register_a.csv \
            --b /tmp/c3inputs/register_b.csv \
            --d62 /tmp/c3inputs/d62.csv \
            --v525b /tmp/c3inputs/v525b.csv \
            --out "$OUT"

      - name: Commit complete C3 closure package
        shell: bash
        run: |
          set -euo pipefail
          OUT="data/ddm_build_copy/vozhd_trii/20260820_pre553_empirical_compiler_activation/SUBSTRATE_RECONSTRUCTION/C3R3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet && exit 0
          git commit -m "C3R3: persist complete assertion-grain closure package"
          git push origin HEAD:c3r3-20260826
