  - Whether older snapshot docs should be updated in place or left as archival references.
  - Whether any additional family-specific waves should be added beyond the ones already listed.

usage_notes:
  - Mark each file entry completed only after its downstream consumers are refreshed.
  - Keep the phase order intact unless a downstream document is explicitly independent.
  - Use this plan as the master tick-box list while the repo is being brought current.
  - If a file is a narrative companion, update it to explain the authoritative artifact, not replace it.
  - If a file is a proxy or snapshot, keep it honest about that status.

acceptance_criteria:
  scope_complete_when:
    - The current live source inventory and source-structure manifests reflect all intended readable files and explicitly exclude EVS TREND.
    - South Asia is included everywhere it should appear, including the source registers, semantic atlas inputs, atlas outputs, and relation proxy layers.
    - Arab Barometer W2, Asian Barometer W5, EVS 1990, EVS 2008, EVS 2017, GSS supported waves, and LiTS supported waves are represented in the relevant registers and summaries.
    - The atlas workbook, atlas JSON, and CSV exports agree with one another and report the correct current family/wave coverage.
    - The question relation registry and downstream cloud summaries are derived from the current semantic/structure layers, not from older snapshot assumptions.
    - The most recent governing pack docs have been refreshed to point at the live current artifacts.
    - Historical pack snapshots remain labeled as historical unless they are still actively used by a current build path.
  final_safety_checks:
    - No document claims measured respondent answers from atlas coverage files alone.
    - No document silently reintroduces EVS TREND into the living scope.
    - No wave is collapsed into another wave merely for convenience.
    - No family-wide rebuild is used where a wave-scoped correction is the safer unit of change.
    - Any proxy or snapshot artifact is clearly identified as such in its own document.
