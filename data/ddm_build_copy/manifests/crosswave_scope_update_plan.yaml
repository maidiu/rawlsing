schema: crosswave_scope_update_plan_v1
status: active
title: Cross-Wave Scope Expansion Update Plan
purpose: >
  Track, in dependency order, every authoritative document and generated artifact
  that must be updated so the repository reflects the current survey set,
  including newly added waves and families, while explicitly excluding EVS TREND.

scope:
  include_families:
    - Afrobarometer
    - Arab Barometer
    - Asian Barometer
    - EVS
    - GSS
    - Latinobarómetro
    - LiTS
    - South Asia
    - WVS
  add_waves_now:
    - Arab Barometer:W2
    - Asian Barometer:W5
    - EVS:1990
    - EVS:2008
    - EVS:2017
    - GSS:all_supported_waves
    - LiTS:all_supported_waves
  exclusions:
    - EVS TREND
  normalization_rules:
    - Keep human-facing labels exactly as source/materialized documents expect.
    - Use canonical internal family keys for matching and generation.
    - Do not force legacy filenames into one numeric wave scheme unless a builder explicitly requires it.

operating_rules:
  - Update upstream inventories and structure registers before touching downstream atlas or pack docs.
  - Treat the live generated artifacts in `data/ddm_build_copy/` and `outputs/` as the current source of truth for newer packs.
  - Preserve historical snapshot packs unless a current build path still consumes them.
  - Update one wave at a time when a wave-specific addition is being introduced.
  - Never reintroduce EVS TREND into atlas or registry scope.

document_profiles:
  source_inventory:
    purpose: >
      Declare what raw files exist, which ones are readable, which canonical
      dataset/wave pair each file belongs to, and which files are excluded.
    authoritative_when: raw-file presence, raw-file readability, canonical file pairing.
    constraints:
      - Do not infer respondent-level measurements here.
      - Do not collapse family aliases into display labels.
      - Keep EVS TREND excluded and explicitly marked as such.
    update_rule: >
      Add or correct files only when the physical source inventory or readability
      truth changes.
  structure_register:
    purpose: >
      Bridge raw source structure into question-level records and demographic
      support fields for every supported family and wave.
    authoritative_when: structural question shape, parent/child layout, demographic support fields.
    constraints:
      - Preserve structural uncertainty rather than overwriting it.
      - Keep "don't know", refusal, and missingness visible.
      - Use canonical family and wave labels consistently across rows.
    update_rule: >
      Rebuild whenever the canonical raw inventory changes or a new wave is added.
  semantic_master:
    purpose: >
      Define the normalized semantic/codebook layer, including content concepts,
      driver inventory, and coverage counts used by the atlas.
    authoritative_when: semantic driver assignment, content concept inventory, codebook lineage.
    constraints:
      - Do not treat semantic rows as respondent measurements.
      - Preserve content and driver gaps rather than silently filling them.
      - Keep human-readable labels stable unless the source codebook naming changes.
    update_rule: >
      Rebuild when new waves or families add semantic material, or when content
      keys/driver mappings are expanded.
  atlas:
    purpose: >
      Summarize the cross-wave driver universe in workbook, JSON, and CSV form.
    authoritative_when: coverage summaries, family/wave summaries, shared/regional glossaries.
    constraints:
      - Atlas rows are lineage and coverage only.
      - Atlas must not be interpreted as measured respondent answers.
      - Exclude EVS TREND from atlas coverage.
    update_rule: >
      Rebuild after the semantic master changes and after every new wave/family
      addition that should appear in the atlas.
  relation_registry:
    purpose: >
      Provide the practical proxy registry that branch-cloud and relation builders
      consume.
    authoritative_when: relation proxy selection, branch-cloud eligibility, wave/source coverage for relation builders.
    constraints:
      - This is a proxy, not the canonical semantic master.
      - Do not hand-edit it to invent new semantic truth.
      - Keep metadata rows out of the relation proxy.
    update_rule: >
      Rebuild after the structure register or semantic master changes, and after
      any wave addition that changes the relation surface.
  fact_store_v542:
    purpose: >
      Populate respondent_fact, respondent_position_fact, response_fact, and
      survey_weight_fact from the live raw cache plus the question/demographic registers.
    authoritative_when: respondent-level population, row counts, load checkpoints.
    constraints:
      - Do not use atlas rows as if they were respondent data.
      - Use the question_structure_register and demographic_field_register as the primary binding authorities.
      - Populate one dataset at a time and report checkpoints.
    update_rule: >
      Rebuild when the supported source inventory or question/demographic registers change.
  pack_snapshots:
    purpose: >
      Preserve historical pack docs and validation snapshots for older build
      sequences that still exist in the repo.
    authoritative_when: historical traceability, older pack contracts, archived build instructions.
    constraints:
      - Do not let a snapshot override live generated artifacts.
      - Update only if the snapshot is still consumed by a current build path.
    update_rule: >
      Mirror live truth only for the pack trees that still govern current build
      paths; otherwise leave as archival history.

wave_handling_rules:
  general:
    - Update a wave in the smallest practical unit that keeps the build path honest.
    - Use the family label exactly as the source and loaders expect it, unless a document explicitly wants a normalized alias.
    - When a wave is added, touch the source inventory, structure register, semantic master inputs, atlas, relation registry, and any pack docs that mention scope.
    - If a wave is already loaded in Postgres but missing derived docs, update the docs without reloading raw data unless the raw cache is wrong.
  family_wave_profiles:
    Afrobarometer:
      waves_in_scope: [R1, R5, R9]
      approach: >
        Treat the family as a completed three-wave lineage; update only if a new
        round is physically added or if an existing round changes in the raw inventory.
      watchouts:
        - Keep round labels in Afrobarometer-specific documents.
    Arab Barometer:
      waves_in_scope: [W1, W2, W5, W8]
      approach: >
        Treat W2 as a first-class family member alongside the already-loaded waves.
        Any W2 addition must flow into the atlas, relation registry, and pack docs.
      watchouts:
        - Maintain W1/W2/W5/W8 naming in human-facing docs.
    Asian Barometer:
      waves_in_scope: [W1, W4, W5, W6]
      approach: >
        Treat W5 as an added, distinct wave and W6 as a split country bundle.
        The atlas and structure docs must acknowledge the W6 country pieces as one wave family.
      watchouts:
        - Keep the W6 country fragments grouped under a single wave concept.
    EVS:
      waves_in_scope: [W1, W3, W4]
      approach: >
        Treat EVS 1990, 2008, and 2017 as the readable later anchors that must
        coexist with the existing EVS anchors, while EVS TREND remains excluded.
      watchouts:
        - Never promote EVS TREND into the canonical flow.
        - Be conservative about encoding quirks and source-file naming.
    GSS:
      waves_in_scope: [1972, 1973, 1984, 1993, 2002, 2010, 2016, 2024]
      approach: >
        Treat GSS as a multi-wave family where the exact loaded set matters.
        Update all docs as a family refresh, but confirm each supported wave individually.
      watchouts:
        - Preserve year-based wave labels.
    Latinobarómetro:
      waves_in_scope: [1995, 2011, 2024]
      approach: >
        Treat the accented family name as the canonical display label and keep the
        unaccented filename variants only as file-level aliases where needed.
      watchouts:
        - Do not let the alias leak into the canonical display docs.
    LiTS:
      waves_in_scope: [2006, II, III, IV]
      approach: >
        Treat LiTS as a family whose wave labels mix numeric and roman forms.
        Keep the source labels stable in human docs, but normalize internally only where the builder requires it.
      watchouts:
        - LiTS II must be handled as its own wave, not a family-wide proxy.
    South Asia:
      waves_in_scope: [W1, W2]
      approach: >
        Treat South Asia as a first-class family addition to the current scope and
        keep its two waves paired where the docs describe it.
      watchouts:
        - Preserve the South Asia naming in both source and semantic docs.
    WVS:
      waves_in_scope: [W1, W4, W7]
      approach: >
        Treat WVS as the older backbone values family, and keep it de-doubled at
        every layer that counts respondent or coverage rows.
      watchouts:
        - Any wave addition must not reintroduce duplicate respondent counts.

wave_work_items:
  - family: Afrobarometer
    waves:
      - wave: R1
        status: pending
        doc_classes:
          - source_inventory
          - structure_register
          - semantic_master
          - atlas
          - relation_registry
          - pack_docs
        handling: >
          Stable baseline wave. Rebuild only if source inventory or semantic
          mappings change.
        completion_checks:
          - Wave appears in source inventory and source-structure audits.
          - Wave is present in question_structure_register and demographic_field_register.
          - Wave is present in the semantic master and atlas outputs.
          - Wave is represented in the relation registry if it contributes relation rows.
      - wave: R5
        status: pending
        doc_classes:
          - source_inventory
          - structure_register
          - semantic_master
          - atlas
          - relation_registry
          - pack_docs
        handling: >
          Intermediate wave that carries more semantic texture than R1.
        completion_checks:
          - Wave appears in all source and semantic layers that handle Afrobarometer.
          - Afrobarometer family summary reflects the three-wave lineage.
          - No EVS TREND content is imported by mistake.
      - wave: R9
        status: pending
        doc_classes:
          - source_inventory
          - structure_register
          - semantic_master
          - atlas
          - relation_registry
          - pack_docs
        handling: >
          Later anchor wave; ensure the atlas and semantic master retain its
          richer authority/trust/livelihood texture.
        completion_checks:
          - Round 9 is visible in source inventory, structure, semantics, atlas, and relation outputs.
          - Family summary and wave summary reflect the loaded round counts.

