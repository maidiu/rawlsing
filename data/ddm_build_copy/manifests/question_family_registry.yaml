registry_version: "v1"
source_family: "GSS"
status: draft

families:
  - family_id: "gss_abortion_condition_family"
    family_type: "conditional_attitude_battery"
    family_structure_type: "conditional_attitude_battery"
    expected_multi_target: false
    family_label: "GSS abortion conditions"
    eligible_waves: ["1972", "1973", "1982", "1984", "1993", "2002", "2004", "2010", "2014", "2016", "2024"]
    minimum_items_answered: 3
    boundary_rules:
      - boundary_pattern_type: "broad_support"
        support_share_min: 0.75
        oppose_share_max: 0.25
      - boundary_pattern_type: "broad_opposition"
        oppose_share_min: 0.75
        support_share_max: 0.25
      - boundary_pattern_type: "exception_support_elective_opposition"
        require_all:
          - role: "exception_case"
            semantic_response_role: "support"
          - role: "elective_case"
            semantic_response_role: "oppose"
        optional_modifiers:
          - "social_condition"
          - "family_size_condition"
          - "economic_condition"
    response_role_rules:
      - applies_to_roles: ["exception_case", "elective_case", "social_condition", "family_size_condition", "economic_condition"]
        response_value_normalized: "1"
        semantic_response_role: "support"
        response_direction: "positive"
        polarity: "positive"
        directionality_status: "manually_authorized_directionality"
        directionality_authority_source: "question_family_registry.response_role_rules"
        validated_waves: ["1972", "1973", "1982", "1984", "1993", "2002", "2004", "2010", "2014", "2016", "2024"]
        expected_response_label_contains_any: ["yes", "allow", "legal", "favor", "approve", "support", "not remove", "retain"]
        expected_response_label_regex: "(?i)^(yes|allow|legal|favor|approve|support|okay|ok|not remove|retain)"
        codebook_contract_id: "manually_verified_gss_codebook"
        allow_unlabeled_numeric_fallback: true
        numeric_fallback_authority: "manually_verified_gss_codebook"
      - applies_to_roles: ["exception_case", "elective_case", "social_condition", "family_size_condition", "economic_condition"]
        response_value_normalized: "2"
        semantic_response_role: "oppose"
        response_direction: "negative"
        polarity: "negative"
        directionality_status: "manually_authorized_directionality"
        directionality_authority_source: "question_family_registry.response_role_rules"
        validated_waves: ["1972", "1973", "1982", "1984", "1993", "2002", "2004", "2010", "2014", "2016", "2024"]
        expected_response_label_contains_any: ["no", "not", "oppose", "disallow", "against", "reject", "ban"]
        expected_response_label_regex: "(?i)^(no|not|oppose|disallow|against|reject|ban|illegal|forbid)"
        codebook_contract_id: "manually_verified_gss_codebook"
        allow_unlabeled_numeric_fallback: true
        numeric_fallback_authority: "manually_verified_gss_codebook"
    target_resolution_rules:
      - applies_to_roles: ["exception_case", "elective_case", "social_condition", "family_size_condition", "economic_condition"]
        target_entity_id: "abortion_permission"
        target_domain: "reproductive_moral_regulation"
        permission_domain: "abortion_permission"
        target_entity_from: "fixed"
        target_condition_label_from: "condition_label"
        target_resolution_grain: "condition_label"
        target_resolution_status: "family_registry_resolved_condition"
        target_resolution_authority_source: "question_family_registry.target_resolution_rules"
        target_resolution_basis_source: "question_family_registry.item_role_groups"
    item_role_groups:
      exception_case:
        - var_code: "abdefect"
          condition_label: "fetal_defect"
        - var_code: "abhlth"
          condition_label: "woman_health"
        - var_code: "abrape"
          condition_label: "rape"
      elective_case:
        - var_code: "abany"
          condition_label: "any_reason"
      social_condition:
        - var_code: "absingle"
          condition_label: "unmarried"
      family_size_condition:
        - var_code: "abnomore"
          condition_label: "no_more_children"
      economic_condition:
        - var_code: "abpoor"
          condition_label: "low_income"

  - family_id: "gss_civil_liberties_speak_family"
    family_type: "target_selective_tolerance_battery"
