      - applies_to_roles: ["target_case"]
        response_value_normalized: "2"
        semantic_response_role: "oppose"
        response_direction: "negative"
        polarity: "negative"
        directionality_status: "inferred_from_response_family"
        directionality_authority_source: "response_option_map"
        validated_waves: ["1972", "1973", "1982", "1984", "1993", "2002", "2004", "2010", "2014", "2016", "2024"]
        expected_response_label_contains_any: ["no", "not", "oppose", "disallow", "against", "reject", "ban"]
        expected_response_label_regex: "(?i)^(no|not|oppose|disallow|against|reject|ban|illegal|forbid)"
        codebook_contract_id: "manually_verified_gss_codebook"
        allow_unlabeled_numeric_fallback: true
        numeric_fallback_authority: "manually_verified_gss_codebook"
    target_resolution_rules:
      - applies_to_roles: ["target_case"]
        target_entity_template: "outgroup_{condition_label}"
        target_domain: "civil_liberties_outgroup_tolerance"
        permission_domain: "public_expression_permission"
        target_group_label_from: "condition_label"
        target_resolution_grain: "target_group"
        target_resolution_status: "family_registry_resolved_group"
        target_resolution_authority_source: "question_family_registry.target_resolution_rules"
        target_resolution_basis_source: "question_family_registry.item_role_groups"
    item_role_groups:
      target_case:
        - var_code: "spkath"
          condition_label: "anti_religionist"
        - var_code: "spkathy"
          condition_label: "anti_religionist_y"
        - var_code: "spkcom"
          condition_label: "communist"
        - var_code: "spkcomy"
          condition_label: "communist_y"
        - var_code: "spkhomo"
          condition_label: "homosexual"
        - var_code: "spkmil"
          condition_label: "militarist"
        - var_code: "spkrac"
          condition_label: "racist"
        - var_code: "spkracy"
          condition_label: "racist_y"
        - var_code: "spksoc"
          condition_label: "socialist"

