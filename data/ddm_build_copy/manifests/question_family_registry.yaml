        expected_response_label_contains_any: ["yes", "allow", "legal", "favor", "approve", "support"]
        expected_response_label_regex: "(?i)^(yes|allow|legal|favor|approve|support|okay|ok)"
        codebook_contract_id: "manually_verified_gss_codebook"
        allow_unlabeled_numeric_fallback: true
