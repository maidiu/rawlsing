# V550J Association Threshold Profiles
# =====================================
# Threshold profiles determine statistical gates for publishable and review rows.
# Profiles are selected by effective sample size (effective_n).
# If no profile matches, the safe defaults are used (most restrictive).

profiles:
  small_survey_default:
    description: "Default for any small-N survey (N <= 3000)."
    applies_to:
      source: null
      effective_n_min: 0
      effective_n_max: 3000
    publishable_attitude:
      min_overlap: 5
      min_pattern_n: 20
      min_associated_response_total_n: 20
      min_overlap_share: 0.03
      min_abs_difference_from_baseline: 0.10
      max_distinct_response_count: 10
    review_attitude:
      min_overlap: 3
      min_associated_response_total_n: 10
      min_abs_difference_from_baseline: 0.15
      max_distinct_response_count: 15
    review_context:
      min_overlap: 5
      min_associated_response_total_n: 20
    diagnostic_occupational:
      min_overlap: 10
      min_associated_response_total_n: 20

  medium_survey_default:
    description: "Default for moderate-size surveys (N 3001-15000)."
    applies_to:
      source: null
      effective_n_min: 3001
      effective_n_max: 15000
    publishable_attitude:
      min_overlap: 10
      min_pattern_n: 40
      min_associated_response_total_n: 40
      min_overlap_share: 0.02
      min_abs_difference_from_baseline: 0.08
      max_distinct_response_count: 10
    review_attitude:
      min_overlap: 5
      min_associated_response_total_n: 20
      min_abs_difference_from_baseline: 0.12
      max_distinct_response_count: 15
    review_context:
      min_overlap: 8
      min_associated_response_total_n: 30
    diagnostic_occupational:
      min_overlap: 15
      min_associated_response_total_n: 40

  large_survey_default:
    description: "Default for large surveys (N > 15000)."
    applies_to:
      source: null
      effective_n_min: 15001
      effective_n_max: null
    publishable_attitude:
      min_overlap: 30
      min_pattern_n: 100
      min_associated_response_total_n: 100
      min_overlap_share: 0.01
      min_abs_difference_from_baseline: 0.05
      max_distinct_response_count: 10
    review_attitude:
      min_overlap: 15
      min_associated_response_total_n: 50
      min_abs_difference_from_baseline: 0.10
      max_distinct_response_count: 15
    review_context:
      min_overlap: 20
      min_associated_response_total_n: 60
    diagnostic_occupational:
      min_overlap: 30
      min_associated_response_total_n: 80
