# expectation_event_templates.yaml
# Paired fulfillment/violation templates per need_axis; targets match striving tags for event-striving targeting.
# Used for: scoring boost when event targets a striving; GiftShard/DisruptionShard creation on apply.

meta:
  age_brackets: [3, 7, 11, 14, 17, 24, 35]
  valence: [positive, negative, mixed]
  type: [fulfillment, violation, mixed]
  need_axes:
    - attachment
    - safety
    - belonging
    - status
    - competence
    - autonomy
    - meaning
    - justice
    - beauty_play
    - eros_intimacy

templates:
  - id: EV_COM_014_TEAM_MADE
    need_axis: competence
    type: fulfillment
    valence: positive
    targets: [sports, performance, coach_validation, team]
    baseline_high_impact: [hopeless, forbidden, hopeful]
    notes: "Success installs feasibility belief; increases identity_load."

  - id: EV_COM_017_CAREER_ENDING_INJURY
    need_axis: competence
    type: violation
    valence: negative
    targets: [sports, performance, team, body]
    baseline_high_impact: [entitled, hopeful]
    notes: "If identity_load on target striving is high, malheur_risk."

  - id: EV_ATT_003_RETURN_AFTER_FEAR
    need_axis: attachment
    type: fulfillment
    valence: positive
    targets: [return_to_parent, comfort, attunement]
    baseline_high_impact: [hopeless, forbidden]
    notes: "Creates GiftShard: 'people return.'"

  - id: EV_ATT_007_ABANDONMENT_EPISODE
    need_axis: attachment
    type: violation
    valence: negative
    targets: [absence, unpredictability, loss]
    baseline_high_impact: [entitled, hopeful]
    notes: "Often creates volatility + people-pleasing or withdrawal proxies."

  - id: EV_BEL_011_CHOSEN_BY_FRIEND
    need_axis: belonging
    type: fulfillment
    valence: positive
    targets: [friendship, loyalty, chosen, peer_validation]
    baseline_high_impact: [hopeless, forbidden, hopeful]
    notes: "GiftShard: 'I can be chosen.'"

  - id: EV_BEL_014_SOCIAL_EXPULSION
    need_axis: belonging
    type: violation
    valence: negative
    targets: [friend_group, humiliation, exclusion]
    baseline_high_impact: [entitled, hopeful]
    notes: "Drives subculture adoption, superiority detachment, or people-pleasing."

  - id: EV_AUT_011_TRUSTED_WITH_RESPONSIBILITY
    need_axis: autonomy
    type: fulfillment
    valence: positive
    targets: [choice, responsibility, trust, privacy_respected]
    baseline_high_impact: [forbidden, hopeless]
    notes: "GiftShard: 'I can choose without punishment.'"

  - id: EV_AUT_014_CONTROL_CLAMPDOWN
    need_axis: autonomy
    type: violation
    valence: negative
    targets: [surveillance, punishment, no_privacy, control]
    baseline_high_impact: [entitled, hopeful]
    notes: "Often spawns rebellion-style or secret competence proxies."

  # -------------------------
  # MEANING
  # -------------------------
  - id: EV_MEA_014_INTERPRETIVE_KEY_OPENS
    need_axis: meaning
    type: fulfillment
    valence: positive
    targets: [book, mentor, interpretive_key, coherence]
    baseline_high_impact: [hopeless, forbidden, hopeful]
    notes: "Key opens channel; installs feasibility belief."

  - id: EV_MEA_017_BETRAYAL_BY_MEANING_SYSTEM
    need_axis: meaning
    type: violation
    valence: negative
    targets: [hypocrisy, betrayal, meaning_collapse, authority]
    baseline_high_impact: [entitled, hopeful]
    notes: "Cynic realism or integrative reconstruction."

  - id: EV_MEA_FUL_TRANSCENDENCE_CONTACT
    need_axis: meaning
    type: fulfillment
    valence: positive
    targets: [awe, prayer_real, mystery, presence]
    baseline_high_impact: [hopeless, forbidden]
    notes: "Positive shock installs meaning scaffold."

  - id: EV_MEA_VIO_ROOTLESSNESS_SPIRAL
    need_axis: meaning
    type: violation
    valence: mixed
    targets: [rootlessness, incoherence, drifting, numbing]
    baseline_high_impact: [entitled, hopeful]
    notes: "Often yields mental-health-as-exit routing."

  # -------------------------
  # JUSTICE
  # -------------------------
  - id: EV_JUS_17_SMALL_COLLECTIVE_WIN
    need_axis: justice
    type: fulfillment
    valence: positive
    targets: [organizing, solidarity, efficacy, collective_win]
    baseline_high_impact: [hopeless, forbidden, hopeful]
    notes: "Creates efficacy memory resource."

  - id: EV_JUS_24_BETRAYAL_BY_CAUSE
    need_axis: justice
    type: violation
    valence: negative
    targets: [movement_betrayal, hypocrisy, disillusionment]
    baseline_high_impact: [entitled, hopeful]
    notes: "Cynicism or deepened structural clarity."

  - id: EV_JUS_FUL_TRUTH_WITNESS_SEEN
    need_axis: justice
    type: fulfillment
    valence: positive
    targets: [truth, witness, naming, dignity]
    baseline_high_impact: [hopeless, forbidden]
    notes: "Injustice becomes legible; can trigger organizing."

  - id: EV_JUS_VIO_PUNISHED_FOR_DISSENT
    need_axis: justice
    type: violation
    valence: negative
    targets: [dissent, punishment, retaliation, fear]
    baseline_high_impact: [entitled, hopeful]
    notes: "Often shrinks justice into rule purity or private outrage."

  # -------------------------
