# Country default labels for identity fallback
# Used when EPR, Joshua Project, and Factbook all have no data for a country.
# Each entry provides ethnicity, language, religion, and region for display.
# Note: These are coarse defaults — the identity pipeline prefers
# EPR for ethnicity, Joshua Project for religion/language, and Factbook
# for demographic shares. This file is the last-resort label surface.

# Fallback when country not in map (use empty strings so the gap is detectable)
_fallback:
  region: ""
  ethnicity: ""
  language: ""
  religion: ""

