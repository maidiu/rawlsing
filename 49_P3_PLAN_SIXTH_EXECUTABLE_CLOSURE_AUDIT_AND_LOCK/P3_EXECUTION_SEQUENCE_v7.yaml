    pair.
  exit: All pair, structure, overlay, lineage, and source-authority inputs reconcile;
    no P2 mutation.
- phase: P3A-1
  name: Instantiate contracts and identity registry
  steps:
  - Load controlled vocabularies and connected JSON schema registry.
  - Instantiate identity strategies and append-only object registry.
  - Validate logical DDL and schema dictionary agreement.
  - Load the complete identity, object-reference, hyperedge-role, and database-enforcement
    contracts.
  - Fail if any delivered/future artifact is misclassified or any registry object
    lacks an identity rule.
  exit: Every categorical field, identity, polymorphic reference, hyperedge role,
    and delivered artifact closes to an enforceable contract; templates validate.
- phase: P3A-2
  name: Normalize effective P2 authority
  steps:
  - Map all 19,175 governing pair authorities to typed pair facts.
  - Preserve superseded exact overlaps as provenance only.
  - Bind origin ruling IDs and endpoint evidence.
  exit: Every effective pair authority accounted for exactly once.
- phase: P3A-3
  name: Recover signatures and segments
  steps:
  - Recover complete field-provenanced signatures for the 399 proposition-incident
    lineages.
  - Preserve exact P2 constraint evidence for 2,897 constraint-only lineages; prioritize
    the 1,485 that touch proposition-incident lineages, and recover a full signature
    only if a real attachment, hierarchy, or adjudication case promotes them.
  - Load the exact 18,276-row imported lineage-to-implementation membership surface
    and validate one-lineage-per-implementation no-loss closure.
  - Mark 10,230 nonincident lineages as NO_CURRENT_DIRECT_PAIR_AUTHORITY without inferring
    uniqueness or exclusion.
  - Create P3 segments only for material lineage drift.
  - Resolve every pair endpoint, then emit explicit pair projections selecting one
    governed left subject and one governed right subject. Never Cartesian-expand a
    multi-segment endpoint.
  exit: Every proposition-incident subject has complete or fail-closed signature;
    every used direct relation has an explicit segment-safe pair projection.
- phase: P3A-4
  name: Construct strict response components and constraints
  steps:
  - Build strict components only from the 445 substantive PROPOSITION_RESPONSE_IDENTITY
    facts.
  - Persist every component connectivity pair projection and member; validate component
    counts, edge class, and endpoints.
  - Translate all candidate-relevant non-connective authority into scoped constraints.
  - Generate complete internal pair matrices with separate many-to-many collision
    and closure-obligation links.
  exit: No proposition-only, coordinate, redirect, negative, unresolved, administrative,
    or superseded exact ruling creates a strict component.
- phase: P3A-5
  name: Resolve proposition-only topology and generate global candidate inventory
  steps:
  - Classify all 212 substantive PROPOSITION_IDENTITY_ONLY pair projections as within-strict
    support, orphan attachment, strict-component bridge, or both-endpoints-outside-strict.
  - Use the 56 outside-strict projections to generate 25 proposition-only seed components.
  - Collapse strict components, proposition-only seeds, and attach-only singleton
    subjects into a meta-graph; each connected meta-component is one deterministic
    attachment-review group.
  - 'The actual preflight produces 22 attachment-review groups and 141 pre-signature
    candidate records: 94 strict, 25 proposition-only seed, and 22 attachment review.'
  - Persist candidate origin keys, exact component links, attachment projections,
    memberships, closure obligations, variants, and exclusions.
  - Run the executable candidate-packet semantic validator before a packet may enter
    adjudication.
  - Rank candidates lexicographically with blockers non-compensable.
  exit: All 658 proposition relations and all 19,175 direct pair authorities represented;
    all 13,526 lineages have participation status; strict and proposition-only component
    classes are non-overlapping and reconstructible.
- phase: P3A-6
  name: Pilot selection and adjudication
  steps:
  - Select at most 40 risk-stratified candidates.
  - Generate schema-valid packets and draft decisions.
  - Adjudicate with immutable final decisions.
  - Record doctrine deltas and rebuild affected surfaces.
  - Require completed decisions to partition every proposed member exactly once.
  - For SPLIT_REQUIRED, generate at least two disjoint successor candidate groups
    whose union equals the source candidate.
  - Promote candidate-owned variants and exclusions explicitly into canonical-owned
    revisions; never mutate ownership.
  exit: Pilot decisions reconstruct from evidence and become gold fixtures.
- phase: P3A-7
  name: Pilot acceptance and v27 handoff
  steps:
  - Run example, property, mutation, schema, DDL, determinism, release, and no-leak
    tests.
  - Verify cumulative archive from fresh extraction.
  - Decide whether contract scales unchanged.
  - Run artifact-lifecycle, identity-coverage, reference-type, hyperedge-role, and
    enforcement-contract tests.
  exit: P3 Contract and Pilot v6 accepted.
- phase: P3B
  name: Global candidate adjudication
  steps:
  - Adjudicate about 50 candidates per fixed tranche, reduced for collision-heavy
    work.
  - Issue release-scoped revisions, variants, exclusions, genealogy, and dependencies.
  exit: Every candidate has terminal decision.
- phase: P3C
  name: P3 closure
  steps:
  - Prove complete pair/candidate/member/exclusion/variant/genealogy/release reconciliation.
  - Issue canonical family authority release and shadow-install package.
  exit: P3 closed without measurement overreach.
- phase: P4
  name: Measurement compatibility
  steps:
  - Authorize or prohibit response transformations independently of family identity.
  exit: Measurement authority closed.
- phase: P5
  name: Strata, driver, facet, and horizon authority
  steps:
  - Map family/variant/implementation subjects and install component bridge in designated
    live repository.
  exit: Structural authority closed.
- phase: P6
  name: Shadow runtime installation
  steps:
  - Install in shadow namespace; compare V550J/V551J/V552J; promote or roll back transactionally.
  exit: Runtime authority promoted or blocked.
- phase: P7
